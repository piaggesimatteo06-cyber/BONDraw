<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>BONDraw 0.5.2</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #f4f5f7;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        sans-serif;

    color: #181a1f;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    flex-direction: column;
}


/* ================================
   HEADER
================================ */

header {
    height: 72px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background: rgba(255,255,255,.88);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(0,0,0,.07);

    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-dot {
    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #181a1f;
}

.brand-name {
    font-size: 22px;
    font-weight: 750;
    letter-spacing: -.8px;
}

.version {
    font-size: 13px;
    color: #858992;
    font-weight: 600;
}

.status {
    font-size: 13px;
    color: #858992;
    font-weight: 500;
}


/* ================================
   WORKSPACE
================================ */

#workspace {
    position: relative;

    flex: 1;
    min-height: 0;

    overflow: hidden;
}

#canvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.9),
            rgba(244,245,247,.95)
        );

    touch-action: none;
}


/* ================================
   EMPTY STATE
================================ */

#emptyState {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    pointer-events: none;

    transition: opacity .2s ease;
}

#emptyState.hidden {
    opacity: 0;
}

.empty-title {
    font-size: 24px;

    font-weight: 700;

    letter-spacing: -.6px;

    margin-bottom: 7px;
}

.empty-subtitle {
    font-size: 15px;

    color: #858992;

    line-height: 1.45;
}


/* ================================
   TOOLBAR
================================ */

#toolbar {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 6px;

    padding: 7px;

    background:
        rgba(255,255,255,.9);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border:
        1px solid rgba(0,0,0,.08);

    border-radius: 18px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.10);

    z-index: 20;
}

button {
    border: 0;
    outline: 0;

    height: 40px;

    padding:
        0 15px;

    border-radius: 12px;

    background: transparent;

    color: #686c74;

    font-family: inherit;

    font-size: 14px;
    font-weight: 650;

    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

button.active {
    background: #181a1f;
    color: white;
}

button.danger {
    color: #b04444;
}

.divider {
    width: 1px;
    height: 25px;

    background:
        rgba(0,0,0,.09);

    margin:
        0 2px;
}


/* ================================
   CHEMISTRY
================================ */

.bond {
    stroke: #202228;

    stroke-width: 2.6;

    stroke-linecap: round;

    fill: none;

    pointer-events: none;
}

.atom-circle {
    fill:
        rgba(255,255,255,.96);

    stroke: #202228;

    stroke-width: 2.4;
}

.atom-label {
    fill: #202228;

    font-size: 17px;

    font-weight: 700;

    text-anchor: middle;

    dominant-baseline: central;

    pointer-events: none;
}

.atom.pending .atom-circle {
    fill:
        rgba(255,255,255,.72);

    stroke: #999da6;

    stroke-width: 2;

    stroke-dasharray: 5 5;
}

.atom.pending .atom-label {
    fill: #999da6;
}

.rough-stroke {
    fill: none;

    stroke: #8e929b;

    stroke-width: 2;

    stroke-linecap: round;
    stroke-linejoin: round;

    opacity: .8;

    pointer-events: none;
}


/* ================================
   HINT
================================ */

#interactionHint {
    position: absolute;

    right: 18px;
    bottom: 25px;

    padding:
        8px 11px;

    border-radius: 11px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid rgba(0,0,0,.06);

    color: #888c94;

    font-size: 12px;
    font-weight: 550;

    pointer-events: none;
}

@media (max-width: 650px) {

    header {
        height: 64px;
        padding: 0 15px;
    }

    .brand-name {
        font-size: 20px;
    }

    .status {
        display: none;
    }

    #toolbar {
        bottom: 14px;
    }

    button {
        padding:
            0 12px;
    }

    #interactionHint {
        display: none;
    }
}

</style>
</head>


<body>

<header>

    <div class="brand">

        <div class="logo-dot"></div>

        <div class="brand-name">
            BONDraw
        </div>

        <div class="version">
            0.5.2
        </div>

    </div>

    <div
        class="status"
        id="status">

        Pencil creates · Finger moves

    </div>

</header>


<div id="workspace">

<svg
    id="canvas"
    xmlns="http://www.w3.org/2000/svg">

    <g id="bondLayer"></g>

    <g id="atomLayer"></g>

    <g id="strokeLayer"></g>

</svg>


<div id="emptyState">

    <div class="empty-title">
        Draw chemistry naturally.
    </div>

    <div class="empty-subtitle">
        Use Apple Pencil to create atoms and bonds.<br>
        Use your finger to move atoms.
    </div>

</div>


<div id="interactionHint">
    🖊️ Create &nbsp;·&nbsp; 👆 Move
</div>


<div id="toolbar">

    <button
        id="createBtn"
        class="active">

        Create

    </button>

    <button id="moveBtn">
        Move
    </button>

    <button id="eraseBtn">
        Erase
    </button>

    <div class="divider"></div>

    <button id="undoBtn">
        Undo
    </button>

    <button
        id="clearBtn"
        class="danger">

        Clear

    </button>

</div>

</div>


<script>

/* ============================================================
   BONDraw 0.5.2

   Pencil = CREATE
   Finger = MOVE SINGLE ATOM

   Long press:
   SELECT MOLECULE

   Recognition:
   - strict circle detection
   - score-based H recognition
   - score-based C recognition
   - competitive letter classification
============================================================ */


/* ============================================================
   DOM
============================================================ */

const canvas =
    document.getElementById("canvas");

const atomLayer =
    document.getElementById("atomLayer");

const bondLayer =
    document.getElementById("bondLayer");

const strokeLayer =
    document.getElementById("strokeLayer");

const emptyState =
    document.getElementById("emptyState");

const status =
    document.getElementById("status");

const createBtn =
    document.getElementById("createBtn");

const moveBtn =
    document.getElementById("moveBtn");

const eraseBtn =
    document.getElementById("eraseBtn");

const undoBtn =
    document.getElementById("undoBtn");

const clearBtn =
    document.getElementById("clearBtn");


/* ============================================================
   CHEMICAL MODEL
============================================================ */

let atoms = [];

let bonds = [];

let nextAtomId = 1;

let nextBondId = 1;


const ATOM_RADIUS = {

    C: 27,

    H: 23

};


const VALENCE = {

    C: 4,

    H: 1

};


/* ============================================================
   HISTORY
============================================================ */

const history = [];


function saveHistory() {

    history.push({

        atoms:
            JSON.parse(
                JSON.stringify(atoms)
            ),

        bonds:
            JSON.parse(
                JSON.stringify(bonds)
            )

    });

    if (history.length > 50) {

        history.shift();

    }

}


/* ============================================================
   MODE
============================================================ */

let manualMode = "create";


function setManualMode(mode) {

    manualMode = mode;

    createBtn.classList.toggle(
        "active",
        mode === "create"
    );

    moveBtn.classList.toggle(
        "active",
        mode === "move"
    );

    eraseBtn.classList.toggle(
        "active",
        mode === "erase"
    );

}


createBtn.onclick = () =>
    setManualMode("create");

moveBtn.onclick = () =>
    setManualMode("move");

eraseBtn.onclick = () =>
    setManualMode("erase");


/* ============================================================
   PENDING ATOM
============================================================ */

let pendingAtom = null;


/* ============================================================
   UNDO / CLEAR
============================================================ */

undoBtn.onclick = () => {

    if (!history.length) return;

    const previous =
        history.pop();

    atoms =
        previous.atoms;

    bonds =
        previous.bonds;


    pendingAtom =
        atoms.find(
            atom =>
                atom.pending === true
        ) || null;


    render();

};


clearBtn.onclick = () => {

    if (
        !atoms.length &&
        !bonds.length
    ) return;

    saveHistory();

    atoms = [];

    bonds = [];

    pendingAtom = null;

    render();

};


/* ============================================================
   HELPERS
============================================================ */

function getAtom(id) {

    return atoms.find(
        atom =>
            atom.id === id
    );

}


function getRadius(atom) {

    return (
        ATOM_RADIUS[
            atom.element
        ] || 27
    );

}


function getValence(atom) {

    return bonds.reduce(
        (sum,bond) => {

            if (
                bond.a === atom.id ||
                bond.b === atom.id
            ) {

                return sum + bond.order;

            }

            return sum;

        },
        0
    );

}


function canAddBond(
    atomA,
    atomB,
    order
) {

    if (
        !atomA ||
        !atomB
    ) return false;

    const maxA =
        VALENCE[
            atomA.element
        ] || 4;

    const maxB =
        VALENCE[
            atomB.element
        ] || 4;

    return (

        getValence(atomA)
        + order
        <= maxA

        &&

        getValence(atomB)
        + order
        <= maxB

    );

}


/* ============================================================
   ATOM HIT TEST
============================================================ */

function findAtomAt(x,y) {

    for (
        let i = atoms.length - 1;
        i >= 0;
        i--
    ) {

        const atom =
            atoms[i];

        const radius =
            getRadius(atom) + 8;

        if (
            Math.hypot(
                atom.x-x,
                atom.y-y
            ) <= radius
        ) {

            return atom;

        }

    }

    return null;

}


/* ============================================================
   BOND HIT TEST
============================================================ */

function pointToSegmentDistance(
    px,
    py,
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2-x1;

    const dy =
        y2-y1;

    if (
        dx === 0 &&
        dy === 0
    ) {

        return Math.hypot(
            px-x1,
            py-y1
        );

    }

    const t =
        Math.max(
            0,
            Math.min(
                1,
                (
                    (px-x1)*dx +
                    (py-y1)*dy
                ) /
                (dx*dx + dy*dy)
            )
        );

    const cx =
        x1+t*dx;

    const cy =
        y1+t*dy;

    return Math.hypot(
        px-cx,
        py-cy
    );

}


function findBondAt(x,y) {

    for (
        let i = bonds.length-1;
        i >= 0;
        i--
    ) {

        const bond =
            bonds[i];

        const a =
            getAtom(bond.a);

        const b =
            getAtom(bond.b);

        if (!a || !b) continue;

        const d =
            pointToSegmentDistance(
                x,
                y,
                a.x,
                a.y,
                b.x,
                b.y
            );

        if (d < 12) {

            return bond;

        }

    }

    return null;

}


/* ============================================================
   SVG RENDERING
============================================================ */

const atomElements =
    new Map();

const bondElements =
    new Map();


function createAtomElement(atom) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.setAttribute(
        "class",
        "atom"
    );

    group.dataset.atomId =
        atom.id;


    const circle =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    circle.setAttribute(
        "class",
        "atom-circle"
    );


    const label =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    label.setAttribute(
        "class",
        "atom-label"
    );


    group.appendChild(circle);

    group.appendChild(label);

    atomLayer.appendChild(group);

    atomElements.set(
        atom.id,
        group
    );

    return group;

}


function updateAtomElement(atom) {

    let group =
        atomElements.get(
            atom.id
        );

    if (!group) {

        group =
            createAtomElement(atom);

    }


    group.setAttribute(
        "transform",
        `translate(${atom.x} ${atom.y})`
    );


    const circle =
        group.querySelector(
            ".atom-circle"
        );

    const label =
        group.querySelector(
            ".atom-label"
        );


    circle.setAttribute(
        "r",
        getRadius(atom)
    );


    label.textContent =
        atom.element || "?";


    group.classList.toggle(
        "pending",
        atom.pending === true
    );

}


function createBondElement(bond) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.dataset.bondId =
        bond.id;

    bondLayer.appendChild(group);

    bondElements.set(
        bond.id,
        group
    );

    return group;

}


function updateBondElement(
    bond,
    group
) {

    const a =
        getAtom(bond.a);

    const b =
        getAtom(bond.b);

    if (!a || !b) return;


    group.innerHTML = "";


    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;

    const length =
        Math.hypot(dx,dy);

    if (length === 0) return;


    const ux =
        dx/length;

    const uy =
        dy/length;


    const nx =
        -uy;

    const ny =
        ux;


    const startRadius =
        getRadius(a);

    const endRadius =
        getRadius(b);


    const startX =
        a.x + ux*startRadius;

    const startY =
        a.y + uy*startRadius;

    const endX =
        b.x - ux*endRadius;

    const endY =
        b.y - uy*endRadius;


    const spacing = 6;


    let offsets;


    if (
        bond.order === 1
    ) {

        offsets = [0];

    }
    else if (
        bond.order === 2
    ) {

        offsets = [
            -spacing/2,
            spacing/2
        ];

    }
    else {

        offsets = [
            -spacing,
            0,
            spacing
        ];

    }


    offsets.forEach(
        offset => {

            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );

            line.setAttribute(
                "class",
                "bond"
            );

            line.setAttribute(
                "x1",
                startX + nx*offset
            );

            line.setAttribute(
                "y1",
                startY + ny*offset
            );

            line.setAttribute(
                "x2",
                endX + nx*offset
            );

            line.setAttribute(
                "y2",
                endY + ny*offset
            );

            group.appendChild(line);

        }
    );

}


function render() {

    atomElements.forEach(
        element =>
            element.remove()
    );

    bondElements.forEach(
        element =>
            element.remove()
    );


    atomElements.clear();

    bondElements.clear();


    bonds.forEach(
        bond => {

            const group =
                createBondElement(
                    bond
                );

            updateBondElement(
                bond,
                group
            );

        }
    );


    atoms.forEach(
        atom => {

            createAtomElement(
                atom
            );

            updateAtomElement(
                atom
            );

        }
    );


    emptyState.classList.toggle(
        "hidden",
        atoms.length > 0
    );

}


function updateAtomAndItsBonds(
    atom
) {

    updateAtomElement(
        atom
    );


    bonds.forEach(
        bond => {

            if (
                bond.a === atom.id ||
                bond.b === atom.id
            ) {

                const group =
                    bondElements.get(
                        bond.id
                    );

                if (group) {

                    updateBondElement(
                        bond,
                        group
                    );

                }

            }

        }
    );

}


/* ============================================================
   BOND CREATION
============================================================ */

function findBondBetween(
    atomA,
    atomB
) {

    return bonds.find(
        bond =>

            (
                bond.a === atomA.id &&
                bond.b === atomB.id
            )

            ||

            (
                bond.a === atomB.id &&
                bond.b === atomA.id
            )
    );

}


function connectAtoms(
    atomA,
    atomB
) {

    if (
        !atomA ||
        !atomB ||
        atomA.id === atomB.id
    ) {

        return;

    }


    const existing =
        findBondBetween(
            atomA,
            atomB
        );


    saveHistory();


    if (!existing) {

        if (
            !canAddBond(
                atomA,
                atomB,
                1
            )
        ) {

            history.pop();

            return;

        }


        bonds.push({

            id:
                nextBondId++,

            a:
                atomA.id,

            b:
                atomB.id,

            order:
                1

        });

    }
    else {

        const nextOrder =
            existing.order === 3
                ? 1
                : existing.order + 1;


        const maxA =
            VALENCE[
                atomA.element
            ] || 4;

        const maxB =
            VALENCE[
                atomB.element
            ] || 4;


        const valenceA =
            getValence(atomA)
            - existing.order;

        const valenceB =
            getValence(atomB)
            - existing.order;


        if (
            valenceA + nextOrder > maxA ||
            valenceB + nextOrder > maxB
        ) {

            history.pop();

            return;

        }


        existing.order =
            nextOrder;

    }


    render();

}


/* ============================================================
   DELETE
============================================================ */

function removeAtom(atom) {

    if (!atom) return;

    saveHistory();


    if (
        pendingAtom &&
        pendingAtom.id === atom.id
    ) {

        pendingAtom = null;

    }


    bonds =
        bonds.filter(
            bond =>
                bond.a !== atom.id &&
                bond.b !== atom.id
        );


    atoms =
        atoms.filter(
            item =>
                item.id !== atom.id
        );


    render();

}


function removeBond(bond) {

    if (!bond) return;

    saveHistory();


    bonds =
        bonds.filter(
            item =>
                item.id !== bond.id
        );


    render();

}


/* ============================================================
   STROKE UTILITIES
============================================================ */

function strokeBounds(points) {

    if (!points.length)
        return null;


    let minX = Infinity;
    let maxX = -Infinity;

    let minY = Infinity;
    let maxY = -Infinity;


    points.forEach(
        point => {

            minX =
                Math.min(
                    minX,
                    point.x
                );

            maxX =
                Math.max(
                    maxX,
                    point.x
                );

            minY =
                Math.min(
                    minY,
                    point.y
                );

            maxY =
                Math.max(
                    maxY,
                    point.y
                );

        }
    );


    return {

        minX,
        maxX,
        minY,
        maxY,

        width:
            maxX-minX,

        height:
            maxY-minY

    };

}


function resampleStroke(
    points,
    count = 32
) {

    if (
        points.length < 2
    ) {

        return points.slice();

    }


    const lengths = [0];

    let total = 0;


    for (
        let i=1;
        i<points.length;
        i++
    ) {

        total +=
            Math.hypot(
                points[i].x -
                points[i-1].x,

                points[i].y -
                points[i-1].y
            );

        lengths.push(total);

    }


    if (total === 0)
        return points.slice();


    const result = [];


    for (
        let i=0;
        i<count;
        i++
    ) {

        const target =
            total *
            i /
            (count-1);


        let index = 1;


        while (
            index < lengths.length &&
            lengths[index] < target
        ) {

            index++;

        }


        if (
            index >= lengths.length
        ) {

            result.push(
                points[
                    points.length-1
                ]
            );

            continue;

        }


        const l1 =
            lengths[index-1];

        const l2 =
            lengths[index];


        const ratio =
            (target-l1) /
            (l2-l1 || 1);


        const p1 =
            points[index-1];

        const p2 =
            points[index];


        result.push({

            x:
                p1.x +
                (p2.x-p1.x)*ratio,

            y:
                p1.y +
                (p2.y-p1.y)*ratio

        });

    }


    return result;

}


function normalizeStroke(
    points
) {

    const sampled =
        resampleStroke(
            points,
            32
        );


    if (!sampled.length)
        return [];


    let minX = Infinity;
    let maxX = -Infinity;

    let minY = Infinity;
    let maxY = -Infinity;


    sampled.forEach(
        p => {

            minX =
                Math.min(
                    minX,
                    p.x
                );

            maxX =
                Math.max(
                    maxX,
                    p.x
                );

            minY =
                Math.min(
                    minY,
                    p.y
                );

            maxY =
                Math.max(
                    maxY,
                    p.y
                );

        }
    );


    const width =
        Math.max(
            maxX-minX,
            1
        );

    const height =
        Math.max(
            maxY-minY,
            1
        );


    const size =
        Math.max(
            width,
            height
        );


    return sampled.map(
        p => ({

            x:
                (
                    p.x -
                    (minX+maxX)/2
                ) / size,

            y:
                (
                    p.y -
                    (minY+maxY)/2
                ) / size

        })
    );

}


/* ============================================================
   STRICT CIRCLE DETECTOR
============================================================ */

function isCircle(points) {

    if (
        points.length < 18
    ) {

        return false;

    }


    const box =
        strokeBounds(points);


    if (!box)
        return false;


    const width =
        box.width;

    const height =
        box.height;


    if (
        width < 28 ||
        height < 28
    ) {

        return false;

    }


    const ratio =
        Math.min(
            width,
            height
        ) /
        Math.max(
            width,
            height
        );


    if (
        ratio < .72
    ) {

        return false;

    }


    const first =
        points[0];

    const last =
        points[
            points.length-1
        ];


    const closure =
        Math.hypot(
            first.x-last.x,
            first.y-last.y
        );


    const diameter =
        Math.max(
            width,
            height
        );


    if (
        closure >
        diameter*.28
    ) {

        return false;

    }


    const centerX =
        (
            box.minX +
            box.maxX
        ) / 2;

    const centerY =
        (
            box.minY +
            box.maxY
        ) / 2;


    const expectedRadius =
        (
            width +
            height
        ) / 4;


    let radialError = 0;


    points.forEach(
        point => {

            const radius =
                Math.hypot(
                    point.x-centerX,
                    point.y-centerY
                );


            radialError +=
                Math.abs(
                    radius -
                    expectedRadius
                );

        }
    );


    radialError /=
        points.length;


    if (
        radialError >
        expectedRadius*.24
    ) {

        return false;

    }


    let pathLength = 0;


    for (
        let i=1;
        i<points.length;
        i++
    ) {

        pathLength +=
            Math.hypot(
                points[i].x -
                points[i-1].x,

                points[i].y -
                points[i-1].y
            );

    }


    const expectedCircumference =
        Math.PI * diameter;


    const circumferenceRatio =
        pathLength /
        expectedCircumference;


    if (
        circumferenceRatio < .65 ||
        circumferenceRatio > 1.55
    ) {

        return false;

    }


    return true;

}


/* ============================================================
   RECOGNITION HELPERS
============================================================ */

/*
    Restituisce un valore compreso tra 0 e 1.

    0 = caratteristica praticamente assente
    1 = caratteristica molto forte
*/

function clamp01(value) {

    return Math.max(
        0,
        Math.min(
            1,
            value
        )
    );

}


function rangeScore(
    value,
    idealMin,
    idealMax,
    tolerance
) {

    if (
        value >= idealMin &&
        value <= idealMax
    ) {

        return 1;

    }


    if (value < idealMin) {

        return clamp01(
            1 -
            (
                idealMin-value
            ) /
            tolerance
        );

    }


    return clamp01(
        1 -
        (
            value-idealMax
        ) /
        tolerance
    );

}


/* ============================================================
   H SCORE
============================================================ */

/*
    La H non viene più riconosciuta con una singola
    condizione.

    Costruiamo invece un punteggio sulla base di:

    - due lati verticali
    - altezza dei due lati
    - barra orizzontale centrale
    - presenza a sinistra/destra
    - rapporto larghezza/altezza
    - bassa presenza di diagonali
    - bassa curvatura

    Questo rende il riconoscimento molto più tollerante
    rispetto alla velocità e allo stile della scrittura.
*/

function recognizeHScore(points) {

    if (
        points.length < 8
    ) {

        return 0;

    }


    const box =
        strokeBounds(points);


    if (!box) {

        return 0;

    }


    const width =
        box.width;

    const height =
        box.height;


    if (
        width < 10 ||
        height < 14
    ) {

        return 0;

    }


    const aspect =
        width / height;


    const aspectScore =
        rangeScore(
            aspect,
            .25,
            1.20,
            .70
        );


    const centerX =
        (
            box.minX +
            box.maxX
        ) / 2;


    const centerY =
        (
            box.minY +
            box.maxY
        ) / 2;


    let leftCount = 0;
    let rightCount = 0;


    let leftMinY = Infinity;
    let leftMaxY = -Infinity;

    let rightMinY = Infinity;
    let rightMaxY = -Infinity;


    points.forEach(
        p => {

            if (
                p.x < centerX
            ) {

                leftCount++;

                leftMinY =
                    Math.min(
                        leftMinY,
                        p.y
                    );

                leftMaxY =
                    Math.max(
                        leftMaxY,
                        p.y
                    );

            }
            else {

                rightCount++;

                rightMinY =
                    Math.min(
                        rightMinY,
                        p.y
                    );

                rightMaxY =
                    Math.max(
                        rightMaxY,
                        p.y
                    );

            }

        }
    );


    const leftRatio =
        leftCount /
        points.length;

    const rightRatio =
        rightCount /
        points.length;


    const sideBalance =
        1 -
        Math.min(
            1,
            Math.abs(
                leftRatio -
                rightRatio
            ) * 2.5
        );


    const leftHeight =
        Math.max(
            0,
            leftMaxY -
            leftMinY
        );

    const rightHeight =
        Math.max(
            0,
            rightMaxY -
            rightMinY
        );


    const leftCoverage =
        clamp01(
            leftHeight /
            (height * .72)
        );

    const rightCoverage =
        clamp01(
            rightHeight /
            (height * .72)
        );


    let totalLength = 0;

    let verticalLeftLength = 0;

    let verticalRightLength = 0;

    let centralHorizontalLength = 0;

    let diagonalLength = 0;

    let horizontalLength = 0;

    let verticalLength = 0;


    for (
        let i=1;
        i<points.length;
        i++
    ) {

        const p1 =
            points[i-1];

        const p2 =
            points[i];


        const dx =
            p2.x-p1.x;

        const dy =
            p2.y-p1.y;


        const absDx =
            Math.abs(dx);

        const absDy =
            Math.abs(dy);


        const length =
            Math.hypot(
                dx,
                dy
            );


        if (
            length < .5
        ) {

            continue;

        }


        totalLength += length;


        const midX =
            (
                p1.x +
                p2.x
            ) / 2;


        const midY =
            (
                p1.y +
                p2.y
            ) / 2;


        /*
            Segmento verticale.
        */

        if (
            absDy >
            absDx * 1.55
        ) {

            verticalLength +=
                length;


            if (
                midX <
                centerX -
                width * .18
            ) {

                verticalLeftLength +=
                    length;

            }


            if (
                midX >
                centerX +
                width * .18
            ) {

                verticalRightLength +=
                    length;

            }

        }


        /*
            Segmento orizzontale.
        */

        if (
            absDx >
            absDy * 1.70
        ) {

            horizontalLength +=
                length;


            if (
                Math.abs(
                    midY -
                    centerY
                ) <
                height * .27
            ) {

                centralHorizontalLength +=
                    length;

            }

        }


        /*
            Segmento diagonale.
        */

        if (
            absDx >
            length * .30 &&
            absDy >
            length * .30
        ) {

            diagonalLength +=
                length;

        }

    }


    if (
        totalLength <= 0
    ) {

        return 0;

    }


    const verticalLeftRatio =
        verticalLeftLength /
        totalLength;

    const verticalRightRatio =
        verticalRightLength /
        totalLength;


    const horizontalCentralRatio =
        centralHorizontalLength /
        totalLength;


    const diagonalRatio =
        diagonalLength /
        totalLength;


    const verticalStructureScore =
        (
            clamp01(
                verticalLeftRatio /
                .20
            )
            +
            clamp01(
                verticalRightRatio /
                .20
            )
        ) / 2;


    const horizontalStructureScore =
        clamp01(
            centralHorizontalLength /
            (width * .32)
        );


    const diagonalScore =
        clamp01(
            1 -
            diagonalRatio /
            .45
        );


    /*
        Una H deve avere una quantità significativa
        di struttura verticale.
    */

    const verticalDominance =
        totalLength > 0
            ? verticalLength /
              totalLength
            : 0;


    const verticalDominanceScore =
        clamp01(
            verticalDominance /
            .38
        );


    /*
        Una H normalmente non è molto curva.
        Qui misuriamo indirettamente la presenza
        di segmenti fortemente orientati.
    */

    const directionalStructure =
        clamp01(
            (
                verticalLength +
                horizontalLength
            ) /
            totalLength /
            .72
        );


    /*
        Punteggio finale.

        La struttura verticale e la barra centrale
        hanno il peso maggiore.
    */

    const score =

        verticalStructureScore * .28

        +

        horizontalStructureScore * .25

        +

        (
            leftCoverage *
            rightCoverage
        ) * .15

        +

        sideBalance * .08

        +

        aspectScore * .08

        +

        verticalDominanceScore * .07

        +

        directionalStructure * .05

        +

        diagonalScore * .04;


    return clamp01(score);

}


/* ============================================================
   C SCORE
============================================================ */

/*
    La C viene valutata cercando:

    - estremità separate verticalmente
    - estremità non troppo lontane orizzontalmente
    - traiettoria molto più lunga della corda diretta
    - forte presenza sul lato sinistro
    - bassa quantità di segmenti orizzontali
    - struttura curva

    Questo permette di distinguerla meglio
    dalla H.
*/

function recognizeCScore(points) {

    if (
        points.length < 8
    ) {

        return 0;

    }


    const box =
        strokeBounds(points);


    if (!box) {

        return 0;

    }


    const width =
        box.width;

    const height =
        box.height;


    if (
        width < 8 ||
        height < 10
    ) {

        return 0;

    }


    const aspect =
        width / height;


    const aspectScore =
        rangeScore(
            aspect,
            .35,
            1.20,
            .75
        );


    const first =
        points[0];

    const last =
        points[
            points.length-1
        ];


    const endpointYDifference =
        Math.abs(
            first.y -
            last.y
        );


    const endpointYScore =
        clamp01(
            endpointYDifference /
            (height * .45)
        );


    const endpointXDifference =
        Math.abs(
            first.x -
            last.x
        );


    const endpointXScore =
        clamp01(
            1 -
            endpointXDifference /
            (width * .75)
        );


    let pathLength = 0;


    for (
        let i=1;
        i<points.length;
        i++
    ) {

        pathLength +=
            Math.hypot(
                points[i].x -
                points[i-1].x,

                points[i].y -
                points[i-1].y
            );

    }


    const directDistance =
        Math.hypot(
            last.x -
            first.x,

            last.y -
            first.y
        );


    let curvatureScore = 0;


    if (
        directDistance > 0
    ) {

        const curvatureRatio =
            pathLength /
            directDistance;


        curvatureScore =
            clamp01(
                (
                    curvatureRatio -
                    1.25
                ) /
                1.10
            );

    }


    const centerX =
        (
            box.minX +
            box.maxX
        ) / 2;

    const centerY =
        (
            box.minY +
            box.maxY
        ) / 2;


    let leftCount = 0;
    let rightCount = 0;

    let upper = false;
    let lower = false;


    points.forEach(
        p => {

            if (
                p.x < centerX
            ) {

                leftCount++;

            }
            else {

                rightCount++;

            }


            if (
                p.y <
                centerY -
                height * .12
            ) {

                upper = true;

            }


            if (
                p.y >
                centerY +
                height * .12
            ) {

                lower = true;

            }

        }
    );


    const leftRatio =
        leftCount /
        points.length;


    const rightRatio =
        rightCount /
        points.length;


    const leftScore =
        clamp01(
            leftRatio /
            .50
        );


    /*
        Una C può naturalmente avere alcuni punti
        sul lato destro, ma non deve essere simmetrica
        come una H.
    */

    const rightPenalty =
        clamp01(
            rightRatio /
            .58
        );


    const openShapeScore =
        (
            upper &&
            lower
        )
            ? 1
            : 0;


    let horizontalLength = 0;

    let diagonalLength = 0;


    for (
        let i=1;
        i<points.length;
        i++
    ) {

        const dx =
            Math.abs(
                points[i].x -
                points[i-1].x
            );

        const dy =
            Math.abs(
                points[i].y -
                points[i-1].y
            );


        const segmentLength =
            Math.hypot(
                dx,
                dy
            );


        if (
            dx >
            dy * 2.5
        ) {

            horizontalLength +=
                segmentLength;

        }


        if (
            dx >
            segmentLength * .30 &&
            dy >
            segmentLength * .30
        ) {

            diagonalLength +=
                segmentLength;

        }

    }


    const horizontalRatio =
        totalSafeRatio(
            horizontalLength,
            pathLength
        );


    const diagonalRatio =
        totalSafeRatio(
            diagonalLength,
            pathLength
        );


    const horizontalScore =
        clamp01(
            1 -
            horizontalRatio /
            .60
        );


    const diagonalScore =
        clamp01(
            1 -
            diagonalRatio /
            .60
        );


    /*
        La C deve avere più struttura curva che struttura
        verticale/orizzontale rigida.
    */

    const curvatureDominance =
        clamp01(
            curvatureScore *
            (
                1 -
                verticalLikeRatio(points)
            )
        );


    /*
        La C deve avere una forte "apertura":
        gli estremi devono essere separati soprattutto
        verticalmente.
    */

    const openingScore =
        (
            endpointYScore * .65
            +
            endpointXScore * .35
        );


    /*
        Penalizzazione forte se la forma mostra
        una struttura molto simmetrica sinistra/destra.
    */

    const asymmetryScore =
        clamp01(
            1 -
            Math.abs(
                leftRatio -
                rightRatio
            )
        );


    const score =

        openingScore * .19

        +

        curvatureScore * .25

        +

        leftScore * .16

        +

        openShapeScore * .08

        +

        horizontalScore * .10

        +

        diagonalScore * .05

        +

        curvatureDominance * .10

        +

        (
            1 -
            asymmetryScore
        ) * .07;


    /*
        Una forma estremamente verticale con due lati
        paralleli è molto più probabilmente H che C.
    */

    const hLike =
        verticalLikeRatio(points);


    const hPenalty =
        clamp01(
            (
                hLike -
                .30
            ) /
            .35
        );


    const finalScore =
        clamp01(
            score *
            (
                1 -
                hPenalty * .65
            )
        );


    return finalScore;

}


/* ============================================================
   SMALL GEOMETRIC HELPERS
============================================================ */

function totalSafeRatio(
    value,
    total
) {

    if (
        total <= 0
    ) {

        return 0;

    }

    return value / total;

}


function verticalLikeRatio(points) {

    if (
        points.length < 2
    ) {

        return 0;

    }


    let total = 0;

    let vertical = 0;


    for (
        let i=1;
        i<points.length;
        i++
    ) {

        const dx =
            points[i].x -
            points[i-1].x;

        const dy =
            points[i].y -
            points[i-1].y;


        const length =
            Math.hypot(
                dx,
                dy
            );


        if (
            length < .5
        ) {

            continue;

        }


        total += length;


        if (
            Math.abs(dy) >
            Math.abs(dx) * 1.55
        ) {

            vertical += length;

        }

    }


    if (
        total <= 0
    ) {

        return 0;

    }


    return vertical / total;

}


/* ============================================================
   LETTER RECOGNITION
============================================================ */

/*
    Ora C e H competono tra loro.

    Non basta più che una forma soddisfi una lista
    di condizioni.

    Ogni lettera produce un punteggio.

    La lettera viene accettata solo se:

    1. supera una soglia minima;
    2. è sufficientemente migliore dell'altra.

    Questo evita molte classificazioni casuali.
*/

function recognizeElement(points) {

    if (
        points.length < 8
    ) {

        return null;

    }


    const hScore =
        recognizeHScore(
            points
        );


    const cScore =
        recognizeCScore(
            points
        );


    /*
        Se entrambe sono deboli,
        non indoviniamo.
    */

    if (
        hScore < .48 &&
        cScore < .48
    ) {

        return null;

    }


    /*
        H nettamente migliore della C.
    */

    if (
        hScore >= .52 &&
        hScore > cScore + .08
    ) {

        return "H";

    }


    /*
        C nettamente migliore della H.
    */

    if (
        cScore >= .52 &&
        cScore > hScore + .08
    ) {

        return "C";

    }


    /*
        Caso in cui una delle due è chiaramente
        molto forte anche se la differenza è piccola.
    */

    if (
        hScore >= .70 &&
        hScore >= cScore
    ) {

        return "H";

    }


    if (
        cScore >= .70 &&
        cScore >= hScore
    ) {

        return "C";

    }


    /*
        Ambiguità:
        meglio lasciare ? che creare
        un elemento sbagliato.
    */

    return null;

}


/* ============================================================
   REMOVE PENDING ATOM
============================================================ */

/*
    Rimuove esclusivamente il pending atom.

    NON chiama render() da solo:
    la funzione viene usata come parte
    di un'operazione più grande.
*/

function removePendingAtom() {

    if (!pendingAtom) {
        return;
    }


    const pendingId =
        pendingAtom.id;


    bonds =
        bonds.filter(
            bond =>
                bond.a !== pendingId &&
                bond.b !== pendingId
        );


    atoms =
        atoms.filter(
            atom =>
                atom.id !== pendingId
        );


    pendingAtom = null;

}


/* ============================================================
   CREATE PENDING ATOM
============================================================ */

function createPendingAtom(
    x,
    y
) {

    const nearby =
        atoms.find(
            atom =>
                !atom.pending &&
                Math.hypot(
                    atom.x - x,
                    atom.y - y
                ) < 30
        );


    if (nearby) {

        return null;

    }


    saveHistory();


    if (pendingAtom) {

        removePendingAtom();

    }


    const atom = {

        id:
            nextAtomId++,

        x,
        y,

        element:
            "?",

        pending:
            true

    };


    atoms.push(atom);


    pendingAtom =
        atom;


    render();


    return atom;

}


/* ============================================================
   FINALIZE PENDING ATOM
============================================================ */

function finalizePendingAtom(
    atom,
    element
) {

    if (!atom) {
        return;
    }


    if (!element) {

        atom.element =
            "?";

        atom.pending =
            true;

        pendingAtom =
            atom;

        render();

        return;

    }


    atom.element =
        element;

    atom.pending =
        false;


    pendingAtom = null;


    render();

}


/* ============================================================
   LIVE STROKE
============================================================ */

let currentStroke = [];


function drawLiveStroke() {

    strokeLayer.innerHTML = "";


    if (
        currentStroke.length < 2
    ) {

        return;

    }


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    let d =
        `M ${currentStroke[0].x} ${currentStroke[0].y}`;


    for (
        let i=1;
        i<currentStroke.length;
        i++
    ) {

        d +=
            ` L ${currentStroke[i].x} ${currentStroke[i].y}`;

    }


    path.setAttribute(
        "d",
        d
    );


    path.setAttribute(
        "class",
        "rough-stroke"
    );


    strokeLayer.appendChild(
        path
    );

}


/* ============================================================
   FINALIZE PEN STROKE
============================================================ */

function finalizeCreateStroke() {

    if (
        !currentStroke.length
    ) {

        return;

    }


    const points =
        currentStroke.slice();


    currentStroke = [];

    strokeLayer.innerHTML = "";


    /*
        ========================================================
        1. CIRCLE
        ========================================================
    */

    if (
        isCircle(points)
    ) {

        const box =
            strokeBounds(points);


        if (box) {

            createPendingAtom(

                (
                    box.minX +
                    box.maxX
                ) / 2,

                (
                    box.minY +
                    box.maxY
                ) / 2

            );

        }


        return;

    }


    /*
        ========================================================
        2. LETTER INSIDE PENDING ATOM
        ========================================================
    */

    if (
        pendingAtom
    ) {

        const element =
            recognizeElement(
                points
            );


        finalizePendingAtom(
            pendingAtom,
            element
        );


        return;

    }


    /*
        ========================================================
        3. BOND
        ========================================================
    */

    const start =
        points[0];

    const end =
        points[
            points.length-1
        ];


    const atomA =
        findAtomAt(
            start.x,
            start.y
        );


    const atomB =
        findAtomAt(
            end.x,
            end.y
        );


    if (
        atomA &&
        atomB &&
        atomA.id !== atomB.id
    ) {

        connectAtoms(
            atomA,
            atomB
        );

        return;

    }


    /*
        Fallback per estremi
        leggermente imperfetti.
    */

    const nearStart =
        findAtomAt(
            start.x,
            start.y
        );


    const nearEnd =
        findAtomAt(
            end.x,
            end.y
        );


    if (
        nearStart &&
        nearEnd &&
        nearStart.id !== nearEnd.id
    ) {

        connectAtoms(
            nearStart,
            nearEnd
        );

    }

}


/* ============================================================
   POINTER STATE — BONDraw 0.6
============================================================ */

let activePointer = null;

let selectedAtom = null;

let selectedMolecule = new Set();

let dragStart = null;

let originalAtomPosition = null;

let originalMoleculePositions = new Map();

let longPressTimer = null;

let longPressTriggered = false;

let movementStarted = false;

let historySavedForDrag = false;


/* ============================================================
   LONG PRESS SETTINGS
============================================================ */

const LONG_PRESS_DURATION = 550;

const LONG_PRESS_MOVE_THRESHOLD = 10;


/* ============================================================
   MOLECULE SELECTION
============================================================ */

function getConnectedMolecule(startAtom) {

    const connected = new Set();

    if (!startAtom) {
        return connected;
    }


    const queue = [startAtom.id];

    connected.add(startAtom.id);


    while (queue.length) {

        const currentId =
            queue.shift();


        bonds.forEach(bond => {

            let nextId = null;


            if (bond.a === currentId) {

                nextId = bond.b;

            }
            else if (bond.b === currentId) {

                nextId = bond.a;

            }


            if (
                nextId !== null &&
                !connected.has(nextId)
            ) {

                connected.add(nextId);

                queue.push(nextId);

            }

        });

    }


    return connected;

}


/* ============================================================
   PREPARE MOLECULE DRAG
============================================================ */

function prepareMoleculeDrag() {

    selectedMolecule =
        getConnectedMolecule(
            selectedAtom
        );


    originalMoleculePositions =
        new Map();


    selectedMolecule.forEach(
        atomId => {

            const atom =
                getAtom(atomId);


            if (!atom) return;


            originalMoleculePositions.set(
                atomId,
                {
                    x: atom.x,
                    y: atom.y
                }
            );

        }
    );

}


/* ============================================================
   UPDATE WHOLE MOLECULE
============================================================ */

function updateMoleculeAndItsBonds() {

    selectedMolecule.forEach(
        atomId => {

            const atom =
                getAtom(atomId);


            if (!atom) return;


            updateAtomElement(atom);

        }
    );


    const affectedBonds =
        new Set();


    bonds.forEach(
        bond => {

            if (
                selectedMolecule.has(bond.a) ||
                selectedMolecule.has(bond.b)
            ) {

                affectedBonds.add(
                    bond.id
                );

            }

        }
    );


    affectedBonds.forEach(
        bondId => {

            const bond =
                bonds.find(
                    item =>
                        item.id === bondId
                );


            if (!bond) return;


            const group =
                bondElements.get(
                    bond.id
                );


            if (group) {

                updateBondElement(
                    bond,
                    group
                );

            }

        }
    );

}


/* ============================================================
   INTERACTION TYPE
============================================================ */

function getInteractionType(
    event
) {

    if (
        event.pointerType === "pen"
    ) {

        return "create";

    }


    if (
        event.pointerType === "touch"
    ) {

        return "move";

    }


    return manualMode;

}


/* ============================================================
   CANVAS COORDINATES
============================================================ */

function getCanvasPoint(
    event
) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };

}


/* ============================================================
   CANCEL LONG PRESS
============================================================ */

function cancelLongPress() {

    if (
        longPressTimer !== null
    ) {

        clearTimeout(
            longPressTimer
        );

        longPressTimer = null;

    }

}


/* ============================================================
   START LONG PRESS
============================================================ */

function startLongPress() {

    cancelLongPress();


    longPressTimer =
        setTimeout(
            () => {

                longPressTimer = null;


                if (
                    movementStarted ||
                    !selectedAtom
                ) {

                    return;

                }


                longPressTriggered =
                    true;


                prepareMoleculeDrag();


                status.textContent =
                    "Molecule selected · Drag to move";

            },
            LONG_PRESS_DURATION
        );

}


/* ============================================================
   POINTER DOWN
============================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();


        const point =
            getCanvasPoint(
                event
            );


        const interaction =
            getInteractionType(
                event
            );


        activePointer = {

            id:
                event.pointerId,

            type:
                interaction,

            pointerType:
                event.pointerType

        };


        selectedAtom = null;

        selectedMolecule =
            new Set();

        dragStart = null;

        originalAtomPosition = null;

        originalMoleculePositions =
            new Map();

        longPressTriggered =
            false;

        movementStarted =
            false;

        historySavedForDrag =
            false;


        cancelLongPress();


        /*
            ERASE
        */

        if (
            manualMode === "erase"
        ) {

            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );


            if (atom) {

                removeAtom(atom);

                activePointer = null;

                return;

            }


            const bond =
                findBondAt(
                    point.x,
                    point.y
                );


            if (bond) {

                removeBond(bond);

                activePointer = null;

                return;

            }


            activePointer = null;

            return;

        }


        /*
            FINGER = MOVE / SELECT
        */

        if (
            interaction === "move"
        ) {

            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );


            if (!atom) {

                activePointer = null;

                return;

            }


            selectedAtom =
                atom;


            dragStart = {

                x:
                    point.x,

                y:
                    point.y

            };


            originalAtomPosition = {

                x:
                    atom.x,

                y:
                    atom.y

            };


            prepareMoleculeDrag();


            canvas.setPointerCapture(
                event.pointerId
            );


            startLongPress();


            return;

        }


        /*
            PENCIL = CREATE
        */

        if (
            interaction === "create"
        ) {

            currentStroke = [
                point
            ];


            canvas.setPointerCapture(
                event.pointerId
            );


            drawLiveStroke();

        }

    },
    {
        passive:false
    }
);


/* ============================================================
   POINTER MOVE
============================================================ */

canvas.addEventListener(
    "pointermove",
    event => {

        if (
            !activePointer ||
            activePointer.id !==
            event.pointerId
        ) {

            return;

        }


        event.preventDefault();


        const point =
            getCanvasPoint(
                event
            );


        /*
            ====================================================
            FINGER
            ====================================================
        */

        if (
            activePointer.type ===
            "move" &&
            selectedAtom
        ) {

            const dx =
                point.x -
                dragStart.x;


            const dy =
                point.y -
                dragStart.y;


            const movementDistance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                !longPressTriggered &&
                movementDistance >
                LONG_PRESS_MOVE_THRESHOLD
            ) {

                cancelLongPress();

            }


            /*
                MOVIMENTO SINGOLO ATOMO
            */

            if (
                !longPressTriggered
            ) {

                if (
                    !historySavedForDrag &&
                    movementDistance > 0
                ) {

                    saveHistory();

                    historySavedForDrag =
                        true;

                }


                selectedAtom.x =
                    originalAtomPosition.x +
                    dx;


                selectedAtom.y =
                    originalAtomPosition.y +
                    dy;


                movementStarted =
                    movementDistance > 0;


                updateAtomAndItsBonds(
                    selectedAtom
                );


                return;

            }


            /*
                MOVIMENTO INTERA MOLECOLA
            */

            if (
                longPressTriggered
            ) {

                if (
                    !historySavedForDrag &&
                    movementDistance > 0
                ) {

                    saveHistory();

                    historySavedForDrag =
                        true;

                }


                selectedMolecule.forEach(
                    atomId => {

                        const atom =
                            getAtom(atomId);


                        const original =
                            originalMoleculePositions.get(
                                atomId
                            );


                        if (
                            !atom ||
                            !original
                        ) {

                            return;

                        }


                        atom.x =
                            original.x +
                            dx;


                        atom.y =
                            original.y +
                            dy;

                    }
                );


                movementStarted =
                    movementDistance > 0;


                updateMoleculeAndItsBonds();


                return;

            }

        }


        /*
            ====================================================
            PENCIL
            ====================================================
        */

        if (
            activePointer.type ===
            "create"
        ) {

            currentStroke.push(
                point
            );


            drawLiveStroke();

        }

    },
    {
        passive:false
    }
);


/* ============================================================
   POINTER FINISH
============================================================ */

function finishPointer(
    event
) {

    if (
        !activePointer ||
        activePointer.id !==
        event.pointerId
    ) {

        return;

    }


    event.preventDefault();


    cancelLongPress();


    /*
        ========================================================
        FINGER
        ========================================================
    */

    if (
        activePointer.type ===
        "move"
    ) {

        selectedAtom = null;

        selectedMolecule =
            new Set();

        dragStart = null;

        originalAtomPosition = null;

        originalMoleculePositions =
            new Map();

        longPressTriggered =
            false;

        movementStarted =
            false;

        historySavedForDrag =
            false;

        status.textContent =
            "Pencil creates · Finger moves";

    }


    /*
        ========================================================
        PENCIL
        ========================================================
    */

    if (
        activePointer.type ===
        "create"
    ) {

        finalizeCreateStroke();

    }


    /*
        RILASCIO POINTER CAPTURE
    */

    if (
        canvas.hasPointerCapture(
            event.pointerId
        )
    ) {

        canvas.releasePointerCapture(
            event.pointerId
        );

    }


    activePointer =
        null;

}


/* ============================================================
   POINTER UP
============================================================ */

canvas.addEventListener(
    "pointerup",
    finishPointer,
    {
        passive:false
    }
);


/* ============================================================
   POINTER CANCEL
============================================================ */

canvas.addEventListener(
    "pointercancel",
    finishPointer,
    {
        passive:false
    }
);


/* ============================================================
   INITIAL RENDER
============================================================ */

render();


status.textContent =
    "Pencil creates · Finger moves";

</script>
