<body>

<div id="workspace">

<script>
/* BONDraw 0.8.2 — hexagonal molecular grid and vertex snapping. */
const $=id=>document.getElementById(id);
const canvas=$("canvas"),gridLayer=$("gridLayer"),atomLayer=$("atomLayer"),bondLayer=$("bondLayer"),strokeLayer=$("strokeLayer"),emptyState=$("emptyState"),status=$("status"),moleculeMenu=$("moleculeMenu");
const GRID={side:68,snapRadiusMixed:13,snapRadiusHex:25};
let gridMode="off";
let atoms=[],bonds=[],nextAtomId=1,nextBondId=1,pendingAtom=null;
const ATOM_RADIUS={C:27,H:23,O:30,N:27};
const VALENCE={C:4,H:1,O:2,N:3};
const BOND_BREAK_SPEED=1.45,BOND_BREAK_OUTWARD_SPEED=1.30,BOND_BREAK_WINDOW_MS=85,BOND_BREAK_MIN_ALIGNMENT=0.90;
let moleculeClipboard=null,moleculeMenuAnchor=null,moleculeMenuAtom=null,lastPasteTime=0;
const activePenPointers=new Set(),activeTouchPointers=new Set();
function registerPointer(e){if(e.pointerType==="pen")activePenPointers.add(e.pointerId);if(e.pointerType==="touch")activeTouchPointers.add(e.pointerId)}
function unregisterPointer(e){if(e.pointerType==="pen")activePenPointers.delete(e.pointerId);if(e.pointerType==="touch")activeTouchPointers.delete(e.pointerId)}
function shouldIgnoreTouch(e){return e.pointerType==="touch"&&(activePenPointers.size>0||activeTouchPointers.size>1)}
function canPasteNow(){const now=performance.now();if(now-lastPasteTime<350)return false;lastPasteTime=now;return true}
const history=[];
function saveHistory(){history.push({atoms:JSON.parse(JSON.stringify(atoms)),bonds:JSON.parse(JSON.stringify(bonds))});if(history.length>50)history.shift()}
let manualMode="create";
function setManualMode(mode){manualMode=mode;$("createBtn").classList.toggle("active",mode==="create");$("moveBtn").classList.toggle("active",mode==="move");$("eraseBtn").classList.toggle("active",mode==="erase")}
$("createBtn").onclick=()=>setManualMode("create");$("moveBtn").onclick=()=>setManualMode("move");$("eraseBtn").onclick=()=>setManualMode("erase");
function getGridModeLabel(){return gridMode==="off"?"Grid: Off":gridMode==="mixed"?"Grid: Mixed":"Grid: Hex"}
function updateGridButton(){const button=$("gridBtn");button.textContent=getGridModeLabel();button.classList.toggle("active",gridMode!=="off");canvas.classList.toggle("grid-mixed",gridMode==="mixed");canvas.classList.toggle("grid-hex",gridMode==="hex")}
function renderGrid(){
 gridLayer.replaceChildren();
 if(gridMode==="off"){updateGridButton();return}
 const width=canvas.clientWidth||1,height=canvas.clientHeight||1,side=GRID.side,stepY=side*Math.sqrt(3)/2,cx=width/2,cy=height/2;
 const iLimit=Math.ceil(width/side+height/stepY)+3,jLimit=Math.ceil(height/stepY)+3;
 let d="";
 for(let j=-jLimit;j<=jLimit;j++){
  for(let i=-iLimit;i<=iLimit;i++){
   const x=cx+i*side+j*side/2,y=cy+j*stepY;
   const rightX=x+side,rightY=y;
   const upperRightX=x+side/2,upperRightY=y+stepY;
   const lowerRightX=x+side/2,lowerRightY=y-stepY;
   d+=`M${x.toFixed(2)} ${y.toFixed(2)}L${rightX.toFixed(2)} ${rightY.toFixed(2)}`;
   d+=`M${x.toFixed(2)} ${y.toFixed(2)}L${upperRightX.toFixed(2)} ${upperRightY.toFixed(2)}`;
   d+=`M${x.toFixed(2)} ${y.toFixed(2)}L${lowerRightX.toFixed(2)} ${lowerRightY.toFixed(2)}`;
  }
 }
 const path=svgElement("path","grid-lines");path.setAttribute("d",d);gridLayer.appendChild(path);updateGridButton();
}
function nearestGridVertex(x,y){
 const width=canvas.clientWidth||1,height=canvas.clientHeight||1,side=GRID.side,stepY=side*Math.sqrt(3)/2,cx=width/2,cy=height/2;
 const relY=y-cy,jGuess=Math.round(relY/stepY),relX=x-cx;
 const iGuess=Math.round((relX-jGuess*side/2)/side);let best=null,bestDistance=Infinity;
 for(let j=jGuess-2;j<=jGuess+2;j++)for(let i=iGuess-2;i<=iGuess+2;i++){
  const candidate={x:cx+i*side+j*side/2,y:cy+j*stepY};
  const distance=Math.hypot(candidate.x-x,candidate.y-y);
  if(distance<bestDistance){bestDistance=distance;best=candidate}
 }
 return best?{...best,distance:bestDistance}:null;
}
function snapPointIfClose(x,y){
 if(gridMode==="off")return {x,y,snapped:false};
 const nearest=nearestGridVertex(x,y),limit=gridMode==="hex"?GRID.snapRadiusHex:GRID.snapRadiusMixed;
 return nearest&&nearest.distance<=limit?{x:nearest.x,y:nearest.y,snapped:true}:{x,y,snapped:false};
}
$("gridBtn").onclick=()=>{gridMode=gridMode==="off"?"mixed":gridMode==="mixed"?"hex":"off";renderGrid();status.textContent=gridMode==="off"?"Grid disabled":gridMode==="mixed"?"Grid mixed · soft snapping":"Hex grid · snapping active"};
window.addEventListener("resize",renderGrid);
$("undoBtn").onclick=()=>{closeMoleculeMenu();if(!history.length)return;const previous=history.pop();atoms=previous.atoms;bonds=previous.bonds;pendingAtom=atoms.find(a=>a.pending===true)||null;nextAtomId=Math.max(1,...atoms.map(a=>a.id+1));nextBondId=Math.max(1,...bonds.map(b=>b.id+1));render()};
$("clearBtn").onclick=()=>{closeMoleculeMenu();if(!atoms.length&&!bonds.length)return;saveHistory();atoms=[];bonds=[];pendingAtom=null;render()};
function getAtom(id){return atoms.find(a=>a.id===id)}
function getRadius(a){return ATOM_RADIUS[a.element]||27}
function getBondsForAtom(a){return a?bonds.filter(b=>b.a===a.id||b.b===a.id):[]}
function getValence(a){return getBondsForAtom(a).reduce((sum,b)=>sum+b.order,0)}
function canAddBond(a,b,order){return !!a&&!!b&&getValence(a)+order<=(VALENCE[a.element]||4)&&getValence(b)+order<=(VALENCE[b.element]||4)}
function findAtomAt(x,y){for(let i=atoms.length-1;i>=0;i--){const a=atoms[i];if(Math.hypot(a.x-x,a.y-y)<=getRadius(a)+8)return a}return null}
function pointToSegmentDistance(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;if(!dx&&!dy)return Math.hypot(px-x1,py-y1);const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
function findBondAt(x,y){for(let i=bonds.length-1;i>=0;i--){const b=bonds[i],a=getAtom(b.a),c=getAtom(b.b);if(a&&c&&pointToSegmentDistance(x,y,a.x,a.y,c.x,c.y)<12)return b}return null}
const atomElements=new Map(),bondElements=new Map(),NS="http://www.w3.org/2000/svg";
function svgElement(tag,cls){const el=document.createElementNS(NS,tag);if(cls)el.setAttribute("class",cls);return el}
function createAtomElement(a){const g=svgElement("g","atom");g.dataset.atomId=a.id;g.append(svgElement("circle","atom-circle"),svgElement("text","atom-label"));atomLayer.appendChild(g);atomElements.set(a.id,g);return g}
function updateAtomElement(a){let g=atomElements.get(a.id);if(!g)g=createAtomElement(a);g.setAttribute("transform",`translate(${a.x} ${a.y})`);g.querySelector(".atom-circle").setAttribute("r",getRadius(a));g.querySelector(".atom-label").textContent=a.element||"?";g.classList.toggle("pending",a.pending===true)}
function createBondElement(b){const g=svgElement("g");g.dataset.bondId=b.id;bondLayer.appendChild(g);bondElements.set(b.id,g);return g}
function updateBondElement(b,g){const a=getAtom(b.a),c=getAtom(b.b);if(!a||!c)return;g.replaceChildren();const dx=c.x-a.x,dy=c.y-a.y,length=Math.hypot(dx,dy);if(length===0)return;const ux=dx/length,uy=dy/length,nx=-uy,ny=ux;const x1=a.x+ux*getRadius(a),y1=a.y+uy*getRadius(a),x2=c.x-ux*getRadius(c),y2=c.y-uy*getRadius(c),spacing=6,offsets=b.order===1?[0]:b.order===2?[-3,3]:[-spacing,0,spacing];offsets.forEach(offset=>{const line=svgElement("line","bond");line.setAttribute("x1",x1+nx*offset);line.setAttribute("y1",y1+ny*offset);line.setAttribute("x2",x2+nx*offset);line.setAttribute("y2",y2+ny*offset);g.appendChild(line)})}
function render(){atomElements.forEach(el=>el.remove());bondElements.forEach(el=>el.remove());atomElements.clear();bondElements.clear();bonds.forEach(b=>updateBondElement(b,createBondElement(b)));atoms.forEach(a=>updateAtomElement(a));emptyState.classList.toggle("hidden",atoms.length>0)}
function updateAtomAndItsBonds(a){updateAtomElement(a);getBondsForAtom(a).forEach(b=>{const g=bondElements.get(b.id);if(g)updateBondElement(b,g)})}
function findBondBetween(a,b){return bonds.find(item=>(item.a===a.id&&item.b===b.id)||(item.a===b.id&&item.b===a.id))}
function connectAtoms(a,b){if(!a||!b||a.id===b.id||a.pending||b.pending)return;const existing=findBondBetween(a,b);saveHistory();if(!existing){if(!canAddBond(a,b,1)){history.pop();return}bonds.push({id:nextBondId++,a:a.id,b:b.id,order:1})}else{const nextOrder=existing.order===3?1:existing.order+1,va=getValence(a)-existing.order,vb=getValence(b)-existing.order;if(va+nextOrder>(VALENCE[a.element]||4)||vb+nextOrder>(VALENCE[b.element]||4)){history.pop();return}existing.order=nextOrder}render()}
function removeAtom(a){if(!a)return;saveHistory();if(pendingAtom&&pendingAtom.id===a.id)pendingAtom=null;bonds=bonds.filter(b=>b.a!==a.id&&b.b!==a.id);atoms=atoms.filter(item=>item.id!==a.id);render()}
function removeBond(b){if(!b)return;saveHistory();bonds=bonds.filter(item=>item.id!==b.id);render()}
function strokeBounds(points){if(!points.length)return null;let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;points.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});return {minX,maxX,minY,maxY,width:maxX-minX,height:maxY-minY}}
function resampleStroke(points,count=32){if(points.length<2)return points.slice();const lengths=[0];let total=0;for(let i=1;i<points.length;i++){total+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);lengths.push(total)}if(total===0)return points.slice();const result=[];for(let i=0;i<count;i++){const target=total*i/(count-1);let index=1;while(index<lengths.length&&lengths[index]<target)index++;if(index>=lengths.length){result.push(points[points.length-1]);continue}const ratio=(target-lengths[index-1])/(lengths[index]-lengths[index-1]||1),a=points[index-1],b=points[index];result.push({x:a.x+(b.x-a.x)*ratio,y:a.y+(b.y-a.y)*ratio})}return result}
function normalizeStroke(points){const sampled=resampleStroke(points,32);if(!sampled.length)return [];const box=strokeBounds(sampled),size=Math.max(box.width,box.height,1);return sampled.map(p=>({x:(p.x-(box.minX+box.maxX)/2)/size,y:(p.y-(box.minY+box.maxY)/2)/size}))}
function isAtomSketch(points){
 /* Riconosce sia cerchi precisi e chiusi sia abbozzi ovali, veloci e aperti.
    Il criterio dei cerchi regolari è separato da quello degli abbozzi: un tratto
    liscio non viene penalizzato solo perché ha poca irregolarità locale. */
 if(!points||points.length<7)return false;
 const box=strokeBounds(points);if(!box)return false;
 const w=box.width,h=box.height,diameter=Math.max(w,h),minor=Math.min(w,h);
 if(minor<14||diameter<22)return false;
 const aspect=w/Math.max(1,h);
 if(aspect<.30||aspect>3.2)return false;
 let pathLength=0,totalTurn=0,ellipseError=0,angularTravel=0;
 for(let i=1;i<points.length;i++)pathLength+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);
 const first=points[0],last=points[points.length-1];
 const endpointGap=Math.hypot(last.x-first.x,last.y-first.y);
 const gapRatio=endpointGap/diameter;
 const cx=(box.minX+box.maxX)/2,cy=(box.minY+box.maxY)/2;
 const rx=Math.max(1,w/2),ry=Math.max(1,h/2);
 let previousAngle=null;
 for(const p of points){
  const nx=(p.x-cx)/rx,ny=(p.y-cy)/ry;
  ellipseError+=Math.abs(Math.sqrt(nx*nx+ny*ny)-1);
  const angle=Math.atan2(ny,nx);
  if(previousAngle!==null){let delta=angle-previousAngle;while(delta>Math.PI)delta-=2*Math.PI;while(delta< -Math.PI)delta+=2*Math.PI;angularTravel+=Math.abs(delta)}
  previousAngle=angle;
 }
 ellipseError/=points.length;
 // Rotazione totale: il cerchio preciso resta riconoscibile anche se il tratto è liscio.
 for(let i=2;i<points.length;i++){
  const p0=points[i-2],p1=points[i-1],p2=points[i];
  const ax=p1.x-p0.x,ay=p1.y-p0.y,bx=p2.x-p1.x,by=p2.y-p1.y;
  if(Math.hypot(ax,ay)<1||Math.hypot(bx,by)<1)continue;
  totalTurn+=Math.abs(Math.atan2(ax*by-ay*bx,ax*bx+ay*by));
 }
 const pathRatio=pathLength/diameter;
 const nearCircularAspect=aspect>=.62&&aspect<=1.62;
 // Criterio dedicato a cerchi regolari: circonferenza ~ pi * diametro,
 // chiusura buona e rotazione quasi completa.
 const smoothClosedCircle=
  nearCircularAspect&&
  gapRatio<.38&&
  pathRatio>=2.0&&pathRatio<=4.8&&
  ellipseError<.36&&
  angularTravel>=Math.PI*1.45;
 // Criterio permissivo per gli abbozzi già riconosciuti bene: ovali, cerchi storti e aperti.
 const roughLoop=
  pathRatio>1.12&&
  totalTurn>1.8&&
  ellipseError<1.02&&
  gapRatio<1.18&&
  angularTravel>Math.PI*1.05;
 return smoothClosedCircle||roughLoop;
}
function isBondStroke(points,a,b){
 if(!a||!b||a.id===b.id||points.length<2)return false;
 const first=points[0],last=points[points.length-1];
 const direct=Math.hypot(last.x-first.x,last.y-first.y);if(direct<12)return false;
 let pathLength=0,maxDeviation=0;
 for(let i=1;i<points.length;i++)pathLength+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);
 if(pathLength/direct>1.20)return false;
 for(const p of points)maxDeviation=Math.max(maxDeviation,pointToSegmentDistance(p.x,p.y,first.x,first.y,last.x,last.y));
 return maxDeviation<Math.max(10,direct*.14);
}
function clamp01(v){return Math.max(0,Math.min(1,v))}
function rangeScore(v,min,max,tolerance){if(v>=min&&v<=max)return 1;return v<min?clamp01(1-(min-v)/tolerance):clamp01(1-(v-max)/tolerance)}

const LONG_PRESS_DURATION=550,LONG_PRESS_MOVE_THRESHOLD=10;

function getCanvasPoint(e){const rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top}}
function eraseAlongSegment(from,to){
 const hitAtoms=atoms.filter(a=>pointToSegmentDistance(a.x,a.y,from.x,from.y,to.x,to.y)<=getRadius(a)+4);
 const removedIds=new Set(hitAtoms.map(a=>a.id));
 const hitBonds=bonds.filter(b=>{if(removedIds.has(b.a)||removedIds.has(b.b))return false;const a=getAtom(b.a),c=getAtom(b.b);return !!a&&!!c&&pointToSegmentDistance((a.x+c.x)/2,(a.y+c.y)/2,from.x,from.y,to.x,to.y)<=13||!!a&&!!c&&segmentsNear(from,to,a,c,11)});
 if(!hitAtoms.length&&!hitBonds.length)return false;
 if(!eraseGestureSaved){saveHistory();eraseGestureSaved=true}
 if(removedIds.size){atoms=atoms.filter(a=>!removedIds.has(a.id));bonds=bonds.filter(b=>!removedIds.has(b.a)&&!removedIds.has(b.b));if(pendingAtom&&removedIds.has(pendingAtom.id))pendingAtom=null}
 if(hitBonds.length){const ids=new Set(hitBonds.map(b=>b.id));bonds=bonds.filter(b=>!ids.has(b.id))}
 render();status.textContent="Erasing…";return true;
}
function segmentsNear(p1,p2,p3,p4,threshold){
 const d1=pointToSegmentDistance(p1.x,p1.y,p3.x,p3.y,p4.x,p4.y),d2=pointToSegmentDistance(p2.x,p2.y,p3.x,p3.y,p4.x,p4.y),d3=pointToSegmentDistance(p3.x,p3.y,p1.x,p1.y,p2.x,p2.y),d4=pointToSegmentDistance(p4.x,p4.y,p1.x,p1.y,p2.x,p2.y);
 return Math.min(d1,d2,d3,d4)<=threshold;
}
function cancelLongPress(){if(longPressTimer!==null){clearTimeout(longPressTimer);longPressTimer=null}}
function startLongPress(){cancelLongPress();longPressTimer=setTimeout(()=>{longPressTimer=null;if(movementStarted||!selectedAtom)return;longPressTriggered=true;prepareMoleculeDrag();status.textContent="Molecule selected · Drag to move"},LONG_PRESS_DURATION)}
function startPencilMenuLongPress(point,atom){cancelLongPress();longPressTimer=setTimeout(()=>{longPressTimer=null;if(movementStarted)return;pencilMenuTriggered=true;currentStroke=[];strokeLayer.replaceChildren();openMoleculeMenu(atom||null,point.x,point.y)},LONG_PRESS_DURATION)}
function resetVelocity(point,time){velocitySamples=[{x:point.x,y:point.y,t:time}]}
function addVelocitySample(point,time){const last=velocitySamples[velocitySamples.length-1];if(last&&time<=last.t)return;velocitySamples.push({x:point.x,y:point.y,t:time});while(velocitySamples.length>2&&time-velocitySamples[1].t>BOND_BREAK_WINDOW_MS)velocitySamples.shift();if(velocitySamples.length>30)velocitySamples.shift()}
function getFingerVelocity(){if(velocitySamples.length<2)return null;const first=velocitySamples[0],last=velocitySamples[velocitySamples.length-1],elapsed=last.t-first.t;if(elapsed<=0)return null;const vx=(last.x-first.x)/elapsed,vy=(last.y-first.y)/elapsed;return {vx,vy,speed:Math.hypot(vx,vy)}}
function tryBreakTerminalBond(atom){if(!atom||atom.pending||bondBreakTriggered||longPressTriggered)return false;const attached=getBondsForAtom(atom);if(attached.length!==1)return false;const bond=attached[0],neighbor=getAtom(bond.a===atom.id?bond.b:bond.a);if(!neighbor)return false;const velocity=getFingerVelocity();if(!velocity)return false;const dx=atom.x-neighbor.x,dy=atom.y-neighbor.y,length=Math.hypot(dx,dy);if(length<1)return false;const outwardX=dx/length,outwardY=dy/length,outwardSpeed=velocity.vx*outwardX+velocity.vy*outwardY,directionAlignment=velocity.speed>0?outwardSpeed/velocity.speed:0;if(velocity.speed<BOND_BREAK_SPEED||outwardSpeed<BOND_BREAK_OUTWARD_SPEED||directionAlignment<BOND_BREAK_MIN_ALIGNMENT)return false;saveHistory();bonds=bonds.filter(b=>b.id!==bond.id);bondBreakTriggered=true;render();status.textContent="Bond broken · Atom detached";return true}
function resetPointerState(){cancelLongPress();activePointer=null;selectedAtom=null;selectedMolecule=new Set();dragStart=null;originalAtomPosition=null;originalMoleculePositions=new Map();longPressTriggered=false;movementStarted=false;historySavedForDrag=false;pencilMenuTriggered=false;bondBreakTriggered=false;velocitySamples=[];eraseGestureSaved=false;eraseLastPoint=null}
canvas.addEventListener("pointerdown",e=>{registerPointer(e);if(shouldIgnoreTouch(e))return;e.preventDefault();if(activePointer&&activePointer.id!==e.pointerId)return;const point=getCanvasPoint(e),interaction=getInteractionType(e);resetPointerState();activePointer={id:e.pointerId,type:interaction,pointerType:e.pointerType};try{canvas.setPointerCapture(e.pointerId)}catch(error){}if(manualMode==="erase"){activePointer.type="erase";eraseLastPoint={...point};eraseAlongSegment(point,point);return}if(interaction==="move"){const atom=findAtomAt(point.x,point.y);if(!atom){if(hasMoleculeClipboard()&&canPasteNow())pasteMolecule(point.x,point.y);resetPointerState();unregisterPointer(e);return}selectedAtom=atom;dragStart={...point};originalAtomPosition={x:atom.x,y:atom.y};resetVelocity(point,performance.now());prepareMoleculeDrag();startLongPress();return}if(interaction==="create"){selectedAtom=findAtomAt(point.x,point.y);dragStart={...point};startPencilMenuLongPress(point,selectedAtom)}},{passive:false});
canvas.addEventListener("pointermove",e=>{if(!activePointer||activePointer.id!==e.pointerId)return;e.preventDefault();const point=getCanvasPoint(e);if(activePointer.type==="erase"){if(eraseLastPoint)eraseAlongSegment(eraseLastPoint,point);eraseLastPoint={...point};return}if(activePointer.type==="move"&&selectedAtom){const dx=point.x-dragStart.x,dy=point.y-dragStart.y,movementDistance=Math.hypot(dx,dy);if(!longPressTriggered&&movementDistance>LONG_PRESS_MOVE_THRESHOLD)cancelLongPress();if(!longPressTriggered){if(!historySavedForDrag&&movementDistance>0){saveHistory();historySavedForDrag=true}selectedAtom.x=originalAtomPosition.x+dx;selectedAtom.y=originalAtomPosition.y+dy;addVelocitySample(point,performance.now());tryBreakTerminalBond(selectedAtom);movementStarted=movementDistance>0;updateAtomAndItsBonds(selectedAtom);return}if(!historySavedForDrag&&movementDistance>0){saveHistory();historySavedForDrag=true}selectedMolecule.forEach(id=>{const atom=getAtom(id),original=originalMoleculePositions.get(id);if(!atom||!original)return;atom.x=original.x+dx;atom.y=original.y+dy});movementStarted=movementDistance>0;updateMoleculeAndItsBonds();return}if(activePointer.type==="create"){if(!pencilMenuTriggered&&currentStroke.length===0&&dragStart){const dx=point.x-dragStart.x,dy=point.y-dragStart.y;if(Math.hypot(dx,dy)>LONG_PRESS_MOVE_THRESHOLD){cancelLongPress();const startPoint={...dragStart};selectedAtom=null;moleculeClipboard=null;currentStroke=[startPoint,point];dragStart=null;movementStarted=true;drawLiveStroke()}return}if(pencilMenuTriggered)return;currentStroke.push(point);drawLiveStroke()}},{passive:false});
function snapMovedSelection(){
 if(gridMode==="off"||!selectedAtom||!movementStarted)return false;
 const snapped=snapPointIfClose(selectedAtom.x,selectedAtom.y);if(!snapped.snapped)return false;
 const dx=snapped.x-selectedAtom.x,dy=snapped.y-selectedAtom.y;if(Math.hypot(dx,dy)<.1)return false;
 if(longPressTriggered){selectedMolecule.forEach(id=>{const atom=getAtom(id);if(atom){atom.x+=dx;atom.y+=dy}})}
 else{selectedAtom.x=snapped.x;selectedAtom.y=snapped.y}
 render();return true;
}
function finishPointer(e){if(!activePointer||activePointer.id!==e.pointerId){unregisterPointer(e);return}e.preventDefault();cancelLongPress();if(activePointer.type==="create"){if(pencilMenuTriggered){currentStroke=[];strokeLayer.replaceChildren()}else if(currentStroke.length)finalizeCreateStroke()}if(activePointer.type==="move"){snapMovedSelection();status.textContent="Pencil creates · Finger moves"}else if(activePointer.type==="erase"){status.textContent="Erase · Pencil or finger"}try{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}catch(error){}resetPointerState();unregisterPointer(e)}
canvas.addEventListener("pointerup",finishPointer,{passive:false});canvas.addEventListener("pointercancel",finishPointer,{passive:false});
["touchstart","touchmove","touchend","touchcancel"].forEach(type=>{canvas.addEventListener(type,e=>e.preventDefault(),{passive:false})});
render();renderGrid();status.textContent="Pencil creates · Finger moves";
</script>
</body>
