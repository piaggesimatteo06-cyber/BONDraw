function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function elementFromStroke(p){if(p.length<6)return"C";let minX=Math.min(...p.map(x=>x.x)),maxX=Math.max(...p.map(x=>x.x)),minY=Math.min(...p.map(x=>x.y)),maxY=Math.max(...p.map(x=>x.y)),w=maxX-minX,h=maxY-minY,g=Math.hypot(p[0].x-p.at(-1).x,p[0].y-p.at(-1).y)/Math.max(w,h,1);if(w>10&&h>10&&w/h>.55&&w/h<1.7&&g<.42)return"O";return"C"}function isCircle(p){if(p.length<7)return false;let w=Math.max(...p.map(x=>x.x))-Math.min(...p.map(x=>x.x)),h=Math.max(...p.map(x=>x.y))-Math.min(...p.map(x=>x.y));return Math.min(w,h)>14&&w/h>.38&&w/h<2.6}function isStraight(p){if(p.length<2)return false;let a=p[0],b=p.at(-1),d=Math.hypot(b.x-a.x,b.y-a.y);if(d<12)return false;return p.every(q=>distSeg(q.x,q.y,a.x,a.y,b.x,b.y)<Math.max(10,d*.14))}
let active=null,stroke=[],selected=null,origin=null,longTimer=null,menuShown=false,eraseSaved=false;
function stopLong(){if(longTimer){clearTimeout(longTimer);longTimer=null}}function addBond(a,b){if(!a||!b||a===b)return;let old=bonds.find(x=>(x.a===a.id&&x.b===b.id)||(x.a===b.id&&x.b===a.id));save();if(!old){if(canAddBond(a,b,1))bonds.push({id:nextBondId++,a:a.id,b:b.id,order:1});else history.pop()}else{let next=old.order===3?1:old.order+1,delta=next-old.order;if(canAddBond(a,b,delta))old.order=next;else history.pop()}render()}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();if(active)return;let p=point(e);active={id:e.pointerId,type:e.pointerType==="pen"?"create":e.pointerType==="touch"?"move":manualMode};canvas.setPointerCapture?.(e.pointerId);if(active.type==="erase"){active.last=p;return}if(active.type==="move"){selected=findAtom(p.x,p.y);origin=selected?{x:selected.x,y:selected.y,px:p.x,py:p.y}:null;if(!selected&&moleculeClipboard?.atoms?.length&&canPaste()){paste(p.x,p.y);active=null}return}let atom=findAtom(p.x,p.y);longTimer=setTimeout(()=>{if(active?.type==="create"&&!stroke.length){menuShown=true;openMenu(atom,p.x,p.y)}},550);active.start=p});
canvas.addEventListener("pointermove",e=>{if(!active||active.id!==e.pointerId)return;e.preventDefault();let p=point(e);if(active.type==="erase"){let ids=new Set(atoms.filter(a=>distSeg(a.x,a.y,active.last.x,active.last.y,p.x,p.y)<=radius(a)+4).map(a=>a.id)),hit=bonds.filter(b=>{let a=getAtom(b.a),c=getAtom(b.b);return a&&c&&distSeg((a.x+c.x)/2,(a.y+c.y)/2,active.last.x,active.last.y,p.x,p.y)<13});if((ids.size||hit.length)&&!eraseSaved){save();eraseSaved=true}if(ids.size){atoms=atoms.filter(a=>!ids.has(a.id));bonds=bonds.filter(b=>!ids.has(b.a)&&!ids.has(b.b))}if(hit.length){let s=new Set(hit.map(b=>b.id));bonds=bonds.filter(b=>!s.has(b.id))}active.last=p;render();return}if(active.type==="move"&&selected){if(!origin)return;if(!active.saved){save();active.saved=true}selected.x=origin.x+p.x-origin.px;selected.y=origin.y+p.y-origin.py;render();return}if(active.type==="create"&&!menuShown){if(!stroke.length&&Math.hypot(p.x-active.start.x,p.y-active.start.y)>10){stopLong();moleculeClipboard=null;stroke=[active.start,p]}else if(stroke.length)stroke.push(p);if(stroke.length>1){strokeLayer.replaceChildren();let q=svg("path","rough-stroke");q.setAttribute("d",stroke.map((v,i)=>(i?"L":"M")+v.x+" "+v.y).join(" "));strokeLayer.append(q)}}},{passive:false});
function finish(e){if(!active||active.id!==e.pointerId)return;stopLong();if(active.type==="create"&&!menuShown&&stroke.length){let a=findAtom(stroke[0].x,stroke[0].y),b=findAtom(stroke.at(-1).x,stroke.at(-1).y);if(isStraight(stroke)&&a&&b)addBond(a,b);else{let box={x:(Math.min(...stroke.map(p=>p.x))+Math.max(...stroke.map(p=>p.x)))/2,y:(Math.min(...stroke.map(p=>p.y))+Math.max(...stroke.map(p=>p.y)))/2};if(!findAtom(box.x,box.y)){let q=snap(box.x,box.y);save();atoms.push({id:nextAtomId++,x:q.x,y:q.y,element:elementFromStroke(stroke),pending:false});render()}}}stroke=[];strokeLayer.replaceChildren();active=null;selected=null;origin=null;menuShown=false;eraseSaved=false;status.textContent="Pencil creates · Finger moves"}canvas.addEventListener("pointerup",finish);canvas.addEventListener("pointercancel",finish);
$("undoBtn").onclick=()=>{closeMenu();let p=history.pop();if(p){atoms=p.atoms;bonds=p.bonds;nextAtomId=Math.max(1,...atoms.map(a=>a.id+1));nextBondId=Math.max(1,...bonds.map(b=>b.id+1));render()}};$("clearBtn").onclick=()=>{closeMenu();if(atoms.length||bonds.length){save();atoms=[];bonds=[];render()}};window.addEventListener("resize",()=>{renderGrid();if(moleculeMenu.classList.contains("visible"))posMenu()});render();renderGrid();
</script></body></html>
