const $=id=>document.getElementById(id),canvas=$("canvas"),gridLayer=$("gridLayer"),atomLayer=$("atomLayer"),bondLayer=$("bondLayer"),strokeLayer=$("strokeLayer"),emptyState=$("emptyState"),status=$("status"),moleculeMenu=$("moleculeMenu");

function getAtom(id){return atoms.find(a=>a.id===id)}function getRadius(a){return ATOM_RADIUS[a.element]||27}function getBondsForAtom(a){return a?bonds.filter(b=>b.a===a.id||b.b===a.id):[]}function getValence(a){return getBondsForAtom(a).reduce((s,b)=>s+b.order,0)}

function findBondAt(x,y){for(let i=bonds.length-1;i>=0;i--){const b=bonds[i],a=getAtom(b.a),c=getAtom(b.b);if(a&&c&&pointToSegmentDistance(x,y,a.x,a.y,c.x,c.y)<12)return b}return null}

function createBondElement(b){const g=svgElement("g");g.dataset.bondId=b.id;bondLayer.append(g);bondElements.set(b.id,g);return g}
function updateBondElement(b,g){const a=getAtom(b.a),c=getAtom(b.b);if(!a||!c)return;g.replaceChildren();const dx=c.x-a.x,dy=c.y-a.y,length=Math.hypot(dx,dy);if(!length)return;const ux=dx/length,uy=dy/length,nx=-uy,ny=ux,x1=a.x+ux*getRadius(a),y1=a.y+uy*getRadius(a),x2=c.x-ux*getRadius(c),y2=c.y-uy*getRadius(c);(b.order===1?[0]:b.order===2?[-3,3]:[-6,0,6]).forEach(offset=>{const line=svgElement("line","bond");[["x1",x1+nx*offset],["y1",y1+ny*offset],["x2",x2+nx*offset],["y2",y2+ny*offset]].forEach(([k,v])=>line.setAttribute(k,v));g.append(line)})}

function strokeBounds(points){if(!points.length)return null;let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;points.forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)});return {minX,minY,maxX,maxY,width:maxX-minX,height:maxY-minY}}
function resampleStroke(points,count=32){if(points.length<2)return points.slice();const lengths=[0];let total=0;for(let i=1;i<points.length;i++){total+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);lengths.push(total)}if(!total)return points.slice();const result=[];for(let i=0;i<count;i++){const target=total*i/(count-1);let j=1;while(j<lengths.length&&lengths[j]<target)j++;if(j>=lengths.length){result.push(points.at(-1));continue}const t=(target-lengths[j-1])/(lengths[j]-lengths[j-1]||1),a=points[j-1],b=points[j];result.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}return result}
