<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>BONDraw 0.2</title>

<style>
    :root {
        --bg: #f5f3ef;
        --panel: rgba(255,255,255,0.88);
        --text: #202124;
        --muted: #8b8b8b;
        --accent: #202124;
        --line: #d8d5cf;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            sans-serif;
        color: var(--text);
    }

    body {
        display: flex;
        flex-direction: column;
    }

    /* ---------- HEADER ---------- */

    header {
        height: 68px;
        padding: 0 22px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background: rgba(255,255,255,0.82);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border-bottom: 1px solid rgba(0,0,0,0.06);

        z-index: 10;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo {
        width: 34px;
        height: 34px;
        border-radius: 11px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #202124;
        color: white;

        font-weight: 800;
        font-size: 15px;
        letter-spacing: -0.7px;
    }

    .brand-text {
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.5px;
    }

    .version {
        font-size: 12px;
        color: var(--muted);
        margin-left: 5px;
    }

    /* ---------- WORKSPACE ---------- */

    #workspace {
        position: relative;
        flex: 1;
        overflow: hidden;
    }

    #canvas {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    /* ---------- EMPTY STATE ---------- */

    #emptyState {
        position: absolute;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;

        transition:
            opacity 180ms ease,
            transform 180ms ease;
    }

    #emptyState.hidden {
        opacity: 0;
        transform: translateY(5px);
    }

    .empty-card {
        text-align: center;
        padding: 28px;
    }

    .empty-icon {
        font-size: 40px;
        margin-bottom: 12px;
        opacity: 0.65;
    }

    .empty-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .empty-subtitle {
        font-size: 14px;
        color: var(--muted);
    }

    /* ---------- TOOLBAR ---------- */

    .toolbar {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);

        display: flex;
        align-items: center;
        gap: 7px;

        padding: 7px;

        background: rgba(255,255,255,0.91);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border: 1px solid rgba(0,0,0,0.07);
        border-radius: 18px;

        box-shadow:
            0 10px 35px rgba(0,0,0,0.10),
            0 2px 7px rgba(0,0,0,0.05);

        z-index: 20;
    }

    button {
        border: none;
        background: transparent;

        font: inherit;
        color: var(--text);

        cursor: pointer;
        -webkit-touch-callout: none;

        transition:
            transform 120ms ease,
            background 120ms ease;
    }

    button:active {
        transform: scale(0.94);
    }

    .tool {
        height: 42px;
        padding: 0 14px;

        border-radius: 13px;

        font-size: 14px;
        font-weight: 650;

        display: flex;
        align-items: center;
        gap: 7px;
    }

    .tool.active {
        background: #202124;
        color: white;
    }

    .separator {
        width: 1px;
        height: 25px;
        background: #ddd;
        margin: 0 3px;
    }

    .action {
        width: 42px;
        height: 42px;
        border-radius: 13px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 18px;
    }

    .action:hover,
    .tool:not(.active):hover {
        background: rgba(0,0,0,0.055);
    }

    /* ---------- SVG OBJECTS ---------- */

    .bond {
        stroke: #202124;
        stroke-width: 4;
        stroke-linecap: round;
        fill: none;

        transition:
            opacity 160ms ease,
            stroke-width 120ms ease;
    }

    .atom {
        fill: white;
        stroke: #202124;
        stroke-width: 3;
    }

    .atom-text {
        fill: #202124;
        font-size: 24px;
        font-weight: 750;
        text-anchor: middle;
        dominant-baseline: central;

        pointer-events: none;
        user-select: none;
    }

    /* New atoms */

    .atom-group.new {
        animation: atomAppear 190ms cubic-bezier(.2,.8,.2,1);
        transform-box: fill-box;
        transform-origin: center;
    }

    @keyframes atomAppear {
        0% {
            opacity: 0;
            transform: scale(0.72);
        }

        65% {
            opacity: 1;
            transform: scale(1.06);
        }

        100% {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* ---------- ROUGH STROKE ---------- */

    .rough-stroke {
        fill: none;
        stroke: #202124;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;

        opacity: 0.82;

        pointer-events: none;
    }

    .rough-stroke.transforming {
        animation: strokeTransform 180ms ease forwards;
    }

    @keyframes strokeTransform {
        0% {
            opacity: 0.82;
        }

        100% {
            opacity: 0;
        }
    }

    /* ---------- TOAST ---------- */

    #toast {
        position: absolute;
        left: 50%;
        top: 20px;

        transform:
            translate(-50%, -8px)
            scale(0.96);

        padding: 10px 15px;

        border-radius: 13px;

        background: rgba(32,33,36,0.94);
        color: white;

        font-size: 13px;
        font-weight: 600;

        opacity: 0;
        pointer-events: none;

        transition:
            opacity 150ms ease,
            transform 150ms ease;

        z-index: 30;
    }

    #toast.show {
        opacity: 1;
        transform:
            translate(-50%, 0)
            scale(1);
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 600px) {

        header {
            height: 60px;
            padding: 0 15px;
        }

        .brand-text {
            font-size: 17px;
        }

        .toolbar {
            bottom: 14px;
            gap: 4px;
            padding: 6px;
        }

        .tool {
            padding: 0 11px;
            height: 40px;
        }

        .action {
            width: 40px;
            height: 40px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="brand">
        <div class="logo">B</div>

        <div>
            <span class="brand-text">BONDraw</span>
            <span class="version">0.2</span>
        </div>
    </div>
</header>


<div id="workspace">

    <svg id="canvas">

        <g id="bondsLayer"></g>
        <g id="atomsLayer"></g>
        <g id="roughLayer"></g>

    </svg>


    <div id="emptyState">

        <div class="empty-card">

            <div class="empty-icon">✦</div>

            <div class="empty-title">
                Start drawing
            </div>

            <div class="empty-subtitle">
                Draw a circle to create a carbon atom
            </div>

        </div>

    </div>


    <div id="toast"></div>


    <div class="toolbar">

        <button
            class="tool active"
            id="createBtn"
            onclick="setMode('create')">

            ✏️
            <span>Create</span>

        </button>


        <button
            class="tool"
            id="moveBtn"
            onclick="setMode('move')">

            ✋
            <span>Move</span>

        </button>


        <button
            class="tool"
            id="eraseBtn"
            onclick="setMode('erase')">

            🗑
            <span>Erase</span>

        </button>


        <div class="separator"></div>


        <button
            class="action"
            onclick="undo()"
            aria-label="Undo">

            ↶

        </button>


        <button
            class="action"
            onclick="clearCanvas()"
            aria-label="Clear">

            ⌫

        </button>

    </div>

</div>


<script>

/* =========================================================
   BONDraw 0.2
   ========================================================= */


/* ---------- GLOBAL STATE ---------- */

const svg = document.getElementById("canvas");

const atomsLayer = document.getElementById("atomsLayer");
const bondsLayer = document.getElementById("bondsLayer");
const roughLayer = document.getElementById("roughLayer");

const emptyState = document.getElementById("emptyState");
const toast = document.getElementById("toast");


let mode = "create";

let atoms = [];
let bonds = [];

let history = [];


/*
    Current freehand gesture.
*/
let drawing = false;
let currentStroke = [];

let activePointerId = null;


/*
    Used for Move mode.
*/
let movingAtom = null;
let moveOffsetX = 0;
let moveOffsetY = 0;


/* ---------- CONSTANTS ---------- */

const ATOM_RADIUS = 27;


/*
    Maximum total bond order around carbon.

    C— = 1
    C=  = 2
    C≡  = 3

    Maximum = 4
*/
const MAX_VALENCE = 4;


/* =========================================================
   UTILITY
   ========================================================= */

function uid() {
    return crypto.randomUUID();
}


function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


function midpoint(a, b) {

    return {
        x: (a.x + b.x) / 2,
        y: (a.y + b.y) / 2
    };

}


function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


/* =========================================================
   MODE
   ========================================================= */

function setMode(newMode) {

    mode = newMode;

    document
        .getElementById("createBtn")
        .classList.toggle(
            "active",
            mode === "create"
        );

    document
        .getElementById("moveBtn")
        .classList.toggle(
            "active",
            mode === "move"
        );

    document
        .getElementById("eraseBtn")
        .classList.toggle(
            "active",
            mode === "erase"
        );

}


/* =========================================================
   HISTORY
   ========================================================= */

function saveHistory() {

    history.push({
        atoms: JSON.parse(JSON.stringify(atoms)),
        bonds: JSON.parse(JSON.stringify(bonds))
    });

    /*
        Keep the history reasonably small.
    */
    if (history.length > 30) {
        history.shift();
    }

}


function undo() {

    if (!history.length) return;

    const previous = history.pop();

    atoms = previous.atoms;
    bonds = previous.bonds;

    render();

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    }, 1400);

}


/* =========================================================
   POINTER → SVG COORDINATES
   ========================================================= */

function getPoint(event) {

    const rect = svg.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };

}


/* =========================================================
   ATOM FUNCTIONS
   ========================================================= */

function createCarbon(x, y) {

    saveHistory();

    atoms.push({
        id: uid(),
        x,
        y,
        element: "C"
    });

    render();

}


function getAtomAt(x, y) {

    /*
        Search backwards so the topmost atom wins.
    */

    for (let i = atoms.length - 1; i >= 0; i--) {

        const atom = atoms[i];

        if (
            Math.hypot(
                atom.x - x,
                atom.y - y
            ) <= ATOM_RADIUS + 8
        ) {

            return atom;

        }

    }

    return null;

}


/* =========================================================
   VALENCE ENGINE
   ========================================================= */

/*
    Returns the total bond order currently attached
    to an atom.
*/

function getValence(atomId) {

    return bonds
        .filter(
            bond =>
                bond.a === atomId ||
                bond.b === atomId
        )
        .reduce(
            (total, bond) =>
                total + bond.order,
            0
        );

}


/*
    Can this atom accept a bond of this order?
*/

function canAddBond(atomId, order) {

    const currentValence = getValence(atomId);

    return (
        currentValence + order
        <= MAX_VALENCE
    );

}


/*
    Can we change a bond to another order?

    We temporarily remove the old bond contribution
    and then test the new one.
*/

function canChangeBondOrder(
    bond,
    newOrder
) {

    const valenceA =
        getValence(bond.a)
        - bond.order;

    const valenceB =
        getValence(bond.b)
        - bond.order;

    return (
        valenceA + newOrder <= MAX_VALENCE &&
        valenceB + newOrder <= MAX_VALENCE
    );

}


/* =========================================================
   BOND FUNCTIONS
   ========================================================= */

function findBond(atomA, atomB) {

    return bonds.find(
        bond =>
            (
                bond.a === atomA.id &&
                bond.b === atomB.id
            )
            ||
            (
                bond.a === atomB.id &&
                bond.b === atomA.id
            )
    );

}


/*
    When a line is drawn between two atoms:

    no bond      → single
    single      → double
    double      → triple
    triple      → blocked / cycles back to single

    BUT every transition respects carbon valence.
*/

function connectAtoms(atomA, atomB) {

    if (atomA.id === atomB.id) return;

    const existing = findBond(
        atomA,
        atomB
    );


    /* -----------------------------------------
       Existing bond
       ----------------------------------------- */

    if (existing) {

        const nextOrder =
            existing.order === 3
                ? 1
                : existing.order + 1;


        /*
            Check whether the new order
            would exceed carbon valence.
        */

        if (
            !canChangeBondOrder(
                existing,
                nextOrder
            )
        ) {

            showToast(
                "Carbon valence limit reached"
            );

            return;

        }


        saveHistory();

        existing.order = nextOrder;

        render();

        return;

    }


    /* -----------------------------------------
       New bond
       ----------------------------------------- */

    if (
        !canAddBond(atomA.id, 1) ||
        !canAddBond(atomB.id, 1)
    ) {

        showToast(
            "Carbon valence limit reached"
        );

        return;

    }


    saveHistory();

    bonds.push({
        id: uid(),
        a: atomA.id,
        b: atomB.id,
        order: 1
    });

    render();

}


/* =========================================================
   BOND GEOMETRY
   ========================================================= */

function drawBond(bond) {

    const atomA =
        atoms.find(
            atom => atom.id === bond.a
        );

    const atomB =
        atoms.find(
            atom => atom.id === bond.b
        );

    if (!atomA || !atomB) return;


    const dx =
        atomB.x - atomA.x;

    const dy =
        atomB.y - atomA.y;

    const length =
        Math.hypot(dx, dy);

    if (length === 0) return;


    /*
        Unit vector.
    */

    const ux = dx / length;
    const uy = dy / length;


    /*
        Perpendicular vector.
    */

    const px = -uy;
    const py = ux;


    /*
        Shorten bonds so they stop at the
        edge of the carbon atoms.
    */

    const startX =
        atomA.x + ux * ATOM_RADIUS;

    const startY =
        atomA.y + uy * ATOM_RADIUS;

    const endX =
        atomB.x - ux * ATOM_RADIUS;

    const endY =
        atomB.y - uy * ATOM_RADIUS;


    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    /*
        Single bond
    */

    if (bond.order === 1) {

        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.setAttribute(
            "x1",
            startX
        );

        line.setAttribute(
            "y1",
            startY
        );

        line.setAttribute(
            "x2",
            endX
        );

        line.setAttribute(
            "y2",
            endY
        );

        line.setAttribute(
            "class",
            "bond"
        );

        group.appendChild(line);

    }


    /*
        Double bond
    */

    if (bond.order === 2) {

        const offset = 4;

        const line1 =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        const line2 =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        line1.setAttribute(
            "x1",
            startX + px * offset
        );

        line1.setAttribute(
            "y1",
            startY + py * offset
        );

        line1.setAttribute(
            "x2",
            endX + px * offset
        );

        line1.setAttribute(
            "y2",
            endY + py * offset
        );


        line2.setAttribute(
            "x1",
            startX - px * offset
        );

        line2.setAttribute(
            "y1",
            startY - py * offset
        );

        line2.setAttribute(
            "x2",
            endX - px * offset
        );

        line2.setAttribute(
            "y2",
            endY - py * offset
        );


        line1.setAttribute(
            "class",
            "bond"
        );

        line2.setAttribute(
            "class",
            "bond"
        );


        group.appendChild(line1);
        group.appendChild(line2);

    }


    /*
        Triple bond
    */

    if (bond.order === 3) {

        const offset = 6;

        const center =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        const line1 =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        const line2 =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        center.setAttribute(
            "x1",
            startX
        );

        center.setAttribute(
            "y1",
            startY
        );

        center.setAttribute(
            "x2",
            endX
        );

        center.setAttribute(
            "y2",
            endY
        );


        line1.setAttribute(
            "x1",
            startX + px * offset
        );

        line1.setAttribute(
            "y1",
            startY + py * offset
        );

        line1.setAttribute(
            "x2",
            endX + px * offset
        );

        line1.setAttribute(
            "y2",
            endY + py * offset
        );


        line2.setAttribute(
            "x1",
            startX - px * offset
        );

        line2.setAttribute(
            "y1",
            startY - py * offset
        );

        line2.setAttribute(
            "x2",
            endX - px * offset
        );

        line2.setAttribute(
            "y2",
            endY - py * offset
        );


        center.setAttribute(
            "class",
            "bond"
        );

        line1.setAttribute(
            "class",
            "bond"
        );

        line2.setAttribute(
            "class",
            "bond"
        );


        group.appendChild(line1);
        group.appendChild(center);
        group.appendChild(line2);

    }


    bondsLayer.appendChild(group);

}


/* =========================================================
   ATOM RENDERING
   ========================================================= */

function renderAtom(atom) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.setAttribute(
        "class",
        "atom-group"
    );


    const circle =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    circle.setAttribute(
        "cx",
        atom.x
    );

    circle.setAttribute(
        "cy",
        atom.y
    );

    circle.setAttribute(
        "r",
        ATOM_RADIUS
    );

    circle.setAttribute(
        "class",
        "atom"
    );


    const text =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    text.setAttribute(
        "x",
        atom.x
    );

    text.setAttribute(
        "y",
        atom.y
    );

    text.setAttribute(
        "class",
        "atom-text"
    );

    text.textContent =
        atom.element;


    group.appendChild(circle);
    group.appendChild(text);

    atomsLayer.appendChild(group);

}


/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function render() {

    atomsLayer.innerHTML = "";
    bondsLayer.innerHTML = "";


    /*
        Bonds first.
    */

    for (const bond of bonds) {

        drawBond(bond);

    }


    /*
        Atoms on top.
    */

    for (const atom of atoms) {

        renderAtom(atom);

    }


    /*
        Empty state.
    */

    emptyState.classList.toggle(
        "hidden",
        atoms.length > 0
    );

}


/* =========================================================
   ROUGH STROKE
   ========================================================= */

function createRoughPath(points) {

    if (points.length < 2) {
        return "";
    }

    return points
        .map(
            (point, index) =>
                `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`
        )
        .join(" ");

}


function showRoughStroke() {

    roughLayer.innerHTML = "";

    if (currentStroke.length < 2) {
        return;
    }


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",
        createRoughPath(currentStroke)
    );

    path.setAttribute(
        "class",
        "rough-stroke"
    );


    roughLayer.appendChild(path);

}


/* =========================================================
   CIRCLE RECOGNITION
   ========================================================= */

function analyzeCircle(points) {

    if (points.length < 12) {
        return null;
    }


    /*
        Bounding box.
    */

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;


    for (const p of points) {

        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);

        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);

    }


    const width =
        maxX - minX;

    const height =
        maxY - minY;


    if (
        width < 25 ||
        height < 25
    ) {

        return null;

    }


    /*
        Circle should not be extremely elongated.
    */

    const ratio =
        Math.min(width, height) /
        Math.max(width, height);

    if (ratio < 0.65) {

        return null;

    }


    /*
        Start/end distance.

        A closed circle should finish
        relatively close to where it started.
    */

    const start = points[0];
    const end = points[points.length - 1];

    const closureDistance =
        Math.hypot(
            start.x - end.x,
            start.y - end.y
        );


    const size =
        Math.max(width, height);


    if (
        closureDistance >
        size * 0.35
    ) {

        return null;

    }


    /*
        Estimate center.
    */

    const center = {
        x: (minX + maxX) / 2,
        y: (minY + maxY) / 2
    };


    /*
        Average radius.
    */

    let radiusSum = 0;

    for (const p of points) {

        radiusSum += Math.hypot(
            p.x - center.x,
            p.y - center.y
        );

    }


    const radius =
        radiusSum / points.length;


    /*
        Calculate how consistently
        the points follow the circle.
    */

    let error = 0;

    for (const p of points) {

        const r =
            Math.hypot(
                p.x - center.x,
                p.y - center.y
            );

        error += Math.abs(
            r - radius
        );

    }

    error /= points.length;


    /*
        Allow some hand-drawn imperfection.
    */

    if (
        error >
        radius * 0.42
    ) {

        return null;

    }


    return {
        x: center.x,
        y: center.y,
        radius
    };

}


/* =========================================================
   BOND STROKE RECOGNITION
   ========================================================= */

function analyzeBondStroke(points) {

    if (points.length < 3) {
        return null;
    }


    const start =
        points[0];

    const end =
        points[points.length - 1];


    const startAtom =
        getAtomAt(
            start.x,
            start.y
        );

    const endAtom =
        getAtomAt(
            end.x,
            end.y
        );


    if (
        !startAtom ||
        !endAtom ||
        startAtom.id === endAtom.id
    ) {

        return null;

    }


    /*
        Check whether the stroke is reasonably straight.
    */

    const dx =
        end.x - start.x;

    const dy =
        end.y - start.y;

    const length =
        Math.hypot(dx, dy);


    if (length < 25) {
        return null;
    }


    /*
        Distance of each point from the
        ideal start→end line.
    */

    let totalError = 0;

    for (const p of points) {

        const error =
            Math.abs(
                dy * p.x -
                dx * p.y +
                end.x * start.y -
                end.y * start.x
            ) / length;

        totalError += error;

    }


    const averageError =
        totalError / points.length;


    if (
        averageError >
        Math.max(18, length * 0.25)
    ) {

        return null;

    }


    return {
        startAtom,
        endAtom
    };

}


/* =========================================================
   CREATE MODE
   ========================================================= */

function finishCreateStroke() {

    if (
        currentStroke.length < 3
    ) {

        roughLayer.innerHTML = "";
        return;

    }


    /*
        First try to recognize a bond.
    */

    const bondStroke =
        analyzeBondStroke(
            currentStroke
        );


    if (bondStroke) {

        /*
            Animate the rough line away,
            then create the actual bond.
        */

        const rough =
            roughLayer.querySelector(
                ".rough-stroke"
            );

        if (rough) {

            rough.classList.add(
                "transforming"
            );

        }


        setTimeout(() => {

            connectAtoms(
                bondStroke.startAtom,
                bondStroke.endAtom
            );

            roughLayer.innerHTML = "";

        }, 90);

        return;

    }


    /*
        Otherwise try circle recognition.
    */

    const circle =
        analyzeCircle(
            currentStroke
        );


    if (circle) {

        const rough =
            roughLayer.querySelector(
                ".rough-stroke"
            );

        if (rough) {

            rough.classList.add(
                "transforming"
            );

        }


        /*
            Wait just a tiny amount so the user
            perceives the transformation.
        */

        setTimeout(() => {

            createCarbon(
                circle.x,
                circle.y
            );

            roughLayer.innerHTML = "";

        }, 90);

        return;

    }


    /*
        Not recognized.
    */

    roughLayer.innerHTML = "";

}


/* =========================================================
   POINTER DOWN
   ========================================================= */

svg.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        activePointerId =
            event.pointerId;


        const point =
            getPoint(event);


        /* -----------------------------------------
           CREATE
           ----------------------------------------- */

        if (mode === "create") {

            drawing = true;

            currentStroke = [
                point
            ];


            svg.setPointerCapture(
                event.pointerId
            );


            showRoughStroke();

            return;

        }


        /* -----------------------------------------
           MOVE
           ----------------------------------------- */

        if (mode === "move") {

            const atom =
                getAtomAt(
                    point.x,
                    point.y
                );


            if (!atom) return;


            saveHistory();

            movingAtom = atom;

            moveOffsetX =
                atom.x - point.x;

            moveOffsetY =
                atom.y - point.y;


            svg.setPointerCapture(
                event.pointerId
            );


            return;

        }


        /* -----------------------------------------
           ERASE
           ----------------------------------------- */

        if (mode === "erase") {

            const atom =
                getAtomAt(
                    point.x,
                    point.y
                );


            if (!atom) return;


            saveHistory();


            /*
                Remove atom.
            */

            atoms =
                atoms.filter(
                    a =>
                        a.id !== atom.id
                );


            /*
                Remove every bond attached
                to that atom.
            */

            bonds =
                bonds.filter(
                    bond =>
                        bond.a !== atom.id &&
                        bond.b !== atom.id
                );


            render();

        }

    }
);


/* =========================================================
   POINTER MOVE
   ========================================================= */

svg.addEventListener(
    "pointermove",
    event => {

        event.preventDefault();


        if (
            activePointerId !==
            event.pointerId
        ) {

            return;

        }


        const point =
            getPoint(event);


        /* -----------------------------------------
           CREATE
           ----------------------------------------- */

        if (
            mode === "create" &&
            drawing
        ) {

            const last =
                currentStroke[
                    currentStroke.length - 1
                ];


            /*
                Don't add thousands of points
                when Pencil reports tiny movements.
            */

            if (
                Math.hypot(
                    point.x - last.x,
                    point.y - last.y
                ) > 2
            ) {

                currentStroke.push(
                    point
                );

                showRoughStroke();

            }

            return;

        }


        /* -----------------------------------------
           MOVE
           ----------------------------------------- */

        if (
            mode === "move" &&
            movingAtom
        ) {

            movingAtom.x =
                point.x + moveOffsetX;

            movingAtom.y =
                point.y + moveOffsetY;


            render();

        }

    }
);


/* =========================================================
   POINTER UP
   ========================================================= */

svg.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();


        if (
            activePointerId !==
            event.pointerId
        ) {

            return;

        }


        /* -----------------------------------------
           CREATE
           ----------------------------------------- */

        if (
            mode === "create" &&
            drawing
        ) {

            drawing = false;

            finishCreateStroke();

        }


        /* -----------------------------------------
           MOVE
           ----------------------------------------- */

        if (
            mode === "move"
        ) {

            movingAtom = null;

        }


        activePointerId = null;

    }
);


/* =========================================================
   POINTER CANCEL
   ========================================================= */

svg.addEventListener(
    "pointercancel",
    event => {

        drawing = false;
        movingAtom = null;

        activePointerId = null;

        currentStroke = [];

        roughLayer.innerHTML = "";

    }
);


/* =========================================================
   CLEAR
   ========================================================= */

function clearCanvas() {

    if (
        atoms.length === 0 &&
        bonds.length === 0
    ) {

        return;

    }


    saveHistory();

    atoms = [];
    bonds = [];

    roughLayer.innerHTML = "";

    render();

}


/* =========================================================
   INITIAL RENDER
   ========================================================= */

render();

</script>

</body>
</html>
