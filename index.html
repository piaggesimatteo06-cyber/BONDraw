<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>BONDraw 0.7.0</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #f4f5f7;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        sans-serif;

    color: #181a1f;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    flex-direction: column;
}


/* ================================
   HEADER
================================ */

header {
    height: 72px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background: rgba(255,255,255,.88);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(0,0,0,.07);

    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #181a1f;
}

.brand-name {
    font-size: 22px;
    font-weight: 750;
    letter-spacing: -.8px;
}

.version {
    font-size: 13px;
    color: #858992;
    font-weight: 600;
}

.status {
    font-size: 13px;
    color: #858992;
    font-weight: 500;
}


/* ================================
   WORKSPACE
================================ */

#workspace {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.9),
            rgba(244,245,247,.95)
        );

    touch-action: none;
}


/* ================================
   EMPTY STATE
================================ */

#emptyState {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    pointer-events: none;

    transition: opacity .2s ease;
}

#emptyState.hidden {
    opacity: 0;
}

.empty-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.6px;
    margin-bottom: 7px;
}

.empty-subtitle {
    font-size: 15px;
    color: #858992;
    line-height: 1.45;
}


/* ================================
   TOOLBAR
================================ */

#toolbar {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform:
        translateX(-50%);

    display: flex;
    align-items: center;
    gap: 6px;

    padding: 7px;

    background:
        rgba(255,255,255,.9);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border:
        1px solid rgba(0,0,0,.08);

    border-radius: 18px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.10);

    z-index: 20;
}

button {
    border: 0;
    outline: 0;

    height: 40px;
    padding: 0 15px;

    border-radius: 12px;

    background: transparent;

    color: #686c74;

    font-family: inherit;

    font-size: 14px;
    font-weight: 650;

    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

button.active {
    background: #181a1f;
    color: white;
}

button.danger {
    color: #b04444;
}

.divider {
    width: 1px;
    height: 25px;

    background:
        rgba(0,0,0,.09);

    margin: 0 2px;
}


/* ================================
   MOLECULE MENU
================================ */

#moleculeMenu {
    position: absolute;

    display: none;

    min-width: 180px;

    padding: 7px;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border:
        1px solid rgba(0,0,0,.08);

    border-radius: 16px;

    box-shadow:
        0 14px 40px rgba(0,0,0,.16);

    z-index: 40;
}

#moleculeMenu.visible {
    display: block;
}

.menu-title {
    padding:
        8px 10px 6px;

    font-size: 11px;

    color: #969aa2;

    font-weight: 650;

    text-transform: uppercase;

    letter-spacing: .5px;
}

.menu-button {
    width: 100%;

    height: 42px;

    display: flex;
    align-items: center;
    justify-content: flex-start;

    gap: 9px;

    padding:
        0 11px;

    border-radius: 11px;

    color: #25272d;

    font-size: 14px;
    font-weight: 650;

    background: transparent;
}

.menu-button:active {
    background:
        rgba(0,0,0,.07);
}

.menu-button.disabled {
    color: #b5b8bf;
    pointer-events: none;
}

.menu-icon {
    width: 20px;
    text-align: center;
    font-size: 16px;
}

.menu-divider {
    height: 1px;

    background:
        rgba(0,0,0,.07);

    margin:
        5px 4px;
}


/* ================================
   CHEMISTRY
================================ */

.bond {
    stroke: #202228;
    stroke-width: 2.6;
    stroke-linecap: round;
    fill: none;
    pointer-events: none;
}

.atom-circle {
    fill:
        rgba(255,255,255,.96);

    stroke: #202228;
    stroke-width: 2.4;
}

.atom-label {
    fill: #202228;

    font-size: 17px;
    font-weight: 700;

    text-anchor: middle;
    dominant-baseline: central;

    pointer-events: none;
}

.atom.pending .atom-circle {
    fill:
        rgba(255,255,255,.72);

    stroke: #999da6;
    stroke-width: 2;
    stroke-dasharray: 5 5;
}

.atom.pending .atom-label {
    fill: #999da6;
}

.rough-stroke {
    fill: none;

    stroke: #8e929b;

    stroke-width: 2;

    stroke-linecap: round;
    stroke-linejoin: round;

    opacity: .8;

    pointer-events: none;
}


/* ================================
   HINT
================================ */

#interactionHint {
    position: absolute;

    right: 18px;
    bottom: 25px;

    padding:
        8px 11px;

    border-radius: 11px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid rgba(0,0,0,.06);

    color: #888c94;

    font-size: 12px;
    font-weight: 550;

    pointer-events: none;
}

@media (max-width: 650px) {

    header {
        height: 64px;
        padding: 0 15px;
    }

    .brand-name {
        font-size: 20px;
    }

    .status {
        display: none;
    }

    #toolbar {
        bottom: 14px;
    }

    button {
        padding:
            0 12px;
    }

    #interactionHint {
        display: none;
    }

    #moleculeMenu {
        min-width: 170px;
    }

}

</style>
</head>


<body>

<header>

    <div class="brand">

        <div class="logo-dot"></div>

        <div class="brand-name">
            BONDraw
        </div>

        <div class="version">
            0.7.0
        </div>

    </div>

    <div
        class="status"
        id="status">

        Pencil creates · Finger moves

    </div>

</header>


<div id="workspace">

<svg
    id="canvas"
    xmlns="http://www.w3.org/2000/svg">

    <g id="bondLayer"></g>
    <g id="atomLayer"></g>
    <g id="strokeLayer"></g>

</svg>


<div id="emptyState">

    <div class="empty-title">
        Draw chemistry naturally.
    </div>

    <div class="empty-subtitle">
        Use Apple Pencil to create atoms and bonds.<br>
        Use your finger to move atoms.
    </div>

</div>


<div id="interactionHint">
    🖊️ Create &nbsp;·&nbsp; 👆 Move
</div>


<div id="moleculeMenu">

    <div class="menu-title">
        Molecule
    </div>

    <button
        type="button"
        class="menu-button"
        id="copyMoleculeBtn">

        <span class="menu-icon">📋</span>

        <span>
            Copia molecola
        </span>

    </button>


    <button
        type="button"
        class="menu-button"
        id="pasteMoleculeBtn">

        <span class="menu-icon">📌</span>

        <span>
            Incolla molecola
        </span>

    </button>


    <div class="menu-divider"></div>


    <button
        type="button"
        class="menu-button"
        id="closeMenuBtn">

        <span class="menu-icon">✕</span>

        <span>
            Chiudi
        </span>

    </button>

</div>


<div id="toolbar">

    <button
        id="createBtn"
        class="active">
        Create
    </button>

    <button id="moveBtn">
        Move
    </button>

    <button id="eraseBtn">
        Erase
    </button>

    <div class="divider"></div>

    <button id="undoBtn">
        Undo
    </button>

    <button
        id="clearBtn"
        class="danger">
        Clear
    </button>

</div>

</div>


<script>

/* ============================================================
   BONDraw 0.7.0
============================================================ */


/* ============================================================
   DOM
============================================================ */

const canvas =
    document.getElementById("canvas");

const atomLayer =
    document.getElementById("atomLayer");

const bondLayer =
    document.getElementById("bondLayer");

const strokeLayer =
    document.getElementById("strokeLayer");

const emptyState =
    document.getElementById("emptyState");

const status =
    document.getElementById("status");

const createBtn =
    document.getElementById("createBtn");

const moveBtn =
    document.getElementById("moveBtn");

const eraseBtn =
    document.getElementById("eraseBtn");

const undoBtn =
    document.getElementById("undoBtn");

const clearBtn =
    document.getElementById("clearBtn");

const moleculeMenu =
    document.getElementById("moleculeMenu");

const copyMoleculeBtn =
    document.getElementById("copyMoleculeBtn");

const pasteMoleculeBtn =
    document.getElementById("pasteMoleculeBtn");

const closeMenuBtn =
    document.getElementById("closeMenuBtn");


/* ============================================================
   CHEMICAL MODEL
============================================================ */

let atoms = [];
let bonds = [];

let nextAtomId = 1;
let nextBondId = 1;

const ATOM_RADIUS = {
    C: 27,
    H: 23
};

const VALENCE = {
    C: 4,
    H: 1
};


/* ============================================================
   CLIPBOARD
============================================================ */

let moleculeClipboard = null;

let moleculeMenuAnchor = null;

/*
    Riferimento persistente alla molecola aperta
    nel menu.

    NON viene azzerato quando la Pencil viene
    sollevata. Viene azzerato solo quando
    il menu viene chiuso.
*/

let moleculeMenuAtom = null;


/* ============================================================
   HISTORY
============================================================ */

const history = [];


function saveHistory() {

    history.push({

        atoms:
            JSON.parse(
                JSON.stringify(atoms)
            ),

        bonds:
            JSON.parse(
                JSON.stringify(bonds)
            )

    });

    if (history.length > 50) {
        history.shift();
    }

}


/* ============================================================
   MODE
============================================================ */

let manualMode = "create";


function setManualMode(mode) {

    manualMode = mode;

    createBtn.classList.toggle(
        "active",
        mode === "create"
    );

    moveBtn.classList.toggle(
        "active",
        mode === "move"
    );

    eraseBtn.classList.toggle(
        "active",
        mode === "erase"
    );

}


createBtn.onclick = () =>
    setManualMode("create");

moveBtn.onclick = () =>
    setManualMode("move");

eraseBtn.onclick = () =>
    setManualMode("erase");


/* ============================================================
   PENDING ATOM
============================================================ */

let pendingAtom = null;


/* ============================================================
   UNDO / CLEAR
============================================================ */

undoBtn.onclick = () => {

    closeMoleculeMenu();

    if (!history.length) return;

    const previous =
        history.pop();

    atoms =
        previous.atoms;

    bonds =
        previous.bonds;

    pendingAtom =
        atoms.find(
            atom =>
                atom.pending === true
        ) || null;

    render();

};


clearBtn.onclick = () => {

    closeMoleculeMenu();

    if (
        !atoms.length &&
        !bonds.length
    ) return;

    saveHistory();

    atoms = [];
    bonds = [];

    pendingAtom = null;

    render();

};


/* ============================================================
   HELPERS
============================================================ */

function getAtom(id) {

    return atoms.find(
        atom =>
            atom.id === id
    );

}


function getRadius(atom) {

    return (
        ATOM_RADIUS[
            atom.element
        ] || 27
    );

}


function getValence(atom) {

    return bonds.reduce(
        (sum,bond) => {

            if (
                bond.a === atom.id ||
                bond.b === atom.id
            ) {

                return sum + bond.order;

            }

            return sum;

        },
        0
    );

}


function canAddBond(
    atomA,
    atomB,
    order
) {

    if (
        !atomA ||
        !atomB
    ) return false;

    const maxA =
        VALENCE[
            atomA.element
        ] || 4;

    const maxB =
        VALENCE[
            atomB.element
        ] || 4;

    return (
        getValence(atomA) + order <= maxA &&
        getValence(atomB) + order <= maxB
    );

}


/* ============================================================
   HIT TESTS
============================================================ */

function findAtomAt(x,y) {

    for (
        let i = atoms.length - 1;
        i >= 0;
        i--
    ) {

        const atom =
            atoms[i];

        const radius =
            getRadius(atom) + 8;

        if (
            Math.hypot(
                atom.x-x,
                atom.y-y
            ) <= radius
        ) {

            return atom;

        }

    }

    return null;

}


function pointToSegmentDistance(
    px,
    py,
    x1,
    y1,
    x2,
    y2
) {

    const dx = x2-x1;
    const dy = y2-y1;

    if (
        dx === 0 &&
        dy === 0
    ) {

        return Math.hypot(
            px-x1,
            py-y1
        );

    }

    const t =
        Math.max(
            0,
            Math.min(
                1,
                (
                    (px-x1)*dx +
                    (py-y1)*dy
                ) /
                (dx*dx + dy*dy)
            )
        );

    const cx = x1+t*dx;
    const cy = y1+t*dy;

    return Math.hypot(
        px-cx,
        py-cy
    );

}


function findBondAt(x,y) {

    for (
        let i = bonds.length-1;
        i >= 0;
        i--
    ) {

        const bond =
            bonds[i];

        const a =
            getAtom(bond.a);

        const b =
            getAtom(bond.b);

        if (!a || !b) continue;

        const distance =
            pointToSegmentDistance(
                x,
                y,
                a.x,
                a.y,
                b.x,
                b.y
            );

        if (distance < 12) {
            return bond;
        }

    }

    return null;

}


/* ============================================================
   SVG RENDERING
============================================================ */

const atomElements =
    new Map();

const bondElements =
    new Map();


function createAtomElement(atom) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.setAttribute(
        "class",
        "atom"
    );

    group.dataset.atomId =
        atom.id;

    const circle =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    circle.setAttribute(
        "class",
        "atom-circle"
    );

    const label =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    label.setAttribute(
        "class",
        "atom-label"
    );

    group.appendChild(circle);
    group.appendChild(label);

    atomLayer.appendChild(group);

    atomElements.set(
        atom.id,
        group
    );

    return group;

}


function updateAtomElement(atom) {

    let group =
        atomElements.get(
            atom.id
        );

    if (!group) {
        group =
            createAtomElement(atom);
    }

    group.setAttribute(
        "transform",
        `translate(${atom.x} ${atom.y})`
    );

    const circle =
        group.querySelector(
            ".atom-circle"
        );

    const label =
        group.querySelector(
            ".atom-label"
        );

    circle.setAttribute(
        "r",
        getRadius(atom)
    );

    label.textContent =
        atom.element || "?";

    group.classList.toggle(
        "pending",
        atom.pending === true
    );

}


function createBondElement(bond) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.dataset.bondId =
        bond.id;

    bondLayer.appendChild(group);

    bondElements.set(
        bond.id,
        group
    );

    return group;

}


function updateBondElement(
    bond,
    group
) {

    const a =
        getAtom(bond.a);

    const b =
        getAtom(bond.b);

    if (!a || !b) return;

    group.innerHTML = "";

    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;

    const length =
        Math.hypot(dx,dy);

    if (length === 0) return;

    const ux = dx/length;
    const uy = dy/length;

    const nx = -uy;
    const ny = ux;

    const startRadius =
        getRadius(a);

    const endRadius =
        getRadius(b);

    const startX =
        a.x + ux*startRadius;

    const startY =
        a.y + uy*startRadius;

    const endX =
        b.x - ux*endRadius;

    const endY =
        b.y - uy*endRadius;

    const spacing = 6;

    let offsets;

    if (bond.order === 1) {

        offsets = [0];

    }
    else if (bond.order === 2) {

        offsets = [
            -spacing/2,
            spacing/2
        ];

    }
    else {

        offsets = [
            -spacing,
            0,
            spacing
        ];

    }

    offsets.forEach(
        offset => {

            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );

            line.setAttribute(
                "class",
                "bond"
            );

            line.setAttribute(
                "x1",
                startX + nx*offset
            );

            line.setAttribute(
                "y1",
                startY + ny*offset
            );

            line.setAttribute(
                "x2",
                endX + nx*offset
            );

            line.setAttribute(
                "y2",
                endY + ny*offset
            );

            group.appendChild(line);

        }
    );

}


function render() {

    atomElements.forEach(
        element =>
            element.remove()
    );

    bondElements.forEach(
        element =>
            element.remove()
    );

    atomElements.clear();
    bondElements.clear();

    bonds.forEach(
        bond => {

            const group =
                createBondElement(
                    bond
                );

            updateBondElement(
                bond,
                group
            );

        }
    );

    atoms.forEach(
        atom => {

            createAtomElement(
                atom
            );

            updateAtomElement(
                atom
            );

        }
    );

    emptyState.classList.toggle(
        "hidden",
        atoms.length > 0
    );

}


function updateAtomAndItsBonds(atom) {

    updateAtomElement(atom);

    bonds.forEach(
        bond => {

            if (
                bond.a === atom.id ||
                bond.b === atom.id
            ) {

                const group =
                    bondElements.get(
                        bond.id
                    );

                if (group) {

                    updateBondElement(
                        bond,
                        group
                    );

                }

            }

        }
    );

}


/* ============================================================
   BONDS
============================================================ */

function findBondBetween(
    atomA,
    atomB
) {

    return bonds.find(
        bond =>

            (
                bond.a === atomA.id &&
                bond.b === atomB.id
            )

            ||

            (
                bond.a === atomB.id &&
                bond.b === atomA.id
            )
    );

}


function connectAtoms(
    atomA,
    atomB
) {

    if (
        !atomA ||
        !atomB ||
        atomA.id === atomB.id
    ) return;

    const existing =
        findBondBetween(
            atomA,
            atomB
        );

    saveHistory();

    if (!existing) {

        if (
            !canAddBond(
                atomA,
                atomB,
                1
            )
        ) {

            history.pop();
            return;

        }

        bonds.push({

            id:
                nextBondId++,

            a:
                atomA.id,

            b:
                atomB.id,

            order:
                1

        });

    }
    else {

        const nextOrder =
            existing.order === 3
                ? 1
                : existing.order + 1;

        const maxA =
            VALENCE[
                atomA.element
            ] || 4;

        const maxB =
            VALENCE[
                atomB.element
            ] || 4;

        const valenceA =
            getValence(atomA)
            - existing.order;

        const valenceB =
            getValence(atomB)
            - existing.order;

        if (
            valenceA + nextOrder > maxA ||
            valenceB + nextOrder > maxB
        ) {

            history.pop();
            return;

        }

        existing.order =
            nextOrder;

    }

    render();

}


/* ============================================================
   DELETE
============================================================ */

function removeAtom(atom) {

    if (!atom) return;

    saveHistory();

    if (
        pendingAtom &&
        pendingAtom.id === atom.id
    ) {

        pendingAtom = null;

    }

    bonds =
        bonds.filter(
            bond =>
                bond.a !== atom.id &&
                bond.b !== atom.id
        );

    atoms =
        atoms.filter(
            item =>
                item.id !== atom.id
        );

    render();

}


function removeBond(bond) {

    if (!bond) return;

    saveHistory();

    bonds =
        bonds.filter(
            item =>
                item.id !== bond.id
        );

    render();

}


/* ============================================================
   STROKE
============================================================ */

function strokeBounds(points) {

    if (!points.length)
        return null;

    let minX = Infinity;
    let maxX = -Infinity;

    let minY = Infinity;
    let maxY = -Infinity;

    points.forEach(
        point => {

            minX =
                Math.min(
                    minX,
                    point.x
                );

            maxX =
                Math.max(
                    maxX,
                    point.x
                );

            minY =
                Math.min(
                    minY,
                    point.y
                );

            maxY =
                Math.max(
                    maxY,
                    point.y
                );

        }
    );

    return {

        minX,
        maxX,
        minY,
        maxY,

        width:
            maxX-minX,

        height:
            maxY-minY

    };

}


function resampleStroke(
    points,
    count = 32
) {

    if (
        points.length < 2
    ) {

        return points.slice();

    }

    const lengths = [0];

    let total = 0;

    for (
        let i=1;
        i<points.length;
        i++
    ) {

        total +=
            Math.hypot(
                points[i].x -
                points[i-1].x,

                points[i].y -
                points[i-1].y
            );

        lengths.push(total);

    }

    if (total === 0)
        return points.slice();

    const result = [];

    for (
        let i=0;
        i<count;
        i++
    ) {

        const target =
            total *
            i /
            (count-1);

        let index = 1;

        while (
            index < lengths.length &&
            lengths[index] < target
        ) {

            index++;

        }

        if (
            index >= lengths.length
        ) {

            result.push(
                points[
                    points.length-1
                ]
            );

            continue;

        }

        const l1 =
            lengths[index-1];

        const l2 =
            lengths[index];

        const ratio =
            (target-l1) /
            (l2-l1 || 1);

        const p1 =
            points[index-1];

        const p2 =
            points[index];

        result.push({

            x:
                p1.x +
                (p2.x-p1.x)*ratio,

            y:
                p1.y +
                (p2.y-p1.y)*ratio

        });

    }

    return result;

}


function normalizeStroke(points) {

    const sampled =
        resampleStroke(
            points,
            32
        );

    if (!sampled.length)
        return [];

    let minX = Infinity;
    let maxX = -Infinity;

    let minY = Infinity;
    let maxY = -Infinity;

    sampled.forEach(
        p => {

            minX =
                Math.min(
                    minX,
                    p.x
                );

            maxX =
                Math.max(
                    maxX,
                    p.x
                );

            minY =
                Math.min(
                    minY,
                    p.y
                );

            maxY =
                Math.max(
                    maxY,
                    p.y
                );

        }
    );

    const width =
        Math.max(
            maxX-minX,
            1
        );

    const height =
        Math.max(
            maxY-minY,
            1
        );

    const size =
        Math.max(
            width,
            height
        );

    return sampled.map(
        p => ({

            x:
                (
                    p.x -
                    (minX+maxX)/2
                ) / size,

            y:
                (
                    p.y -
                    (minY+maxY)/2
                ) / size

        })
    );

}


/* ============================================================
   CIRCLE
============================================================ */

function isCircle(points) {

    if (
        points.length < 18
    ) return false;

    const box =
        strokeBounds(points);

    if (!box) return false;

    const width = box.width;
    const height = box.height;

    if (
        width < 28 ||
        height < 28
    ) return false;

    const ratio =
        Math.min(
            width,
            height
        ) /
        Math.max(
            width,
            height
        );

    if (ratio < .72)
        return false;

    const first = points[0];

    const last =
        points[
            points.length-1
        ];

    const closure =
        Math.hypot(
            first.x-last.x,
            first.y-last.y
        );

    const diameter =
        Math.max(
            width,
            height
        );

    if (
        closure >
        diameter*.28
    ) return false;

    const centerX =
        (
            box.minX +
            box.maxX
        ) / 2;

    const centerY =
        (
            box.minY +
            box.maxY
        ) / 2;

    const expectedRadius =
        (
            width +
            height
        ) / 4;

    let radialError = 0;

    points.forEach(
        point => {

            const radius =
                Math.hypot(
                    point.x-centerX,
                    point.y-centerY
                );

            radialError +=
                Math.abs(
                    radius -
                    expectedRadius
                );

        }
    );

    radialError /=
        points.length;

    if (
        radialError >
        expectedRadius*.24
    ) return false;

    let pathLength = 0;

    for (
        let i=1;
        i<points.length;
        i++
    ) {

        pathLength +=
            Math.hypot(
                points[i].x -
                points[i-1].x,

                points[i].y -
                points[i-1].y
            );

    }

    const expectedCircumference =
        Math.PI * diameter;

    const circumferenceRatio =
        pathLength /
        expectedCircumference;

    if (
        circumferenceRatio < .65 ||
        circumferenceRatio > 1.55
    ) return false;

    return true;

}


/* ============================================================
   RECOGNITION
============================================================ */

function clamp01(value) {

    return Math.max(
        0,
        Math.min(
            1,
            value
        )
    );

}


function rangeScore(
    value,
    idealMin,
    idealMax,
    tolerance
) {

    if (
        value >= idealMin &&
        value <= idealMax
    ) return 1;

    if (value < idealMin) {

        return clamp01(
            1 -
            (
                idealMin-value
            ) /
            tolerance
        );

    }

    return clamp01(
        1 -
        (
            value-idealMax
        ) /
        tolerance
    );

}


function recognizeHScore(points) {

    if (points.length < 8)
        return 0;

    const box =
        strokeBounds(points);

    if (!box)
        return 0;

    const width = box.width;
    const height = box.height;

    if (
        width < 10 ||
        height < 14
    ) return 0;

    const aspect =
        width / height;

    const aspectScore =
        rangeScore(
            aspect,
            .25,
            1.20,
            .70
        );

    const centerX =
        (
            box.minX +
            box.maxX
        ) / 2;

    const centerY =
        (
            box.minY +
            box.maxY
        ) / 2;

    let leftCount = 0;
    let rightCount = 0;

    let leftMinY = Infinity;
    let leftMaxY = -Infinity;

    let rightMinY = Infinity;
    let rightMaxY = -Infinity;

    points.forEach(
        p => {

            if (p.x < centerX) {

                leftCount++;

                leftMinY =
                    Math.min(
                        leftMinY,
                        p.y
                    );

                leftMaxY =
                    Math.max(
                        leftMaxY,
                        p.y
                    );

            }
            else {

                rightCount++;

                rightMinY =
                    Math.min(
                        rightMinY,
                        p.y
                    );

                rightMaxY =
                    Math.max(
                        rightMaxY,
                        p.y
                    );

            }

        }
    );

    const leftRatio =
        leftCount /
        points.length;

    const rightRatio =
        rightCount /
        points.length;

    const sideBalance =
        1 -
        Math.min(
            1,
            Math.abs(
                leftRatio -
                rightRatio
            ) * 2.5
        );

    const leftHeight =
        Math.max(
            0,
            leftMaxY-leftMinY
        );

    const rightHeight =
        Math.max(
            0,
            rightMaxY-rightMinY
        );

    const leftCoverage =
        clamp01(
            leftHeight /
            (height*.72)
        );

    const rightCoverage =
        clamp01(
            rightHeight /
            (height*.72)
        );

    let totalLength = 0;
    let verticalLeftLength = 0;
    let verticalRightLength = 0;
    let centralHorizontalLength = 0;
    let diagonalLength = 0;
    let horizontalLength = 0;
    let verticalLength = 0;

    for (
        let i=1;
        i<points.length;
        i++
    ) {

        const p1 =
            points[i-1];

        const p2 =
            points[i];

        const dx =
            p2.x-p1.x;

        const dy =
            p2.y-p1.y;

        const absDx =
            Math.abs(dx);

        const absDy =
            Math.abs(dy);

        const length =
            Math.hypot(
                dx,
                dy
            );

        if (length < .5)
            continue;

        totalLength += length;

        const midX =
            (
                p1.x+p2.x
            ) / 2;

        const midY =
            (
                p1.y+p2.y
            ) / 2;

        if (
            absDy >
            absDx*1.55
        ) {

            verticalLength += length;

            if (
                midX <
                centerX-width*.18
            ) {

                verticalLeftLength +=
                    length;

            }

            if (
                midX >
                centerX+width*.18
            ) {

                verticalRightLength +=
                    length;

            }

        }

        if (
            absDx >
            absDy*1.70
        ) {

            horizontalLength +=
                length;

            if (
                Math.abs(
                    midY-centerY
                ) <
                height*.27
            ) {

                centralHorizontalLength +=
                    length;

            }

        }

        if (
            absDx >
            length*.30 &&
            absDy >
            length*.30
        ) {

            diagonalLength +=
                length;

        }

    }

    if (totalLength <= 0)
        return 0;

    const verticalLeftRatio =
        verticalLeftLength /
        totalLength;

    const verticalRightRatio =
        verticalRightLength /
        totalLength;

    const diagonalRatio =
        diagonalLength /
        totalLength;

    const verticalStructureScore =
        (
            clamp01(
                verticalLeftRatio/.20
            ) +
            clamp01(
                verticalRightRatio/.20
            )
        ) / 2;

    const horizontalStructureScore =
        clamp01(
            centralHorizontalLength /
            (width*.32)
        );

    const diagonalScore =
        clamp01(
            1 -
            diagonalRatio/.45
        );

    const verticalDominance =
        verticalLength /
        totalLength;

    const verticalDominanceScore =
        clamp01(
            verticalDominance/.38
        );

    const directionalStructure =
        clamp01(
            (
                verticalLength +
                horizontalLength
            ) /
            totalLength /
            .72
        );

    const score =

        verticalStructureScore*.28 +

        horizontalStructureScore*.25 +

        (
            leftCoverage *
            rightCoverage
        )*.15 +

        sideBalance*.08 +

        aspectScore*.08 +

        verticalDominanceScore*.07 +

        directionalStructure*.05 +

        diagonalScore*.04;

    return clamp01(score);

}


function recognizeCScore(points) {

    if (points.length < 8)
        return 0;

    const box =
        strokeBounds(points);

    if (!box)
        return 0;

    const width = box.width;
    const height = box.height;

    if (
        width < 8 ||
        height < 10
    ) return 0;

    const aspect =
        width/height;

    const aspectScore =
        rangeScore(
            aspect,
            .35,
            1.20,
            .75
        );

    const first = points[0];

    const last =
        points[
            points.length-1
        ];

    const endpointYDifference =
        Math.abs(
            first.y-last.y
        );

    const endpointYScore =
        clamp01(
            endpointYDifference /
            (height*.45)
        );

    const endpointXDifference =
        Math.abs(
            first.x-last.x
        );

    const endpointXScore =
        clamp01(
            1 -
            endpointXDifference /
            (width*.75)
        );

    let pathLength = 0;

    for (
        let i=1;
        i<points.length;
        i++
    ) {

        pathLength +=
            Math.hypot(
                points[i].x -
                points[i-1].x,

                points[i].y -
                points[i-1].y
            );

    }

    const directDistance =
        Math.hypot(
            last.x-first.x,
            last.y-first.y
        );

    let curvatureScore = 0;

    if (directDistance > 0) {

        const curvatureRatio =
            pathLength /
            directDistance;

        curvatureScore =
            clamp01(
                (
                    curvatureRatio-1.25
                )/1.10
            );

    }

    const centerX =
        (
            box.minX +
            box.maxX
        )/2;

    const centerY =
        (
            box.minY +
            box.maxY
        )/2;

    let leftCount = 0;
    let rightCount = 0;

    let upper = false;
    let lower = false;

    points.forEach(
        p => {

            if (p.x < centerX)
                leftCount++;
            else
                rightCount++;

            if (
                p.y <
                centerY-height*.12
            )
                upper = true;

            if (
                p.y >
                centerY+height*.12
            )
                lower = true;

        }
    );

    const leftRatio =
        leftCount/points.length;

    const rightRatio =
        rightCount/points.length;

    const leftScore =
        clamp01(
            leftRatio/.50
        );

    const openShapeScore =
        upper && lower
            ? 1
            : 0;

    let horizontalLength = 0;
    let diagonalLength = 0;

    for (
        let i=1;
        i<points.length;
        i++
    ) {

        const dx =
            Math.abs(
                points[i].x -
                points[i-1].x
            );

        const dy =
            Math.abs(
                points[i].y -
                points[i-1].y
            );

        const segmentLength =
            Math.hypot(
                dx,
                dy
            );

        if (
            dx >
            dy*2.5
        ) {

            horizontalLength +=
                segmentLength;

        }

        if (
            dx >
            segmentLength*.30 &&
            dy >
            segmentLength*.30
        ) {

            diagonalLength +=
                segmentLength;

        }

    }

    const horizontalRatio =
        totalSafeRatio(
            horizontalLength,
            pathLength
        );

    const diagonalRatio =
        totalSafeRatio(
            diagonalLength,
            pathLength
        );

    const horizontalScore =
        clamp01(
            1-horizontalRatio/.60
        );

    const diagonalScore =
        clamp01(
            1-diagonalRatio/.60
        );

    const curvatureDominance =
        clamp01(
            curvatureScore *
            (
                1 -
                verticalLikeRatio(points)
            )
        );

    const openingScore =
        endpointYScore*.65 +
        endpointXScore*.35;

    const asymmetryScore =
        clamp01(
            1 -
            Math.abs(
                leftRatio-rightRatio
            )
        );

    const score =

        openingScore*.19 +

        curvatureScore*.25 +

        leftScore*.16 +

        openShapeScore*.08 +

        horizontalScore*.10 +

        diagonalScore*.05 +

        curvatureDominance*.10 +

        (
            1-asymmetryScore
        )*.07;

    const hLike =
        verticalLikeRatio(points);

    const hPenalty =
        clamp01(
            (
                hLike-.30
            )/.35
        );

    return clamp01(
        score *
        (
            1 -
            hPenalty*.65
        )
    );

}


function totalSafeRatio(
    value,
    total
) {

    if (total <= 0)
        return 0;

    return value/total;

}


function verticalLikeRatio(points) {

    if (points.length < 2)
        return 0;

    let total = 0;
    let vertical = 0;

    for (
        let i=1;
        i<points.length;
        i++
    ) {

        const dx =
            points[i].x -
            points[i-1].x;

        const dy =
            points[i].y -
            points[i-1].y;

        const length =
            Math.hypot(
                dx,
                dy
            );

        if (length < .5)
            continue;

        total += length;

        if (
            Math.abs(dy) >
            Math.abs(dx)*1.55
        ) {

            vertical += length;

        }

    }

    if (total <= 0)
        return 0;

    return vertical/total;

}


function recognizeElement(points) {

    if (points.length < 8)
        return null;

    const hScore =
        recognizeHScore(points);

    const cScore =
        recognizeCScore(points);

    if (
        hScore < .48 &&
        cScore < .48
    ) {

        return null;

    }

    if (
        hScore >= .52 &&
        hScore > cScore+.08
    ) {

        return "H";

    }

    if (
        cScore >= .52 &&
        cScore > hScore+.08
    ) {

        return "C";

    }

    if (
        hScore >= .70 &&
        hScore >= cScore
    ) {

        return "H";

    }

    if (
        cScore >= .70 &&
        cScore >= hScore
    ) {

        return "C";

    }

    return null;

}


/* ============================================================
   PENDING ATOM
============================================================ */

function removePendingAtom() {

    if (!pendingAtom)
        return;

    const pendingId =
        pendingAtom.id;

    bonds =
        bonds.filter(
            bond =>
                bond.a !== pendingId &&
                bond.b !== pendingId
        );

    atoms =
        atoms.filter(
            atom =>
                atom.id !== pendingId
        );

    pendingAtom = null;

}


function createPendingAtom(x,y) {

    const nearby =
        atoms.find(
            atom =>
                !atom.pending &&
                Math.hypot(
                    atom.x-x,
                    atom.y-y
                ) < 30
        );

    if (nearby)
        return null;

    saveHistory();

    if (pendingAtom)
        removePendingAtom();

    const atom = {

        id:
            nextAtomId++,

        x,
        y,

        element:
            "?",

        pending:
            true

    };

    atoms.push(atom);

    pendingAtom =
        atom;

    render();

    return atom;

}


function finalizePendingAtom(
    atom,
    element
) {

    if (!atom)
        return;

    if (!element) {

        atom.element = "?";
        atom.pending = true;

        pendingAtom =
            atom;

        render();

        return;

    }

    atom.element =
        element;

    atom.pending =
        false;

    pendingAtom = null;

    render();

}


/* ============================================================
   LIVE STROKE
============================================================ */

let currentStroke = [];


function drawLiveStroke() {

    strokeLayer.innerHTML = "";

    if (
        currentStroke.length < 2
    ) return;

    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    let d =
        `M ${currentStroke[0].x} ${currentStroke[0].y}`;

    for (
        let i=1;
        i<currentStroke.length;
        i++
    ) {

        d +=
            ` L ${currentStroke[i].x} ${currentStroke[i].y}`;

    }

    path.setAttribute(
        "d",
        d
    );

    path.setAttribute(
        "class",
        "rough-stroke"
    );

    strokeLayer.appendChild(path);

}


/* ============================================================
   FINALIZE STROKE
============================================================ */

function finalizeCreateStroke() {

    if (!currentStroke.length)
        return;

    const points =
        currentStroke.slice();

    currentStroke = [];

    strokeLayer.innerHTML = "";

    if (isCircle(points)) {

        const box =
            strokeBounds(points);

        if (box) {

            createPendingAtom(

                (
                    box.minX +
                    box.maxX
                )/2,

                (
                    box.minY +
                    box.maxY
                )/2

            );

        }

        return;

    }

    if (pendingAtom) {

        const element =
            recognizeElement(points);

        finalizePendingAtom(
            pendingAtom,
            element
        );

        return;

    }

    const start =
        points[0];

    const end =
        points[
            points.length-1
        ];

    const atomA =
        findAtomAt(
            start.x,
            start.y
        );

    const atomB =
        findAtomAt(
            end.x,
            end.y
        );

    if (
        atomA &&
        atomB &&
        atomA.id !== atomB.id
    ) {

        connectAtoms(
            atomA,
            atomB
        );

    }

}


/* ============================================================
   MOLECULE
============================================================ */

function getConnectedMolecule(startAtom) {

    const connected =
        new Set();

    if (!startAtom)
        return connected;

    const queue =
        [startAtom.id];

    connected.add(
        startAtom.id
    );

    while (queue.length) {

        const currentId =
            queue.shift();

        bonds.forEach(
            bond => {

                let nextId = null;

                if (
                    bond.a === currentId
                ) {

                    nextId =
                        bond.b;

                }
                else if (
                    bond.b === currentId
                ) {

                    nextId =
                        bond.a;

                }

                if (
                    nextId !== null &&
                    !connected.has(nextId)
                ) {

                    connected.add(
                        nextId
                    );

                    queue.push(
                        nextId
                    );

                }

            }
        );

    }

    return connected;

}


/* ============================================================
   MOLECULE DRAG
============================================================ */

function prepareMoleculeDrag() {

    selectedMolecule =
        getConnectedMolecule(
            selectedAtom
        );

    originalMoleculePositions =
        new Map();

    selectedMolecule.forEach(
        atomId => {

            const atom =
                getAtom(atomId);

            if (!atom)
                return;

            originalMoleculePositions.set(
                atomId,
                {
                    x: atom.x,
                    y: atom.y
                }
            );

        }
    );

}


function updateMoleculeAndItsBonds() {

    selectedMolecule.forEach(
        atomId => {

            const atom =
                getAtom(atomId);

            if (!atom)
                return;

            updateAtomElement(atom);

        }
    );

    const affectedBonds =
        new Set();

    bonds.forEach(
        bond => {

            if (
                selectedMolecule.has(bond.a) ||
                selectedMolecule.has(bond.b)
            ) {

                affectedBonds.add(
                    bond.id
                );

            }

        }
    );

    affectedBonds.forEach(
        bondId => {

            const bond =
                bonds.find(
                    item =>
                        item.id === bondId
                );

            if (!bond)
                return;

            const group =
                bondElements.get(
                    bond.id
                );

            if (group) {

                updateBondElement(
                    bond,
                    group
                );

            }

        }
    );

}


/* ============================================================
   COPY
============================================================ */

function copyMolecule(startAtom) {

    if (
        !startAtom ||
        startAtom.pending === true
    ) {

        return false;

    }

    const moleculeIds =
        getConnectedMolecule(
            startAtom
        );

    if (!moleculeIds.size)
        return false;

    const moleculeAtoms =
        atoms.filter(
            atom =>
                moleculeIds.has(
                    atom.id
                )
        );

    const moleculeBonds =
        bonds.filter(
            bond =>
                moleculeIds.has(bond.a) &&
                moleculeIds.has(bond.b)
        );

    if (!moleculeAtoms.length)
        return false;

    const center =
        moleculeAtoms.reduce(
            (acc,atom) => {

                acc.x += atom.x;
                acc.y += atom.y;

                return acc;

            },
            {
                x: 0,
                y: 0
            }
        );

    center.x /=
        moleculeAtoms.length;

    center.y /=
        moleculeAtoms.length;

    moleculeClipboard = {

        atoms:
            moleculeAtoms.map(
                atom => ({

                    sourceId:
                        atom.id,

                    x:
                        atom.x-center.x,

                    y:
                        atom.y-center.y,

                    element:
                        atom.element

                })
            ),

        bonds:
            moleculeBonds.map(
                bond => ({

                    a:
                        bond.a,

                    b:
                        bond.b,

                    order:
                        bond.order

                })
            )

    };

    status.textContent =
        "Molecule copied";

    return true;

}


/* ============================================================
   CLIPBOARD VALIDATION
============================================================ */

function hasMoleculeClipboard() {

    return !!(
        moleculeClipboard &&
        Array.isArray(
            moleculeClipboard.atoms
        ) &&
        moleculeClipboard.atoms.length > 0
    );

}


/* ============================================================
   PASTE
============================================================ */

function pasteMolecule(x,y) {

    if (!hasMoleculeClipboard()) {

        return false;

    }

    saveHistory();

    const idMap =
        new Map();

    const newAtoms = [];

    moleculeClipboard.atoms.forEach(
        sourceAtom => {

            const newId =
                nextAtomId++;

            idMap.set(
                sourceAtom.sourceId,
                newId
            );

            newAtoms.push({

                id:
                    newId,

                x:
                    x +
                    sourceAtom.x,

                y:
                    y +
                    sourceAtom.y,

                element:
                    sourceAtom.element,

                pending:
                    false

            });

        }
    );

    const newBonds = [];

    moleculeClipboard.bonds.forEach(
        sourceBond => {

            const newA =
                idMap.get(
                    sourceBond.a
                );

            const newB =
                idMap.get(
                    sourceBond.b
                );

            if (
                newA === undefined ||
                newB === undefined
            ) {

                return;

            }

            newBonds.push({

                id:
                    nextBondId++,

                a:
                    newA,

                b:
                    newB,

                order:
                    sourceBond.order

            });

        }
    );

    atoms.push(
        ...newAtoms
    );

    bonds.push(
        ...newBonds
    );

    pendingAtom = null;

    render();

    status.textContent =
        "Molecule pasted";

    return true;

}


/* ============================================================
   MENU
============================================================ */

function positionMoleculeMenu(x,y) {

    const workspaceRect =
        document
            .getElementById("workspace")
            .getBoundingClientRect();

    const menuWidth = 180;
    const menuHeight = 150;

    let left = x;
    let top = y;

    if (
        left + menuWidth >
        workspaceRect.width-10
    ) {

        left =
            workspaceRect.width -
            menuWidth -
            10;

    }

    if (left < 10)
        left = 10;

    if (
        top + menuHeight >
        workspaceRect.height-10
    ) {

        top =
            y-menuHeight;

    }

    if (top < 10)
        top = 10;

    moleculeMenu.style.left =
        `${left}px`;

    moleculeMenu.style.top =
        `${top}px`;

}


function openMoleculeMenu(
    atom,
    x,
    y
) {

    /*
        selectedAtom continua a essere usato
        per lo stato temporaneo del puntatore.

        moleculeMenuAtom invece conserva
        la molecola associata al menu anche
        dopo che la Pencil viene sollevata.
    */

    selectedAtom =
        atom || null;

    moleculeMenuAtom =
        atom || null;

    selectedMolecule =
        atom
            ? getConnectedMolecule(atom)
            : new Set();

    moleculeMenuAnchor = {
        x,
        y
    };

    positionMoleculeMenu(
        x,
        y
    );

    moleculeMenu.classList.add(
        "visible"
    );

    const canCopy =
        !!atom &&
        atom.pending !== true;

    copyMoleculeBtn.classList.toggle(
        "disabled",
        !canCopy
    );

    /*
        Paste resta sempre cliccabile.
        La disponibilità viene controllata
        direttamente al click.
    */

    pasteMoleculeBtn.classList.remove(
        "disabled"
    );

    status.textContent =
        "Molecule menu";

}


function closeMoleculeMenu() {

    moleculeMenu.classList.remove(
        "visible"
    );

    moleculeMenuAnchor = null;

    /*
        Ora possiamo eliminare il riferimento
        persistente alla molecola del menu.
    */

    moleculeMenuAtom = null;

}


/* ============================================================
   MENU ACTIONS
============================================================ */

copyMoleculeBtn.onclick = () => {

    /*
        IMPORTANTE:

        Non usiamo selectedAtom qui.

        selectedAtom viene azzerato da
        finishPointer() quando la Pencil
        viene sollevata.

        Usiamo invece moleculeMenuAtom,
        che rimane valido finché il menu
        resta aperto.
    */

    if (
        !moleculeMenuAtom ||
        moleculeMenuAtom.pending === true
    ) {

        closeMoleculeMenu();
        return;

    }

    const copied =
        copyMolecule(
            moleculeMenuAtom
        );

    if (copied) {

        closeMoleculeMenu();

    }

};


pasteMoleculeBtn.onclick = () => {

    /*
        Controlliamo il clipboard SOLO qui.

        Quindi il bottone non può diventare
        inutilmente "morto" perché una classe
        CSS è rimasta indietro.
    */

    if (!hasMoleculeClipboard()) {

        status.textContent =
            "Nothing to paste";

        return;

    }

    if (!moleculeMenuAnchor) {

        closeMoleculeMenu();
        return;

    }

    /*
        Paste dal menu:
        offset di +80,+80 per evitare
        di sovrapporre la copia all'originale.
    */

    const pasteX =
        moleculeMenuAnchor.x + 80;

    const pasteY =
        moleculeMenuAnchor.y + 80;

    pasteMolecule(
        pasteX,
        pasteY
    );

    closeMoleculeMenu();

};


closeMenuBtn.onclick = () => {

    closeMoleculeMenu();

};


/* ============================================================
   OUTSIDE MENU
============================================================ */

document.addEventListener(
    "pointerdown",
    event => {

        if (
            !moleculeMenu.classList.contains(
                "visible"
            )
        ) {

            return;

        }

        if (
            moleculeMenu.contains(
                event.target
            )
        ) {

            return;

        }

        closeMoleculeMenu();

    }
);


/* ============================================================
   POINTER STATE
============================================================ */

let activePointer = null;

let selectedAtom = null;

let selectedMolecule =
    new Set();

let dragStart = null;

let originalAtomPosition = null;

let originalMoleculePositions =
    new Map();

let longPressTimer = null;

let longPressTriggered = false;

let movementStarted = false;

let historySavedForDrag = false;


/* ============================================================
   PENCIL MENU STATE
============================================================ */

let pencilMenuTriggered = false;

let pencilMenuPoint = null;


/* ============================================================
   LONG PRESS
============================================================ */

const LONG_PRESS_DURATION = 550;

const LONG_PRESS_MOVE_THRESHOLD = 10;


function getInteractionType(event) {

    if (
        event.pointerType === "pen"
    ) {

        return "create";

    }

    if (
        event.pointerType === "touch"
    ) {

        return "move";

    }

    return manualMode;

}


function getCanvasPoint(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };

}


function cancelLongPress() {

    if (
        longPressTimer !== null
    ) {

        clearTimeout(
            longPressTimer
        );

        longPressTimer = null;

    }

}


/* ============================================================
   FINGER LONG PRESS
============================================================ */

function startLongPress() {

    cancelLongPress();

    longPressTimer =
        setTimeout(
            () => {

                longPressTimer = null;

                if (
                    movementStarted ||
                    !selectedAtom
                ) {

                    return;

                }

                longPressTriggered =
                    true;

                prepareMoleculeDrag();

                status.textContent =
                    "Molecule selected · Drag to move";

            },
            LONG_PRESS_DURATION
        );

}


/* ============================================================
   PENCIL LONG PRESS
============================================================ */

function startPencilMenuLongPress(
    point,
    atom
) {

    cancelLongPress();

    longPressTimer =
        setTimeout(
            () => {

                longPressTimer = null;

                if (movementStarted) {
                    return;
                }

                pencilMenuTriggered =
                    true;

                pencilMenuPoint = {
                    x: point.x,
                    y: point.y
                };

                currentStroke = [];

                strokeLayer.innerHTML = "";

                openMoleculeMenu(
                    atom || null,
                    point.x,
                    point.y
                );

            },
            LONG_PRESS_DURATION
        );

}


/* ============================================================
   POINTER DOWN
============================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        const point =
            getCanvasPoint(
                event
            );

        const interaction =
            getInteractionType(
                event
            );

        activePointer = {

            id:
                event.pointerId,

            type:
                interaction,

            pointerType:
                event.pointerType

        };

        selectedAtom = null;

        selectedMolecule =
            new Set();

        dragStart = null;

        originalAtomPosition = null;

        originalMoleculePositions =
            new Map();

        longPressTriggered =
            false;

        movementStarted =
            false;

        historySavedForDrag =
            false;

        pencilMenuTriggered =
            false;

        pencilMenuPoint =
            null;

        cancelLongPress();


        /* ================================
           ERASE
        ================================= */

        if (
            manualMode === "erase"
        ) {

            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );

            if (atom) {

                removeAtom(atom);

                activePointer = null;

                return;

            }

            const bond =
                findBondAt(
                    point.x,
                    point.y
                );

            if (bond) {

                removeBond(bond);

                activePointer = null;

                return;

            }

            activePointer = null;

            return;

        }


        /* ================================
           FINGER
        ================================= */

        if (
            interaction === "move"
        ) {

            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );


            /*
                FINGER + VUOTO

                Incolla direttamente.

                NON apre il menu.
            */

            if (!atom) {

                if (
                    hasMoleculeClipboard()
                ) {

                    pasteMolecule(
                        point.x,
                        point.y
                    );

                }

                activePointer = null;

                return;

            }


            selectedAtom =
                atom;

            dragStart = {

                x:
                    point.x,

                y:
                    point.y

            };

            originalAtomPosition = {

                x:
                    atom.x,

                y:
                    atom.y

            };

            prepareMoleculeDrag();

            canvas.setPointerCapture(
                event.pointerId
            );

            startLongPress();

            return;

        }


        /* ================================
           PENCIL
        ================================= */

        if (
            interaction === "create"
        ) {

            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );

            if (atom) {

                selectedAtom =
                    atom;

            }

            dragStart = {

                x:
                    point.x,

                y:
                    point.y

            };

            canvas.setPointerCapture(
                event.pointerId
            );

            startPencilMenuLongPress(
                point,
                atom
            );

            return;

        }

    },
    {
        passive:false
    }
);


/* ============================================================
   POINTER MOVE
============================================================ */

canvas.addEventListener(
    "pointermove",
    event => {

        if (
            !activePointer ||
            activePointer.id !==
            event.pointerId
        ) {

            return;

        }

        event.preventDefault();

        const point =
            getCanvasPoint(
                event
            );


        /* ================================
           FINGER
        ================================= */

        if (
            activePointer.type ===
            "move" &&
            selectedAtom
        ) {

            const dx =
                point.x -
                dragStart.x;

            const dy =
                point.y -
                dragStart.y;

            const movementDistance =
                Math.hypot(
                    dx,
                    dy
                );

            if (
                !longPressTriggered &&
                movementDistance >
                LONG_PRESS_MOVE_THRESHOLD
            ) {

                cancelLongPress();

            }

            if (
                !longPressTriggered
            ) {

                if (
                    !historySavedForDrag &&
                    movementDistance > 0
                ) {

                    saveHistory();

                    historySavedForDrag =
                        true;

                }

                selectedAtom.x =
                    originalAtomPosition.x +
                    dx;

                selectedAtom.y =
                    originalAtomPosition.y +
                    dy;

                movementStarted =
                    movementDistance > 0;

                updateAtomAndItsBonds(
                    selectedAtom
                );

                return;

            }


            if (
                longPressTriggered
            ) {

                if (
                    !historySavedForDrag &&
                    movementDistance > 0
                ) {

                    saveHistory();

                    historySavedForDrag =
                        true;

                }

                selectedMolecule.forEach(
                    atomId => {

                        const atom =
                            getAtom(atomId);

                        const original =
                            originalMoleculePositions.get(
                                atomId
                            );

                        if (
                            !atom ||
                            !original
                        ) {

                            return;

                        }

                        atom.x =
                            original.x + dx;

                        atom.y =
                            original.y + dy;

                    }
                );

                movementStarted =
                    movementDistance > 0;

                updateMoleculeAndItsBonds();

                return;

            }

        }


        /* ================================
           PENCIL
        ================================= */

        if (
            activePointer.type ===
            "create"
        ) {

            /*
                Prima dei 550 ms:
                stiamo ancora distinguendo
                long press da disegno.
            */

            if (
                !pencilMenuTriggered &&
                currentStroke.length === 0 &&
                dragStart
            ) {

                const dx =
                    point.x -
                    dragStart.x;

                const dy =
                    point.y -
                    dragStart.y;

                const movementDistance =
                    Math.hypot(
                        dx,
                        dy
                    );

                if (
                    movementDistance >
                    LONG_PRESS_MOVE_THRESHOLD
                ) {

                    cancelLongPress();

                    const startPoint = {

                        x:
                            dragStart.x,

                        y:
                            dragStart.y

                    };

                    selectedAtom = null;

                    currentStroke = [

                        startPoint,

                        point

                    ];

                    dragStart = null;

                    movementStarted =
                        true;

                    drawLiveStroke();

                }

                return;

            }


            if (
                pencilMenuTriggered
            ) {

                return;

            }

            currentStroke.push(
                point
            );

            drawLiveStroke();

        }

    },
    {
        passive:false
    }
);


/* ============================================================
   POINTER FINISH
============================================================ */

function finishPointer(event) {

    if (
        !activePointer ||
        activePointer.id !==
        event.pointerId
    ) {

        return;

    }

    event.preventDefault();

    cancelLongPress();


    /* ================================
       FINGER
    ================================= */

    if (
        activePointer.type ===
        "move"
    ) {

        selectedAtom = null;

        selectedMolecule =
            new Set();

        dragStart = null;

        originalAtomPosition =
            null;

        originalMoleculePositions =
            new Map();

        longPressTriggered =
            false;

        movementStarted =
            false;

        historySavedForDrag =
            false;

        status.textContent =
            "Pencil creates · Finger moves";

    }


    /* ================================
       PENCIL
    ================================= */

    if (
        activePointer.type ===
        "create"
    ) {

        if (
            pencilMenuTriggered
        ) {

            currentStroke = [];

            strokeLayer.innerHTML = "";

        }
        else {

            if (
                currentStroke.length
            ) {

                finalizeCreateStroke();

            }

        }

    }


    if (
        canvas.hasPointerCapture(
            event.pointerId
        )
    ) {

        canvas.releasePointerCapture(
            event.pointerId
        );

    }

    /*
        Questo reset rimane intenzionalmente.

        NON tocchiamo moleculeMenuAtom:
        quello deve sopravvivere al rilascio
        della Pencil finché il menu è aperto.
    */

    selectedAtom = null;

    dragStart = null;

    pencilMenuTriggered =
        false;

    pencilMenuPoint =
        null;

    activePointer =
        null;

}


/* ============================================================
   POINTER UP / CANCEL
============================================================ */

canvas.addEventListener(
    "pointerup",
    finishPointer,
    {
        passive:false
    }
);

canvas.addEventListener(
    "pointercancel",
    finishPointer,
    {
        passive:false
    }
);


/* ============================================================
   INITIAL RENDER
============================================================ */

render();

status.textContent =
    "Pencil creates · Finger moves";

</script>

</body>
</html>
