<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">

<title>BONDraw 0.5</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4f5f7;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            sans-serif;
        color: #181a1f;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    /* =========================
       HEADER
       ========================= */

    header {
        height: 72px;
        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 20px;

        background: rgba(255,255,255,.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border-bottom: 1px solid rgba(0,0,0,.07);

        z-index: 10;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo-dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #181a1f;
    }

    .brand-name {
        font-size: 22px;
        font-weight: 750;
        letter-spacing: -0.8px;
    }

    .version {
        font-size: 13px;
        color: #858992;
        font-weight: 600;
        margin-left: 2px;
    }

    .status {
        font-size: 13px;
        color: #858992;
        font-weight: 500;
    }

    /* =========================
       WORKSPACE
       ========================= */

    #workspace {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }

    #canvas {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        display: block;

        background:
            radial-gradient(
                circle at 50% 45%,
                rgba(255,255,255,.9),
                rgba(244,245,247,.95)
            );

        touch-action: none;
    }

    /* =========================
       EMPTY STATE
       ========================= */

    #emptyState {
        position: absolute;
        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        text-align: center;
        pointer-events: none;

        transition: opacity .2s ease;
    }

    #emptyState.hidden {
        opacity: 0;
    }

    .empty-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.6px;
        margin-bottom: 7px;
    }

    .empty-subtitle {
        font-size: 15px;
        color: #858992;
        line-height: 1.45;
    }

    /* =========================
       TOOLBAR
       ========================= */

    #toolbar {
        position: absolute;

        left: 50%;
        bottom: 22px;

        transform: translateX(-50%);

        display: flex;
        align-items: center;
        gap: 6px;

        padding: 7px;

        background: rgba(255,255,255,.9);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border: 1px solid rgba(0,0,0,.08);
        border-radius: 18px;

        box-shadow:
            0 10px 35px rgba(0,0,0,.10);

        z-index: 20;
    }

    button {
        border: 0;
        outline: 0;

        height: 40px;
        padding: 0 15px;

        border-radius: 12px;

        background: transparent;
        color: #686c74;

        font-family: inherit;
        font-size: 14px;
        font-weight: 650;

        cursor: pointer;

        transition:
            background .15s ease,
            color .15s ease;
    }

    button:active {
        transform: scale(.97);
    }

    button.active {
        background: #181a1f;
        color: white;
    }

    button.danger {
        color: #b04444;
    }

    .divider {
        width: 1px;
        height: 25px;
        background: rgba(0,0,0,.09);
        margin: 0 2px;
    }

    /* =========================
       SVG CHEMISTRY
       ========================= */

    .bond {
        stroke: #202228;
        stroke-width: 2.6;
        stroke-linecap: round;
        fill: none;
        pointer-events: none;
    }

    .atom-circle {
        fill: rgba(255,255,255,.96);
        stroke: #202228;
        stroke-width: 2.4;
    }

    .atom-label {
        fill: #202228;
        font-size: 17px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
    }

    .atom.pending .atom-circle {
        fill: rgba(255,255,255,.72);
        stroke: #999da6;
        stroke-width: 2;
        stroke-dasharray: 5 5;
    }

    .atom.pending .atom-label {
        fill: #999da6;
    }

    .rough-stroke {
        fill: none;
        stroke: #8e929b;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: .8;
        pointer-events: none;
    }

    /* =========================
       HELP
       ========================= */

    #interactionHint {
        position: absolute;
        right: 18px;
        bottom: 25px;

        padding: 8px 11px;

        border-radius: 11px;

        background: rgba(255,255,255,.78);
        border: 1px solid rgba(0,0,0,.06);

        color: #888c94;

        font-size: 12px;
        font-weight: 550;

        pointer-events: none;
    }

    @media (max-width: 650px) {
        header {
            height: 64px;
            padding: 0 15px;
        }

        .brand-name {
            font-size: 20px;
        }

        .status {
            display: none;
        }

        #toolbar {
            bottom: 14px;
        }

        button {
            padding: 0 12px;
        }

        #interactionHint {
            display: none;
        }
    }
</style>
</head>

<body>

<header>
    <div class="brand">
        <div class="logo-dot"></div>

        <div class="brand-name">
            BONDraw
        </div>

        <div class="version">
            0.5
        </div>
    </div>

    <div class="status" id="status">
        Pencil creates · Finger moves
    </div>
</header>

<div id="workspace">

    <svg id="canvas"
         xmlns="http://www.w3.org/2000/svg">

        <g id="bondLayer"></g>
        <g id="atomLayer"></g>
        <g id="strokeLayer"></g>

    </svg>

    <div id="emptyState">
        <div class="empty-title">
            Draw chemistry naturally.
        </div>

        <div class="empty-subtitle">
            Use Apple Pencil to create atoms and bonds.<br>
            Use your finger to move molecules.
        </div>
    </div>

    <div id="interactionHint">
        🖊️ Create &nbsp;·&nbsp; 👆 Move
    </div>

    <div id="toolbar">

        <button id="createBtn" class="active">
            Create
        </button>

        <button id="moveBtn">
            Move
        </button>

        <button id="eraseBtn">
            Erase
        </button>

        <div class="divider"></div>

        <button id="undoBtn">
            Undo
        </button>

        <button id="clearBtn" class="danger">
            Clear
        </button>

    </div>

</div>

<script>
/* ============================================================
   BONDraw 0.5
   Pencil = CREATE
   Finger = MOVE
   Erase = explicit mode
   ============================================================ */


/* ============================================================
   SVG REFERENCES
   ============================================================ */

const canvas = document.getElementById("canvas");
const atomLayer = document.getElementById("atomLayer");
const bondLayer = document.getElementById("bondLayer");
const strokeLayer = document.getElementById("strokeLayer");

const emptyState = document.getElementById("emptyState");
const status = document.getElementById("status");

const createBtn = document.getElementById("createBtn");
const moveBtn = document.getElementById("moveBtn");
const eraseBtn = document.getElementById("eraseBtn");
const undoBtn = document.getElementById("undoBtn");
const clearBtn = document.getElementById("clearBtn");


/* ============================================================
   CHEMICAL MODEL
   ============================================================ */

let atoms = [];
let bonds = [];

let nextAtomId = 1;
let nextBondId = 1;


/*
    Atom sizes.
*/

const ATOM_RADIUS = {
    C: 27,
    H: 23
};


/*
    Maximum total bond order.

    C = 4
    H = 1
*/

const VALENCE = {
    C: 4,
    H: 1
};


/* ============================================================
   MODES
   ============================================================ */

let manualMode = "create";


function setManualMode(mode) {

    manualMode = mode;

    createBtn.classList.toggle(
        "active",
        mode === "create"
    );

    moveBtn.classList.toggle(
        "active",
        mode === "move"
    );

    eraseBtn.classList.toggle(
        "active",
        mode === "erase"
    );
}


/*
    IMPORTANT:

    The toolbar is now mostly a fallback/debug control.

    Normally:
        Pencil -> create
        Finger -> move

    Erase remains explicit.
*/


createBtn.addEventListener(
    "click",
    () => setManualMode("create")
);

moveBtn.addEventListener(
    "click",
    () => setManualMode("move")
);

eraseBtn.addEventListener(
    "click",
    () => setManualMode("erase")
);


/* ============================================================
   HISTORY
   ============================================================ */

const history = [];


function saveHistory() {

    history.push({
        atoms: JSON.parse(JSON.stringify(atoms)),
        bonds: JSON.parse(JSON.stringify(bonds))
    });

    if (history.length > 50) {
        history.shift();
    }
}


undoBtn.addEventListener(
    "click",
    () => {

        if (!history.length) return;

        const previous = history.pop();

        atoms = previous.atoms;
        bonds = previous.bonds;

        render();
    }
);


clearBtn.addEventListener(
    "click",
    () => {

        if (!atoms.length && !bonds.length) {
            return;
        }

        saveHistory();

        atoms = [];
        bonds = [];

        render();
    }
);


/* ============================================================
   UTILS
   ============================================================ */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


function getAtom(id) {

    return atoms.find(
        atom => atom.id === id
    );
}


function getAtomRadius(atom) {

    return ATOM_RADIUS[atom.element] || 27;
}


function getValence(atom) {

    return bonds.reduce(
        (sum, bond) => {

            if (
                bond.a === atom.id ||
                bond.b === atom.id
            ) {
                return sum + bond.order;
            }

            return sum;
        },
        0
    );
}


function canAddBond(atomA, atomB, order) {

    if (!atomA || !atomB) return false;

    const valenceA =
        getValence(atomA);

    const valenceB =
        getValence(atomB);

    const maxA =
        VALENCE[atomA.element] ?? 4;

    const maxB =
        VALENCE[atomB.element] ?? 4;

    return (
        valenceA + order <= maxA &&
        valenceB + order <= maxB
    );
}


/* ============================================================
   MOLECULE / CONNECTED COMPONENT
   ============================================================ */

/*
    Returns every atom connected to the selected atom.

    This is what makes finger dragging feel like
    moving a molecule rather than deforming it.
*/

function getConnectedComponent(startId) {

    const visited = new Set();
    const queue = [startId];

    while (queue.length) {

        const current = queue.shift();

        if (visited.has(current)) {
            continue;
        }

        visited.add(current);

        bonds.forEach(
            bond => {

                if (bond.a === current) {
                    queue.push(bond.b);
                }

                if (bond.b === current) {
                    queue.push(bond.a);
                }
            }
        );
    }

    return atoms.filter(
        atom => visited.has(atom.id)
    );
}


/* ============================================================
   POINTER STATE
   ============================================================ */

let activePointer = null;

let drawing = false;

let currentStroke = [];

let pendingAtom = null;


/*
    Finger molecule dragging.
*/

let moleculeDrag = null;


/*
    Structure:

    {
        pointerId,
        atomIds,
        startX,
        startY,
        originalPositions
    }
*/


/* ============================================================
   POINTER TYPE
   ============================================================ */

function getInteractionType(event) {

    /*
        Apple Pencil / stylus
        -> create

        Finger / touch
        -> move

        Mouse
        -> use the currently selected toolbar mode

        This makes desktop debugging possible.
    */

    if (event.pointerType === "pen") {
        return "create";
    }

    if (event.pointerType === "touch") {
        return "move";
    }

    return manualMode;
}


/* ============================================================
   COORDINATES
   ============================================================ */

function getCanvasPoint(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}


/* ============================================================
   ATOM HIT TEST
   ============================================================ */

function findAtomAt(x, y) {

    /*
        Search backwards so the visually
        top-most atom wins.
    */

    for (let i = atoms.length - 1; i >= 0; i--) {

        const atom = atoms[i];

        const radius =
            getAtomRadius(atom) + 7;

        if (
            Math.hypot(
                atom.x - x,
                atom.y - y
            ) <= radius
        ) {
            return atom;
        }
    }

    return null;
}


/* ============================================================
   BOND HIT TEST
   ============================================================ */

function pointToSegmentDistance(
    px,
    py,
    x1,
    y1,
    x2,
    y2
) {

    const dx = x2 - x1;
    const dy = y2 - y1;

    if (dx === 0 && dy === 0) {

        return Math.hypot(
            px - x1,
            py - y1
        );
    }

    const t = Math.max(
        0,
        Math.min(
            1,
            (
                (px - x1) * dx +
                (py - y1) * dy
            ) /
            (dx * dx + dy * dy)
        )
    );

    const cx = x1 + t * dx;
    const cy = y1 + t * dy;

    return Math.hypot(
        px - cx,
        py - cy
    );
}


function findBondAt(x, y) {

    for (let i = bonds.length - 1; i >= 0; i--) {

        const bond = bonds[i];

        const a = getAtom(bond.a);
        const b = getAtom(bond.b);

        if (!a || !b) continue;

        const d =
            pointToSegmentDistance(
                x,
                y,
                a.x,
                a.y,
                b.x,
                b.y
            );

        if (d < 12) {
            return bond;
        }
    }

    return null;
}


/* ============================================================
   SVG ELEMENT MAP
   ============================================================ */

/*
    Persistent references.

    This is important.

    During movement we do NOT rebuild the SVG.
    We simply update the existing elements.
*/

const atomElements = new Map();
const bondElements = new Map();


/* ============================================================
   CREATE ATOM SVG
   ============================================================ */

function createAtomElement(atom) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.setAttribute(
        "class",
        "atom"
    );

    group.setAttribute(
        "data-atom-id",
        atom.id
    );

    const circle =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    circle.setAttribute(
        "class",
        "atom-circle"
    );

    circle.setAttribute(
        "r",
        getAtomRadius(atom)
    );

    const label =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    label.setAttribute(
        "class",
        "atom-label"
    );

    label.textContent =
        atom.element || "?";

    group.appendChild(circle);
    group.appendChild(label);

    atomLayer.appendChild(group);

    atomElements.set(
        atom.id,
        group
    );

    return group;
}


/* ============================================================
   CREATE BOND SVG
   ============================================================ */

function createBondElement(bond) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.setAttribute(
        "class",
        "bond-group"
    );

    group.setAttribute(
        "data-bond-id",
        bond.id
    );

    bondLayer.appendChild(group);

    bondElements.set(
        bond.id,
        group
    );

    return group;
}


/* ============================================================
   BOND GEOMETRY
   ============================================================ */

function updateBondElement(
    bond,
    group
) {

    const a = getAtom(bond.a);
    const b = getAtom(bond.b);

    if (!a || !b) return;

    group.innerHTML = "";

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const len =
        Math.hypot(dx, dy);

    if (len === 0) return;

    const ux = dx / len;
    const uy = dy / len;

    const nx = -uy;
    const ny = ux;

    const startRadius =
        getAtomRadius(a);

    const endRadius =
        getAtomRadius(b);

    const startX =
        a.x + ux * startRadius;

    const startY =
        a.y + uy * startRadius;

    const endX =
        b.x - ux * endRadius;

    const endY =
        b.y - uy * endRadius;

    const spacing = 6;

    const orders = [];

    if (bond.order === 1) {

        orders.push(0);

    } else if (bond.order === 2) {

        orders.push(
            -spacing / 2,
            spacing / 2
        );

    } else {

        orders.push(
            -spacing,
            0,
            spacing
        );
    }

    orders.forEach(offset => {

        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.setAttribute(
            "class",
            "bond"
        );

        line.setAttribute(
            "x1",
            startX + nx * offset
        );

        line.setAttribute(
            "y1",
            startY + ny * offset
        );

        line.setAttribute(
            "x2",
            endX + nx * offset
        );

        line.setAttribute(
            "y2",
            endY + ny * offset
        );

        group.appendChild(line);
    });
}


/* ============================================================
   UPDATE ATOM ELEMENT
   ============================================================ */

function updateAtomElement(atom) {

    let group =
        atomElements.get(atom.id);

    if (!group) {
        group = createAtomElement(atom);
    }

    group.setAttribute(
        "transform",
        `translate(${atom.x} ${atom.y})`
    );

    const circle =
        group.querySelector(
            ".atom-circle"
        );

    const label =
        group.querySelector(
            ".atom-label"
        );

    circle.setAttribute(
        "r",
        getAtomRadius(atom)
    );

    label.textContent =
        atom.element || "?";

    group.classList.toggle(
        "pending",
        atom.pending === true
    );
}


/* ============================================================
   FULL RENDER
   ============================================================ */

function render() {

    /*
        Rebuild only when the chemical model changes.

        Movement itself uses update functions,
        not this function.
    */

    atomElements.forEach(
        element => element.remove()
    );

    bondElements.forEach(
        element => element.remove()
    );

    atomElements.clear();
    bondElements.clear();

    bonds.forEach(
        bond => {

            const group =
                createBondElement(bond);

            updateBondElement(
                bond,
                group
            );
        }
    );

    atoms.forEach(
        atom => {

            const group =
                createAtomElement(atom);

            updateAtomElement(atom);
        }
    );

    emptyState.classList.toggle(
        "hidden",
        atoms.length > 0
    );
}


/* ============================================================
   LIVE MOLECULE UPDATE
   ============================================================ */

function updateMoleculeVisuals(atomIds) {

    const atomIdSet =
        new Set(atomIds);

    /*
        Update atoms.
    */

    atoms.forEach(atom => {

        if (!atomIdSet.has(atom.id)) {
            return;
        }

        updateAtomElement(atom);
    });


    /*
        Update every bond touching
        one of the moved atoms.
    */

    bonds.forEach(bond => {

        if (
            atomIdSet.has(bond.a) ||
            atomIdSet.has(bond.b)
        ) {

            const group =
                bondElements.get(bond.id);

            if (group) {
                updateBondElement(
                    bond,
                    group
                );
            }
        }
    });
}


/* ============================================================
   FIND EXISTING BOND
   ============================================================ */

function findBondBetween(
    atomA,
    atomB
) {

    return bonds.find(
        bond =>
            (
                bond.a === atomA.id &&
                bond.b === atomB.id
            ) ||
            (
                bond.a === atomB.id &&
                bond.b === atomA.id
            )
    );
}


/* ============================================================
   ADD / CYCLE BOND
   ============================================================ */

function connectAtoms(atomA, atomB) {

    if (!atomA || !atomB) return;

    if (atomA.id === atomB.id) {
        return;
    }

    const existing =
        findBondBetween(
            atomA,
            atomB
        );

    saveHistory();

    if (!existing) {

        if (
            !canAddBond(
                atomA,
                atomB,
                1
            )
        ) {

            history.pop();

            return;
        }

        bonds.push({
            id: nextBondId++,
            a: atomA.id,
            b: atomB.id,
            order: 1
        });

    } else {

        const nextOrder =
            existing.order === 3
                ? 1
                : existing.order + 1;

        const currentWithout =
            getValence(atomA) -
            existing.order;

        const currentWithoutB =
            getValence(atomB) -
            existing.order;

        const maxA =
            VALENCE[atomA.element] ?? 4;

        const maxB =
            VALENCE[atomB.element] ?? 4;

        if (
            currentWithout + nextOrder > maxA ||
            currentWithoutB + nextOrder > maxB
        ) {

            history.pop();

            return;
        }

        existing.order =
            nextOrder;
    }

    render();
}


/* ============================================================
   REMOVE ATOM
   ============================================================ */

function removeAtom(atom) {

    if (!atom) return;

    saveHistory();

    bonds =
        bonds.filter(
            bond =>
                bond.a !== atom.id &&
                bond.b !== atom.id
        );

    atoms =
        atoms.filter(
            item =>
                item.id !== atom.id
        );

    render();
}


/* ============================================================
   REMOVE BOND
   ============================================================ */

function removeBond(bond) {

    if (!bond) return;

    saveHistory();

    bonds =
        bonds.filter(
            item =>
                item.id !== bond.id
        );

    render();
}


/* ============================================================
   STROKE GEOMETRY
   ============================================================ */

function strokeBounds(points) {

    if (!points.length) {
        return null;
    }

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;

    points.forEach(p => {

        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);

        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
    });

    return {
        minX,
        maxX,
        minY,
        maxY,
        width: maxX - minX,
        height: maxY - minY
    };
}


/* ============================================================
   RECOGNIZE C / H
   ============================================================ */

function recognizeElement(points) {

    if (points.length < 5) {
        return null;
    }

    const box =
        strokeBounds(points);

    if (!box) return null;

    const {
        width,
        height
    } = box;

    if (
        width < 4 ||
        height < 4
    ) {
        return null;
    }


    /*
        Normalize points.
    */

    const total =
        points.length;

    let leftCount = 0;
    let rightCount = 0;
    let centerCount = 0;

    const centerX =
        (box.minX + box.maxX) / 2;

    points.forEach(p => {

        if (
            p.x <
            centerX - width * .12
        ) {
            leftCount++;
        }

        if (
            p.x >
            centerX + width * .12
        ) {
            rightCount++;
        }

        if (
            Math.abs(p.x - centerX)
            < width * .14
        ) {
            centerCount++;
        }
    });

    const leftRatio =
        leftCount / total;

    const rightRatio =
        rightCount / total;


    /*
        C recognition.

        IMPORTANT:
        This mapping is intentionally
        preserved from the working 0.3/0.4
        version.
    */

    if (
        leftRatio > 0.12 &&
        rightRatio > 0.12 &&
        centerCount > total * 0.10
    ) {
        return "C";
    }

    if (
        leftRatio > 0.18 &&
        (
            rightRatio < 0.22 ||
            width >= height * 0.65
        )
    ) {
        return "H";
    }

    if (
        width < height * 0.72 &&
        centerCount > total * 0.16
    ) {
        return "C";
    }

    if (leftRatio > 0.20) {
        return "H";
    }

    return null;
}


/* ============================================================
   RECOGNIZE CIRCLE
   ============================================================ */

function isCircle(points) {

    if (points.length < 12) {
        return false;
    }

    const box =
        strokeBounds(points);

    if (!box) return false;

    const {
        width,
        height
    } = box;

    if (
        width < 20 ||
        height < 20
    ) {
        return false;
    }

    const ratio =
        Math.min(width, height) /
        Math.max(width, height);

    if (ratio < 0.55) {
        return false;
    }

    const centerX =
        (box.minX + box.maxX) / 2;

    const centerY =
        (box.minY + box.maxY) / 2;

    const expectedRadius =
        (width + height) / 4;

    let distanceSum = 0;

    points.forEach(p => {

        distanceSum += Math.abs(
            Math.hypot(
                p.x - centerX,
                p.y - centerY
            ) -
            expectedRadius
        );
    });

    const averageError =
        distanceSum / points.length;

    return (
        averageError <
        expectedRadius * .38
    );
}


/* ============================================================
   DISTANCE FROM POINT TO STROKE
   ============================================================ */

function nearestAtomToStroke(points) {

    if (!points.length) {
        return null;
    }

    let best = null;
    let bestDistance = Infinity;

    atoms.forEach(atom => {

        points.forEach(point => {

            const d =
                Math.hypot(
                    atom.x - point.x,
                    atom.y - point.y
                );

            if (d < bestDistance) {

                bestDistance = d;
                best = atom;
            }
        });
    });

    if (bestDistance < 45) {
        return best;
    }

    return null;
}


/* ============================================================
   PENDING ATOM
   ============================================================ */

function createPendingAtom(x, y) {

    /*
        Prevent accidental overlap.
    */

    const nearby =
        atoms.find(
            atom =>
                Math.hypot(
                    atom.x - x,
                    atom.y - y
                ) < 30
        );

    if (nearby) {
        return null;
    }

    saveHistory();

    const atom = {
        id: nextAtomId++,
        x,
        y,
        element: "?",
        pending: true
    };

    atoms.push(atom);

    pendingAtom = atom;

    render();

    return atom;
}


/* ============================================================
   FINALIZE PENDING ATOM
   ============================================================ */

function finalizePendingAtom(
    atom,
    element
) {

    if (!atom) return;

    if (!element) {

        /*
            If recognition failed,
            remove the temporary node.
        */

        atoms =
            atoms.filter(
                item =>
                    item.id !== atom.id
            );

        if (history.length) {
            history.pop();
        }

        pendingAtom = null;

        render();

        return;
    }


    /*
        Set actual element.
    */

    atom.element = element;
    atom.pending = false;

    pendingAtom = null;

    render();
}


/* ============================================================
   FINALIZE PEN STROKE
   ============================================================ */

function finalizeCreateStroke() {

    if (!currentStroke.length) {
        return;
    }

    const points =
        currentStroke.slice();

    currentStroke = [];


    /*
        Remove rough visual.
    */

    strokeLayer.innerHTML = "";


    /*
        1. Check whether stroke
           is a circle.
    */

    if (isCircle(points)) {

        const center =
            strokeBounds(points);

        if (center) {

            createPendingAtom(
                (center.minX + center.maxX) / 2,
                (center.minY + center.maxY) / 2
            );
        }

        return;
    }


    /*
        2. If a pending atom exists,
           the stroke is interpreted
           as element handwriting.
    */

    if (pendingAtom) {

        const element =
            recognizeElement(points);

        finalizePendingAtom(
            pendingAtom,
            element
        );

        return;
    }


    /*
        3. Otherwise see if the stroke
           connects two atoms.
    */

    const start =
        points[0];

    const end =
        points[points.length - 1];

    const atomA =
        findAtomAt(
            start.x,
            start.y
        );

    const atomB =
        findAtomAt(
            end.x,
            end.y
        );

    if (
        atomA &&
        atomB &&
        atomA.id !== atomB.id
    ) {

        connectAtoms(
            atomA,
            atomB
        );

        return;
    }


    /*
        Alternative:
        if the stroke passes close to
        two atoms, connect them.
    */

    const nearStart =
        nearestAtomToStroke(
            [start]
        );

    const nearEnd =
        nearestAtomToStroke(
            [end]
        );

    if (
        nearStart &&
        nearEnd &&
        nearStart.id !== nearEnd.id
    ) {

        connectAtoms(
            nearStart,
            nearEnd
        );
    }
}


/* ============================================================
   ROUGH STROKE DRAWING
   ============================================================ */

function drawLiveStroke() {

    strokeLayer.innerHTML = "";

    if (currentStroke.length < 2) {
        return;
    }

    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    let d =
        `M ${currentStroke[0].x} ${currentStroke[0].y}`;

    for (
        let i = 1;
        i < currentStroke.length;
        i++
    ) {

        d +=
            ` L ${currentStroke[i].x} ${currentStroke[i].y}`;
    }

    path.setAttribute(
        "d",
        d
    );

    path.setAttribute(
        "class",
        "rough-stroke"
    );

    strokeLayer.appendChild(path);
}


/* ============================================================
   POINTER DOWN
   ============================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        /*
            Prevent iPad browser gestures.
        */

        event.preventDefault();

        const point =
            getCanvasPoint(event);

        const interaction =
            getInteractionType(event);

        activePointer = {
            id: event.pointerId,
            type: interaction,
            pointerType: event.pointerType
        };


        /* ============================================
           ERASE
           ============================================ */

        if (
            manualMode === "erase"
        ) {

            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );

            if (atom) {

                removeAtom(atom);

                return;
            }

            const bond =
                findBondAt(
                    point.x,
                    point.y
                );

            if (bond) {

                removeBond(bond);

                return;
            }

            return;
        }


        /* ============================================
           FINGER -> MOVE
           ============================================ */

        if (
            interaction === "move"
        ) {

            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );

            if (!atom) {
                return;
            }

            const component =
                getConnectedComponent(
                    atom.id
                );

            moleculeDrag = {
                pointerId: event.pointerId,

                atomIds:
                    component.map(
                        item => item.id
                    ),

                startX: point.x,
                startY: point.y,

                originalPositions:
                    component.map(
                        item => ({
                            id: item.id,
                            x: item.x,
                            y: item.y
                        })
                    )
            };

            /*
                Capture pointer so the drag
                remains continuous.
            */

            canvas.setPointerCapture(
                event.pointerId
            );

            return;
        }


        /* ============================================
           PENCIL -> CREATE
           ============================================ */

        if (
            interaction === "create"
        ) {

            drawing = true;

            currentStroke = [
                point
            ];

            canvas.setPointerCapture(
                event.pointerId
            );

            drawLiveStroke();
        }
    },
    {
        passive: false
    }
);


/* ============================================================
   POINTER MOVE
   ============================================================ */

canvas.addEventListener(
    "pointermove",
    event => {

        if (
            !activePointer ||
            activePointer.id !== event.pointerId
        ) {
            return;
        }

        event.preventDefault();

        const point =
            getCanvasPoint(event);


        /* ============================================
           FINGER -> MOVE MOLECULE
           ============================================ */

        if (
            activePointer.type === "move" &&
            moleculeDrag
        ) {

            const dx =
                point.x -
                moleculeDrag.startX;

            const dy =
                point.y -
                moleculeDrag.startY;

            moleculeDrag.originalPositions
                .forEach(original => {

                    const atom =
                        getAtom(
                            original.id
                        );

                    if (!atom) return;

                    atom.x =
                        original.x + dx;

                    atom.y =
                        original.y + dy;
                });

            /*
                CRITICAL:

                Do NOT call render() here.

                Only update existing SVG
                elements.
            */

            updateMoleculeVisuals(
                moleculeDrag.atomIds
            );

            return;
        }


        /* ============================================
           PENCIL -> DRAW
           ============================================ */

        if (
            activePointer.type === "create" &&
            drawing
        ) {

            currentStroke.push(point);

            drawLiveStroke();
        }
    },
    {
        passive: false
    }
);


/* ============================================================
   POINTER UP
   ============================================================ */

function finishPointer(event) {

    if (
        !activePointer ||
        activePointer.id !== event.pointerId
    ) {
        return;
    }

    event.preventDefault();


    /* ============================================
       FINGER
       ============================================ */

    if (
        activePointer.type === "move"
    ) {

        if (moleculeDrag) {

            /*
                The movement has already been
                applied directly to the SVG.
            */

            moleculeDrag = null;
        }
    }


    /* ============================================
       PENCIL
       ============================================ */

    if (
        activePointer.type === "create"
    ) {

        if (drawing) {

            drawing = false;

            finalizeCreateStroke();
        }
    }


    if (
        canvas.hasPointerCapture(
            event.pointerId
        )
    ) {

        canvas.releasePointerCapture(
            event.pointerId
        );
    }

    activePointer = null;
}


canvas.addEventListener(
    "pointerup",
    finishPointer,
    {
        passive: false
    }
);


canvas.addEventListener(
    "pointercancel",
    finishPointer,
    {
        passive: false
    }
);


/* ============================================================
   INITIAL RENDER
   ============================================================ */

render();


/* ============================================================
   INITIAL STATUS
   ============================================================ */

status.textContent =
    "Pencil creates · Finger moves";
</script>

</body>
</html>
