<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>BONDraw 0.7.2</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f7f8fc;
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            sans-serif;
        color: #1d2433;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
        height: 72px;
        flex: 0 0 72px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 24px;

        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid #e8eaf0;

        position: relative;
        z-index: 20;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .brand-mark {
        width: 34px;
        height: 34px;

        border-radius: 11px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #252b3a;
        color: white;

        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.04em;
    }

    .brand-text {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.04em;
    }

    .brand-text span {
        color: #7d8494;
        font-weight: 600;
    }

    .status {
        font-size: 13px;
        color: #8b91a0;
        font-weight: 600;
    }

    /* =========================
       WORKSPACE
    ========================= */

    #workspace {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;

        background:
            radial-gradient(
                circle at 50% 50%,
                rgba(226, 231, 242, 0.55) 0,
                rgba(247, 248, 252, 0) 48%
            );
    }

    #canvas {
        width: 100%;
        height: 100%;

        display: block;

        touch-action: none;
        user-select: none;
        -webkit-user-select: none;

        cursor: crosshair;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    #emptyState {
        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        pointer-events: none;

        text-align: center;

        transition: opacity 0.2s ease;
    }

    #emptyState.hidden {
        opacity: 0;
    }

    .empty-title {
        font-size: 21px;
        font-weight: 750;
        letter-spacing: -0.025em;

        color: #6e7585;
    }

    .empty-subtitle {
        margin-top: 7px;

        font-size: 14px;
        font-weight: 550;

        color: #a0a6b3;
    }

    /* =========================
       FLOATING TOOLBAR
    ========================= */

    #toolbar {
        position: absolute;

        left: 50%;
        bottom: 18px;

        transform: translateX(-50%);

        display: flex;
        align-items: center;
        gap: 7px;

        padding: 7px;

        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #e3e6ed;
        border-radius: 18px;

        box-shadow:
            0 12px 30px rgba(32, 39, 55, 0.08),
            0 2px 8px rgba(32, 39, 55, 0.04);

        z-index: 10;
    }

    .tool-button {
        width: 42px;
        height: 42px;

        border: 0;
        border-radius: 13px;

        background: transparent;

        color: #6f7686;

        font-size: 17px;
        font-weight: 700;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
            background 0.15s ease,
            color 0.15s ease,
            transform 0.1s ease;
    }

    .tool-button:active {
        transform: scale(0.94);
    }

    .tool-button.active {
        background: #252b3a;
        color: white;
    }

    .toolbar-divider {
        width: 1px;
        height: 26px;

        background: #e5e7ec;

        margin: 0 2px;
    }

    /* =========================
       MOLECULE MENU
    ========================= */

    #moleculeMenu {
        position: absolute;

        display: none;

        min-width: 210px;

        padding: 8px;

        background: rgba(255, 255, 255, 0.97);

        border: 1px solid #e1e4eb;
        border-radius: 17px;

        box-shadow:
            0 18px 45px rgba(28, 34, 48, 0.14),
            0 4px 12px rgba(28, 34, 48, 0.06);

        z-index: 30;

        transform-origin: center;
    }

    #moleculeMenu.visible {
        display: block;
        animation: menuAppear 0.13s ease-out;
    }

    @keyframes menuAppear {
        from {
            opacity: 0;
            transform: scale(0.94) translateY(3px);
        }

        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    .menu-button {
        width: 100%;

        min-height: 44px;

        border: 0;
        border-radius: 11px;

        background: transparent;

        display: flex;
        align-items: center;

        padding: 0 12px;

        color: #2b3140;

        font-size: 14px;
        font-weight: 650;

        text-align: left;

        cursor: pointer;
    }

    .menu-button:hover {
        background: #f2f4f8;
    }

    .menu-button:active {
        background: #e9ecf2;
    }

    .menu-button.danger {
        color: #9b6470;
    }

    .menu-divider {
        height: 1px;
        background: #eceef3;
        margin: 6px 3px;
    }

    /* =========================
       CHEMISTRY
    ========================= */

    .atom {
        pointer-events: all;
    }

    .atom-circle {
        fill: #ffffff;
        stroke: #252b3a;
        stroke-width: 2.3;
    }

    .atom.pending .atom-circle {
        stroke: #9ca3b3;
        stroke-dasharray: 5 4;
    }

    .atom.selected .atom-circle {
        fill: #eef1f7;
        stroke: #252b3a;
        stroke-width: 3;
    }

    .atom-label {
        fill: #252b3a;

        font-size: 18px;
        font-weight: 750;

        text-anchor: middle;
        dominant-baseline: central;

        pointer-events: none;

        user-select: none;
    }

    .bond {
        stroke: #252b3a;
        stroke-width: 3;
        stroke-linecap: round;
        pointer-events: none;
    }

    .live-stroke {
        fill: none;

        stroke: #8b93a3;
        stroke-width: 3;

        stroke-linecap: round;
        stroke-linejoin: round;

        opacity: 0.85;

        pointer-events: none;
    }

    .pending-question {
        fill: #8d94a3;

        font-size: 18px;
        font-weight: 700;

        text-anchor: middle;
        dominant-baseline: central;

        pointer-events: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
        header {
            height: 62px;
            flex-basis: 62px;
            padding: 0 16px;
        }

        .brand-text {
            font-size: 18px;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            font-size: 13px;
        }

        .status {
            font-size: 11px;
        }

        #toolbar {
            bottom: 12px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="brand">
        <div class="brand-mark">B</div>

        <div class="brand-text">
            BONDraw <span>0.7.2</span>
        </div>
    </div>

    <div class="status" id="status">
        Ready
    </div>
</header>

<main id="workspace">

    <svg
        id="canvas"
        xmlns="http://www.w3.org/2000/svg"
    ></svg>

    <div id="emptyState">
        <div class="empty-title">
            Start drawing
        </div>

        <div class="empty-subtitle">
            Use Apple Pencil to create atoms and bonds
        </div>
    </div>

    <div id="moleculeMenu">

        <button
            class="menu-button"
            id="copyMoleculeButton"
            type="button"
        >
            Copy molecule
        </button>

        <button
            class="menu-button"
            id="pasteMoleculeButton"
            type="button"
        >
            Paste molecule
        </button>

        <div class="menu-divider"></div>

        <button
            class="menu-button danger"
            id="closeMoleculeMenuButton"
            type="button"
        >
            Close
        </button>

    </div>

    <div id="toolbar">

        <button
            class="tool-button active"
            id="drawTool"
            type="button"
            aria-label="Draw"
        >
            ✎
        </button>

        <button
            class="tool-button"
            id="undoTool"
            type="button"
            aria-label="Undo"
        >
            ↶
        </button>

        <div class="toolbar-divider"></div>

        <button
            class="tool-button"
            id="clearTool"
            type="button"
            aria-label="Clear"
        >
            ⌫
        </button>

    </div>

</main>

<script>
/* ============================================================
   BONDraw 0.7.2
   ============================================================ */

/* =========================
   DOM
========================= */

const canvas = document.getElementById("canvas");
const workspace = document.getElementById("workspace");
const status = document.getElementById("status");
const emptyState = document.getElementById("emptyState");

const moleculeMenu = document.getElementById("moleculeMenu");

const copyMoleculeButton =
    document.getElementById("copyMoleculeButton");

const pasteMoleculeButton =
    document.getElementById("pasteMoleculeButton");

const closeMoleculeMenuButton =
    document.getElementById("closeMoleculeMenuButton");

const undoTool =
    document.getElementById("undoTool");

const clearTool =
    document.getElementById("clearTool");

/* =========================
   CHEMISTRY MODEL
========================= */

let atoms = [];
let bonds = [];

let nextAtomId = 1;
let nextBondId = 1;

/* =========================
   CLIPBOARD
========================= */

let moleculeClipboard = null;

let moleculeMenuAnchor = null;
let moleculeMenuAtom = null;

/* =========================
   INPUT PROTECTION
========================= */

const activePenPointers = new Set();
const activeTouchPointers = new Set();

let lastPasteTime = 0;

const PASTE_DEBOUNCE_MS = 350;

/* =========================
   POINTER STATE
========================= */

let activePointer = null;

let selectedAtom = null;
let selectedMolecule = new Set();

let dragStart = null;
let originalAtomPosition = null;

let moleculeOriginalPositions = new Map();

let movementStarted = false;

let longPressTimer = null;
let longPressTriggered = false;

let pencilMenuTriggered = false;

const LONG_PRESS_MS = 550;
const LONG_PRESS_MOVE_THRESHOLD = 12;

/* =========================
   STROKE STATE
========================= */

let currentStroke = [];

let liveStrokeElement = null;

let pendingAtom = null;

/* =========================
   HISTORY
========================= */

const history = [];

const MAX_HISTORY = 100;

/* ============================================================
   HELPERS
   ============================================================ */

function setStatus(text) {
    status.textContent = text;
}

function pushHistory() {
    history.push({
        atoms: JSON.parse(JSON.stringify(atoms)),
        bonds: JSON.parse(JSON.stringify(bonds)),
        nextAtomId,
        nextBondId
    });

    if (history.length > MAX_HISTORY) {
        history.shift();
    }
}

function undo() {
    if (history.length === 0) {
        setStatus("Nothing to undo");
        return;
    }

    const state = history.pop();

    atoms = state.atoms;
    bonds = state.bonds;

    nextAtomId = state.nextAtomId;
    nextBondId = state.nextBondId;

    selectedAtom = null;
    selectedMolecule = new Set();

    pendingAtom = null;

    render();

    setStatus("Undone");
}

function updateEmptyState() {
    emptyState.classList.toggle(
        "hidden",
        atoms.length > 0 || currentStroke.length > 0
    );
}

/* ============================================================
   SVG HELPERS
   ============================================================ */

function svgPoint(x, y) {
    return {
        x,
        y
    };
}

function getCanvasPoint(event) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}

function createSvgElement(name) {
    return document.createElementNS(
        "http://www.w3.org/2000/svg",
        name
    );
}

/* ============================================================
   RENDER
============================================================ */

function render() {
    canvas.innerHTML = "";

    renderBonds();
    renderAtoms();

    if (liveStrokeElement) {
        canvas.appendChild(liveStrokeElement);
    }

    updateEmptyState();
}

function renderBonds() {
    for (const bond of bonds) {
        const atomA = atoms.find(atom => atom.id === bond.a);
        const atomB = atoms.find(atom => atom.id === bond.b);

        if (!atomA || !atomB) continue;

        const dx = atomB.x - atomA.x;
        const dy = atomB.y - atomA.y;

        const length = Math.hypot(dx, dy);

        if (length === 0) continue;

        const nx = -dy / length;
        const ny = dx / length;

        const offset = 4.5;

        for (let i = 0; i < bond.order; i++) {

            let offsetAmount = 0;

            if (bond.order === 2) {
                offsetAmount =
                    i === 0
                        ? -offset
                        : offset;
            }

            if (bond.order === 3) {
                if (i === 0) {
                    offsetAmount = -offset;
                } else if (i === 1) {
                    offsetAmount = 0;
                } else {
                    offsetAmount = offset;
                }
            }

            const line = createSvgElement("line");

            line.classList.add("bond");

            line.setAttribute(
                "x1",
                atomA.x + nx * offsetAmount
            );

            line.setAttribute(
                "y1",
                atomA.y + ny * offsetAmount
            );

            line.setAttribute(
                "x2",
                atomB.x + nx * offsetAmount
            );

            line.setAttribute(
                "y2",
                atomB.y + ny * offsetAmount
            );

            canvas.appendChild(line);
        }
    }
}

function renderAtoms() {
    for (const atom of atoms) {

        const group = createSvgElement("g");

        group.classList.add("atom");

        if (atom === selectedAtom) {
            group.classList.add("selected");
        }

        if (atom.element === "?") {
            group.classList.add("pending");
        }

        group.setAttribute(
            "transform",
            `translate(${atom.x} ${atom.y})`
        );

        const circle = createSvgElement("circle");

        circle.classList.add("atom-circle");

        let radius = 27;

        if (atom.element === "H") {
            radius = 23;
        }

        circle.setAttribute("r", radius);

        group.appendChild(circle);

        const label = createSvgElement("text");

        if (atom.element === "?") {
            label.classList.add("pending-question");
            label.textContent = "?";
        } else {
            label.classList.add("atom-label");
            label.textContent = atom.element;
        }

        group.appendChild(label);

        canvas.appendChild(group);
    }
}

/* ============================================================
   ATOM / BOND HIT TESTS
============================================================ */

function findAtomAt(x, y) {
    let closest = null;
    let closestDistance = Infinity;

    for (const atom of atoms) {
        const dx = x - atom.x;
        const dy = y - atom.y;

        const distance = Math.hypot(dx, dy);

        const radius =
            atom.element === "H"
                ? 28
                : 32;

        if (
            distance <= radius &&
            distance < closestDistance
        ) {
            closest = atom;
            closestDistance = distance;
        }
    }

    return closest;
}

function distancePointToSegment(
    px,
    py,
    x1,
    y1,
    x2,
    y2
) {
    const dx = x2 - x1;
    const dy = y2 - y1;

    if (dx === 0 && dy === 0) {
        return Math.hypot(
            px - x1,
            py - y1
        );
    }

    const t = Math.max(
        0,
        Math.min(
            1,
            (
                (px - x1) * dx +
                (py - y1) * dy
            ) /
            (dx * dx + dy * dy)
        )
    );

    const cx = x1 + t * dx;
    const cy = y1 + t * dy;

    return Math.hypot(
        px - cx,
        py - cy
    );
}

function findBondAt(x, y) {
    let closest = null;
    let closestDistance = Infinity;

    for (const bond of bonds) {

        const a = atoms.find(
            atom => atom.id === bond.a
        );

        const b = atoms.find(
            atom => atom.id === bond.b
        );

        if (!a || !b) continue;

        const distance =
            distancePointToSegment(
                x,
                y,
                a.x,
                a.y,
                b.x,
                b.y
            );

        if (
            distance < 15 &&
            distance < closestDistance
        ) {
            closest = bond;
            closestDistance = distance;
        }
    }

    return closest;
}

/* ============================================================
   CHEMISTRY RULES
============================================================ */

function maxValence(element) {
    if (element === "H") return 1;
    if (element === "C") return 4;

    return 4;
}

function atomBondOrder(atomId) {
    return bonds
        .filter(
            bond =>
                bond.a === atomId ||
                bond.b === atomId
        )
        .reduce(
            (sum, bond) =>
                sum + bond.order,
            0
        );
}

function canAddBond(
    atomA,
    atomB,
    order
) {
    if (!atomA || !atomB) return false;
    if (atomA.id === atomB.id) return false;

    const existing = bonds.find(
        bond =>
            (
                bond.a === atomA.id &&
                bond.b === atomB.id
            ) ||
            (
                bond.a === atomB.id &&
                bond.b === atomA.id
            )
    );

    const currentOrder =
        existing
            ? existing.order
            : 0;

    const newOrder =
        currentOrder + order;

    if (
        atomBondOrder(atomA.id) +
        order >
        maxValence(atomA.element)
    ) {
        return false;
    }

    if (
        atomBondOrder(atomB.id) +
        order >
        maxValence(atomB.element)
    ) {
        return false;
    }

    if (newOrder > 3) {
        return false;
    }

    return true;
}

function addOrIncreaseBond(
    atomA,
    atomB
) {
    if (!atomA || !atomB) return false;

    const existing = bonds.find(
        bond =>
            (
                bond.a === atomA.id &&
                bond.b === atomB.id
            ) ||
            (
                bond.a === atomB.id &&
                bond.b === atomA.id
            )
    );

    if (existing) {

        if (
            existing.order >= 3
        ) {
            setStatus("Maximum bond order");
            return false;
        }

        if (
            !canAddBond(
                atomA,
                atomB,
                1
            )
        ) {
            setStatus("Valence limit");
            return false;
        }

        existing.order += 1;

        return true;
    }

    if (
        !canAddBond(
            atomA,
            atomB,
            1
        )
    ) {
        setStatus("Valence limit");
        return false;
    }

    bonds.push({
        id: nextBondId++,
        a: atomA.id,
        b: atomB.id,
        order: 1
    });

    return true;
}

/* ============================================================
   STROKE ANALYSIS
============================================================ */

function pathLength(points) {
    let length = 0;

    for (let i = 1; i < points.length; i++) {
        length += Math.hypot(
            points[i].x - points[i - 1].x,
            points[i].y - points[i - 1].y
        );
    }

    return length;
}

function boundingBox(points) {
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;

    for (const p of points) {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);

        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
    }

    return {
        minX,
        minY,
        maxX,
        maxY,
        width: maxX - minX,
        height: maxY - minY
    };
}

function recognizeCircle(points) {
    if (points.length < 8) {
        return null;
    }

    const box = boundingBox(points);

    const width = box.width;
    const height = box.height;

    if (
        width < 25 ||
        height < 25
    ) {
        return null;
    }

    const ratio =
        Math.min(width, height) /
        Math.max(width, height);

    if (ratio < 0.62) {
        return null;
    }

    const centerX =
        (box.minX + box.maxX) / 2;

    const centerY =
        (box.minY + box.maxY) / 2;

    const averageRadius =
        (width + height) / 4;

    if (
        averageRadius < 12 ||
        averageRadius > 65
    ) {
        return null;
    }

    let radialError = 0;

    for (const p of points) {
        const radius = Math.hypot(
            p.x - centerX,
            p.y - centerY
        );

        radialError += Math.abs(
            radius - averageRadius
        );
    }

    radialError /=
        points.length;

    if (
        radialError >
        averageRadius * 0.28
    ) {
        return null;
    }

    const start = points[0];
    const end = points[points.length - 1];

    const closure =
        Math.hypot(
            end.x - start.x,
            end.y - start.y
        );

    if (
        closure >
        averageRadius * 0.85
    ) {
        return null;
    }

    return {
        x: centerX,
        y: centerY,
        radius: averageRadius
    };
}

/* ============================================================
   ELEMENT RECOGNITION
============================================================ */

function recognizeHScore(points) {
    if (points.length < 4) {
        return 0;
    }

    const box = boundingBox(points);

    const width = box.width;
    const height = box.height;

    const horizontal =
        width > height * 1.8 &&
        height < 30;

    const vertical =
        height > width * 1.8 &&
        width < 30;

    const simpleStroke =
        pathLength(points) <
        240;

    if (
        (horizontal || vertical) &&
        simpleStroke
    ) {
        return 0.92;
    }

    return 0;
}

function recognizeCScore(points) {
    const circle =
        recognizeCircle(points);

    if (!circle) {
        return 0;
    }

    return 0.96;
}

function recognizeElement(points) {
    const hScore =
        recognizeHScore(points);

    const cScore =
        recognizeCScore(points);

    if (
        hScore < 0.35 &&
        cScore < 0.35
    ) {
        return null;
    }

    if (
        cScore > hScore
    ) {
        return "C";
    }

    return "H";
}

/* ============================================================
   PENDING ATOM
============================================================ */

function createPendingAtom(x, y) {
    pushHistory();

    const atom = {
        id: nextAtomId++,
        x,
        y,
        element: "?"
    };

    atoms.push(atom);

    pendingAtom = atom;

    selectedAtom = atom;

    render();

    setStatus("Write C or H");
}

function finalizePendingAtom(element) {
    if (!pendingAtom) return;

    const atom = pendingAtom;

    if (
        atom.element !== "?"
    ) {
        pendingAtom = null;
        return;
    }

    atom.element = element;

    pendingAtom = null;

    selectedAtom = atom;

    render();

    setStatus(element);
}

/* ============================================================
   LIVE STROKE
============================================================ */

function createLiveStroke() {
    const path = createSvgElement("path");

    path.classList.add("live-stroke");

    return path;
}

function pointsToPath(points) {
    if (points.length === 0) {
        return "";
    }

    let d =
        `M ${points[0].x} ${points[0].y}`;

    for (
        let i = 1;
        i < points.length;
        i++
    ) {
        d +=
            ` L ${points[i].x} ${points[i].y}`;
    }

    return d;
}

function drawLiveStroke() {
    if (!liveStrokeElement) {
        liveStrokeElement =
            createLiveStroke();

        canvas.appendChild(
            liveStrokeElement
        );
    }

    liveStrokeElement.setAttribute(
        "d",
        pointsToPath(currentStroke)
    );

    updateEmptyState();
}

/* ============================================================
   FINALIZE CREATION
============================================================ */

function finalizeCreateStroke() {
    if (
        currentStroke.length < 2
    ) {
        currentStroke = [];

        if (liveStrokeElement) {
            liveStrokeElement.remove();
            liveStrokeElement = null;
        }

        render();

        return;
    }

    const points = currentStroke;

    const element =
        recognizeElement(points);

    if (
        element &&
        recognizeCircle(points)
    ) {
        const circle =
            recognizeCircle(points);

        if (pendingAtom) {
            finalizePendingAtom(element);
        } else {
            createPendingAtom(
                circle.x,
                circle.y
            );

            if (element !== "?") {
                finalizePendingAtom(
                    element
                );
            }
        }
    } else if (
        pendingAtom &&
        element
    ) {
        finalizePendingAtom(
            element
        );
    } else {
        createBondFromStroke(
            points
        );
    }

    currentStroke = [];

    if (liveStrokeElement) {
        liveStrokeElement.remove();
        liveStrokeElement = null;
    }

    render();
}

/* ============================================================
   BOND CREATION FROM STROKE
============================================================ */

function createBondFromStroke(points) {
    if (points.length < 2) return;

    const first = points[0];
    const last =
        points[points.length - 1];

    const startAtom =
        findAtomAt(
            first.x,
            first.y
        );

    const endAtom =
        findAtomAt(
            last.x,
            last.y
        );

    if (
        startAtom &&
        endAtom &&
        startAtom.id !== endAtom.id
    ) {
        pushHistory();

        addOrIncreaseBond(
            startAtom,
            endAtom
        );

        selectedAtom = endAtom;

        setStatus("Bond");
        return;
    }

    /*
       If the stroke begins and ends
       close to atoms but the endpoints
       are slightly outside them,
       search with a larger tolerance.
    */

    let nearestStart = null;
    let nearestEnd = null;

    let startDistance = Infinity;
    let endDistance = Infinity;

    for (const atom of atoms) {

        const ds =
            Math.hypot(
                atom.x - first.x,
                atom.y - first.y
            );

        const de =
            Math.hypot(
                atom.x - last.x,
                atom.y - last.y
            );

        if (
            ds < 60 &&
            ds < startDistance
        ) {
            nearestStart = atom;
            startDistance = ds;
        }

        if (
            de < 60 &&
            de < endDistance
        ) {
            nearestEnd = atom;
            endDistance = de;
        }
    }

    if (
        nearestStart &&
        nearestEnd &&
        nearestStart.id !==
            nearestEnd.id
    ) {
        pushHistory();

        addOrIncreaseBond(
            nearestStart,
            nearestEnd
        );

        selectedAtom = nearestEnd;

        setStatus("Bond");
    }
}

/* ============================================================
   MOLECULE GRAPH
============================================================ */

function getConnectedMolecule(startAtom) {
    const visited = new Set();

    if (!startAtom) {
        return visited;
    }

    const queue = [startAtom.id];

    visited.add(
        startAtom.id
    );

    while (queue.length > 0) {

        const currentId =
            queue.shift();

        for (const bond of bonds) {

            let neighbor = null;

            if (
                bond.a === currentId
            ) {
                neighbor = bond.b;
            }

            if (
                bond.b === currentId
            ) {
                neighbor = bond.a;
            }

            if (
                neighbor !== null &&
                !visited.has(neighbor)
            ) {
                visited.add(neighbor);
                queue.push(neighbor);
            }
        }
    }

    return visited;
}

/* ============================================================
   MOLECULE DRAG
============================================================ */

function prepareMoleculeDrag() {
    selectedMolecule =
        getConnectedMolecule(
            selectedAtom
        );

    moleculeOriginalPositions =
        new Map();

    for (
        const atomId of selectedMolecule
    ) {
        const atom =
            atoms.find(
                item => item.id === atomId
            );

        if (!atom) continue;

        moleculeOriginalPositions.set(
            atomId,
            {
                x: atom.x,
                y: atom.y
            }
        );
    }
}

function moveSingleAtom(point) {
    if (
        !selectedAtom ||
        !originalAtomPosition
    ) {
        return;
    }

    selectedAtom.x =
        point.x;

    selectedAtom.y =
        point.y;

    render();
}

function moveWholeMolecule(point) {
    if (
        !dragStart ||
        selectedMolecule.size === 0
    ) {
        return;
    }

    const dx =
        point.x -
        dragStart.x;

    const dy =
        point.y -
        dragStart.y;

    for (
        const atomId of selectedMolecule
    ) {
        const atom =
            atoms.find(
                item => item.id === atomId
            );

        const original =
            moleculeOriginalPositions.get(
                atomId
            );

        if (
            !atom ||
            !original
        ) {
            continue;
        }

        atom.x =
            original.x + dx;

        atom.y =
            original.y + dy;
    }

    render();
}

/* ============================================================
   CLIPBOARD
============================================================ */

function hasMoleculeClipboard() {
    return (
        moleculeClipboard !== null &&
        moleculeClipboard.atoms &&
        moleculeClipboard.atoms.length > 0
    );
}

function copyMolecule(startAtom) {
    if (!startAtom) {
        setStatus("Nothing to copy");
        return;
    }

    const moleculeIds =
        getConnectedMolecule(
            startAtom
        );

    const moleculeAtoms =
        atoms.filter(
            atom =>
                moleculeIds.has(
                    atom.id
                )
        );

    const moleculeBonds =
        bonds.filter(
            bond =>
                moleculeIds.has(
                    bond.a
                ) &&
                moleculeIds.has(
                    bond.b
                )
        );

    if (
        moleculeAtoms.length === 0
    ) {
        setStatus("Nothing to copy");
        return;
    }

    let centerX = 0;
    let centerY = 0;

    for (
        const atom of moleculeAtoms
    ) {
        centerX += atom.x;
        centerY += atom.y;
    }

    centerX /=
        moleculeAtoms.length;

    centerY /=
        moleculeAtoms.length;

    moleculeClipboard = {
        atoms:
            moleculeAtoms.map(
                atom => ({
                    sourceId: atom.id,
                    x: atom.x - centerX,
                    y: atom.y - centerY,
                    element: atom.element
                })
            ),

        bonds:
            moleculeBonds.map(
                bond => ({
                    a: bond.a,
                    b: bond.b,
                    order: bond.order
                })
            )
    };

    setStatus("Molecule copied");
}

function canPasteNow() {
    const now =
        performance.now();

    if (
        now - lastPasteTime <
        PASTE_DEBOUNCE_MS
    ) {
        return false;
    }

    lastPasteTime = now;

    return true;
}

function pasteMolecule(
    centerX,
    centerY
) {
    if (
        !hasMoleculeClipboard()
    ) {
        setStatus("Nothing to paste");
        return;
    }

    pushHistory();

    const idMap = new Map();

    for (
        const sourceAtom
        of moleculeClipboard.atoms
    ) {
        const newAtom = {
            id: nextAtomId++,
            x:
                centerX +
                sourceAtom.x,
            y:
                centerY +
                sourceAtom.y,
            element:
                sourceAtom.element
        };

        atoms.push(newAtom);

        idMap.set(
            sourceAtom.sourceId,
            newAtom.id
        );
    }

    for (
        const sourceBond
        of moleculeClipboard.bonds
    ) {
        const newA =
            idMap.get(
                sourceBond.a
            );

        const newB =
            idMap.get(
                sourceBond.b
            );

        if (
            newA === undefined ||
            newB === undefined
        ) {
            continue;
        }

        bonds.push({
            id: nextBondId++,
            a: newA,
            b: newB,
            order:
                sourceBond.order
        });
    }

    selectedAtom = null;
    selectedMolecule = new Set();

    render();

    setStatus("Molecule pasted");
}

/* ============================================================
   MOLECULE MENU
============================================================ */

function positionMoleculeMenu(
    x,
    y
) {
    const menuWidth = 210;
    const menuHeight = 150;

    const workspaceRect =
        workspace.getBoundingClientRect();

    let left = x;
    let top = y;

    if (
        left + menuWidth >
        workspaceRect.width - 10
    ) {
        left =
            workspaceRect.width -
            menuWidth -
            10;
    }

    if (
        top + menuHeight >
        workspaceRect.height - 10
    ) {
        top =
            workspaceRect.height -
            menuHeight -
            10;
    }

    left =
        Math.max(
            10,
            left
        );

    top =
        Math.max(
            10,
            top
        );

    moleculeMenu.style.left =
        `${left}px`;

    moleculeMenu.style.top =
        `${top}px`;
}

function openMoleculeMenu(
    point,
    atom
) {
    moleculeMenuAnchor = {
        x: point.x,
        y: point.y
    };

    moleculeMenuAtom =
        atom || null;

    selectedAtom =
        atom || null;

    selectedMolecule =
        atom
            ? getConnectedMolecule(atom)
            : new Set();

    positionMoleculeMenu(
        point.x,
        point.y
    );

    moleculeMenu.classList.add(
        "visible"
    );

    render();
}

function closeMoleculeMenu() {
    moleculeMenu.classList.remove(
        "visible"
    );

    moleculeMenuAnchor = null;
    moleculeMenuAtom = null;

    selectedAtom = null;
    selectedMolecule = new Set();

    render();
}

/* ============================================================
   MENU ACTIONS
============================================================ */

copyMoleculeButton.addEventListener(
    "click",
    event => {
        event.stopPropagation();

        if (
            moleculeMenuAtom
        ) {
            copyMolecule(
                moleculeMenuAtom
            );
        } else {
            setStatus(
                "Select a molecule to copy"
            );
        }

        closeMoleculeMenu();
    }
);

pasteMoleculeButton.addEventListener(
    "click",
    event => {
        event.stopPropagation();

        if (
            !hasMoleculeClipboard()
        ) {
            setStatus("Nothing to paste");
            return;
        }

        if (
            !moleculeMenuAnchor
        ) {
            closeMoleculeMenu();
            return;
        }

        if (!canPasteNow()) {
            return;
        }

        const pasteX =
            moleculeMenuAnchor.x +
            80;

        const pasteY =
            moleculeMenuAnchor.y +
            80;

        pasteMolecule(
            pasteX,
            pasteY
        );

        closeMoleculeMenu();
    }
);

closeMoleculeMenuButton.addEventListener(
    "click",
    event => {
        event.stopPropagation();

        closeMoleculeMenu();
    }
);

/* ============================================================
   OUTSIDE MENU
============================================================ */

workspace.addEventListener(
    "pointerdown",
    event => {
        if (
            !moleculeMenu.classList.contains(
                "visible"
            )
        ) {
            return;
        }

        if (
            moleculeMenu.contains(
                event.target
            )
        ) {
            return;
        }

        /*
           Don't immediately close the menu
           if this is the active interaction
           that opened it.
        */
        closeMoleculeMenu();
    }
);

/* ============================================================
   POINTER REGISTRATION
============================================================ */

function registerPointer(event) {
    if (
        event.pointerType === "pen"
    ) {
        activePenPointers.add(
            event.pointerId
        );

        return;
    }

    if (
        event.pointerType === "touch"
    ) {
        activeTouchPointers.add(
            event.pointerId
        );
    }
}

function unregisterPointer(event) {
    if (
        event.pointerType === "pen"
    ) {
        activePenPointers.delete(
            event.pointerId
        );

        return;
    }

    if (
        event.pointerType === "touch"
    ) {
        activeTouchPointers.delete(
            event.pointerId
        );
    }
}

function shouldIgnoreTouch(event) {
    if (
        event.pointerType !== "touch"
    ) {
        return false;
    }

    /*
       If Apple Pencil is active,
       ignore touch contacts.
    */
    if (
        activePenPointers.size > 0
    ) {
        return true;
    }

    /*
       Only allow one touch pointer.
       This prevents accidental double
       touch / double paste.
    */
    if (
        activeTouchPointers.size > 1
    ) {
        return true;
    }

    return false;
}

/* ============================================================
   INTERACTION TYPE
============================================================ */

function getInteractionType(event) {
    if (
        event.pointerType === "pen"
    ) {
        return "create";
    }

    return "move";
}

/* ============================================================
   LONG PRESS
============================================================ */

function cancelLongPress() {
    if (longPressTimer) {
        clearTimeout(
            longPressTimer
        );

        longPressTimer = null;
    }
}

function startFingerLongPress() {
    cancelLongPress();

    longPressTriggered = false;

    longPressTimer =
        setTimeout(
            () => {

                longPressTimer =
                    null;

                if (
                    !activePointer ||
                    activePointer.type !==
                        "move"
                ) {
                    return;
                }

                if (
                    !selectedAtom
                ) {
                    return;
                }

                longPressTriggered = true;

                selectedMolecule =
                    getConnectedMolecule(
                        selectedAtom
                    );

                setStatus(
                    "Molecule selected"
                );

                render();
            },
            LONG_PRESS_MS
        );
}

function startPencilMenuLongPress(
    point,
    atom
) {
    cancelLongPress();

    pencilMenuTriggered = false;

    longPressTimer =
        setTimeout(
            () => {

                longPressTimer =
                    null;

                if (
                    !activePointer ||
                    activePointer.type !==
                        "create"
                ) {
                    return;
                }

                if (
                    currentStroke.length >
                    0
                ) {
                    return;
                }

                pencilMenuTriggered =
                    true;

                openMoleculeMenu(
                    point,
                    atom
                );

                setStatus(
                    "Molecule menu"
                );
            },
            LONG_PRESS_MS
        );
}

/* ============================================================
   POINTER DOWN
============================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        registerPointer(event);

        if (
            shouldIgnoreTouch(event)
        ) {
            return;
        }

        event.preventDefault();

        if (
            activePointer &&
            activePointer.id !==
                event.pointerId
        ) {
            return;
        }

        const point =
            getCanvasPoint(event);

        const interaction =
            getInteractionType(event);

        activePointer = {
            id: event.pointerId,
            type: interaction,
            pointerType:
                event.pointerType
        };

        movementStarted = false;
        longPressTriggered = false;
        pencilMenuTriggered = false;

        dragStart = {
            x: point.x,
            y: point.y
        };

        currentStroke = [];

        if (
            interaction === "move"
        ) {
            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );

            if (!atom) {

                if (
                    hasMoleculeClipboard() &&
                    canPasteNow()
                ) {
                    pasteMolecule(
                        point.x,
                        point.y
                    );
                }

                activePointer = null;

                unregisterPointer(event);

                return;
            }

            selectedAtom = atom;

            dragStart = {
                x: point.x,
                y: point.y
            };

            originalAtomPosition = {
                x: atom.x,
                y: atom.y
            };

            prepareMoleculeDrag();

            startFingerLongPress();

            render();

            return;
        }

        /* =========================
           PENCIL
        ========================= */

        if (
            interaction === "create"
        ) {
            const atom =
                findAtomAt(
                    point.x,
                    point.y
                );

            if (atom) {
                selectedAtom = atom;
            }

            dragStart = {
                x: point.x,
                y: point.y
            };

            startPencilMenuLongPress(
                point,
                atom
            );

            return;
        }
    },
    {
        passive: false
    }
);

/* ============================================================
   POINTER MOVE
============================================================ */

canvas.addEventListener(
    "pointermove",
    event => {

        if (
            !activePointer ||
            activePointer.id !==
                event.pointerId
        ) {
            return;
        }

        if (
            event.pointerType === "touch" &&
            shouldIgnoreTouch(event)
        ) {
            return;
        }

        event.preventDefault();

        const point =
            getCanvasPoint(event);

        /* =========================
           FINGER
        ========================= */

        if (
            activePointer.type ===
            "move"
        ) {
            if (!dragStart) {
                return;
            }

            const dx =
                point.x -
                dragStart.x;

            const dy =
                point.y -
                dragStart.y;

            const distance =
                Math.hypot(
                    dx,
                    dy
                );

            if (
                distance >
                LONG_PRESS_MOVE_THRESHOLD
            ) {
                cancelLongPress();

                movementStarted =
                    true;
            }

            if (
                !movementStarted
            ) {
                return;
            }

            if (
                longPressTriggered
            ) {
                moveWholeMolecule(
                    point
                );
            } else {
                moveSingleAtom(
                    point
                );
            }

            return;
        }

        /* =========================
           PENCIL
        ========================= */

        if (
            activePointer.type ===
            "create"
        ) {

            /*
               If the Pencil has moved enough,
               this is now a real drawing stroke.
               The molecule clipboard is cleared
               HERE — not on pointerdown.

               This means:
               - long press menu keeps clipboard
               - actual drawing clears clipboard
            */
            if (
                !pencilMenuTriggered &&
                currentStroke.length === 0 &&
                dragStart
            ) {
                const dx =
                    point.x -
                    dragStart.x;

                const dy =
                    point.y -
                    dragStart.y;

                const movementDistance =
                    Math.hypot(
                        dx,
                        dy
                    );

                if (
                    movementDistance >
                    LONG_PRESS_MOVE_THRESHOLD
                ) {
                    cancelLongPress();

                    /*
                       NEW IN 0.7.2
                       =========================
                       Starting a real Pencil
                       drawing operation clears
                       the old copied molecule.
                    */
                    moleculeClipboard = null;

                    const startPoint = {
                        x: dragStart.x,
                        y: dragStart.y
                    };

                    selectedAtom = null;

                    currentStroke = [
                        startPoint,
                        point
                    ];

                    dragStart = null;

                    movementStarted =
                        true;

                    drawLiveStroke();
                }

                return;
            }

            if (
                pencilMenuTriggered
            ) {
                return;
            }

            if (
                currentStroke.length === 0
            ) {
                return;
            }

            currentStroke.push(point);

            drawLiveStroke();

            return;
        }
    },
    {
        passive: false
    }
);

/* ============================================================
   POINTER UP / CANCEL
============================================================ */

function resetPointerState() {
    cancelLongPress();

    activePointer = null;

    dragStart = null;

    originalAtomPosition = null;

    moleculeOriginalPositions =
        new Map();

    selectedMolecule =
        new Set();

    currentStroke = [];

    movementStarted = false;

    longPressTriggered = false;
    pencilMenuTriggered = false;

    if (liveStrokeElement) {
        liveStrokeElement.remove();

        liveStrokeElement = null;
    }

    render();
}

function finishPointer(event) {

    if (
        !activePointer ||
        activePointer.id !==
            event.pointerId
    ) {
        unregisterPointer(event);
        return;
    }

    event.preventDefault();

    if (
        activePointer.type ===
        "create"
    ) {
        if (
            pencilMenuTriggered
        ) {
            resetPointerState();

            unregisterPointer(event);

            return;
        }

        if (
            currentStroke.length > 0
        ) {
            finalizeCreateStroke();
        }
    }

    resetPointerState();

    unregisterPointer(event);
}

canvas.addEventListener(
    "pointerup",
    finishPointer,
    {
        passive: false
    }
);

canvas.addEventListener(
    "pointercancel",
    finishPointer,
    {
        passive: false
    }
);

canvas.addEventListener(
    "pointerleave",
    event => {

        /*
           Don't cancel the interaction
           just because the Pencil/finger
           briefly leaves the SVG.
        */
    }
);

/* ============================================================
   TOUCH FALLBACK
============================================================ */

canvas.addEventListener(
    "touchstart",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchmove",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchend",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchcancel",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

/* ============================================================
   GLOBAL POINTER CLEANUP
============================================================ */

window.addEventListener(
    "pointerup",
    event => {
        unregisterPointer(event);
    }
);

window.addEventListener(
    "pointercancel",
    event => {
        unregisterPointer(event);
    }
);

/* ============================================================
   TOOLBAR
============================================================ */

undoTool.addEventListener(
    "click",
    () => {
        undo();
    }
);

clearTool.addEventListener(
    "click",
    () => {

        if (
            atoms.length === 0 &&
            bonds.length === 0
        ) {
            setStatus("Already empty");
            return;
        }

        pushHistory();

        atoms = [];
        bonds = [];

        selectedAtom = null;
        selectedMolecule =
            new Set();

        pendingAtom = null;

        moleculeClipboard = null;

        render();

        setStatus("Canvas cleared");
    }
);

/* ============================================================
   ESCAPE
============================================================ */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {
            closeMoleculeMenu();
        }

        if (
            event.key === "z" &&
            (event.metaKey ||
                event.ctrlKey)
        ) {
            event.preventDefault();
            undo();
        }
    }
);

/* ============================================================
   INITIAL RENDER
============================================================ */

render();

setStatus("Ready");
</script>

</body>
</html>
