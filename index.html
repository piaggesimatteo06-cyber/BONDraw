
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>BONDraw 0.7.3</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#f4f5f7;color:#181a1f;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;
 touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none
}
body{display:flex;flex-direction:column}
header{
 height:72px;flex-shrink:0;display:flex;align-items:center;
 justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.88);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 border-bottom:1px solid rgba(0,0,0,.07);z-index:10
}
.brand{display:flex;align-items:center;gap:10px}
.logo-dot{width:13px;height:13px;border-radius:50%;background:#181a1f}
.brand-name{font-size:22px;font-weight:750;letter-spacing:-.8px}
.version{font-size:13px;color:#858992;font-weight:600}
.status{font-size:13px;color:#858992;font-weight:500}
#workspace{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#canvas{
 position:absolute;inset:0;width:100%;height:100%;display:block;
 background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.9),rgba(244,245,247,.95));
 touch-action:none
}
#emptyState{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 text-align:center;pointer-events:none;transition:opacity .2s
}
#emptyState.hidden{opacity:0}
.empty-title{font-size:24px;font-weight:700;letter-spacing:-.6px;margin-bottom:7px}
.empty-subtitle{font-size:15px;color:#858992;line-height:1.45}
#toolbar{
 position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
 display:flex;align-items:center;gap:6px;padding:7px;
 background:rgba(255,255,255,.9);backdrop-filter:blur(18px);
 -webkit-backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.08);
 border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.10);
 z-index:20;touch-action:manipulation
}
button{
 border:0;outline:0;height:40px;padding:0 15px;border-radius:12px;
 background:transparent;color:#686c74;font-family:inherit;
 font-size:14px;font-weight:650;cursor:pointer;touch-action:manipulation
}
button:active{transform:scale(.97)}
button.active{background:#181a1f;color:white}
button.danger{color:#b04444}
.divider{width:1px;height:25px;background:rgba(0,0,0,.09);margin:0 2px}
#moleculeMenu{
 position:absolute;display:none;min-width:180px;padding:7px;
 background:rgba(255,255,255,.94);backdrop-filter:blur(20px);
 -webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,.08);
 border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.16);
 z-index:40;touch-action:manipulation
}
#moleculeMenu.visible{display:block}
.menu-title{
 padding:8px 10px 6px;font-size:11px;color:#969aa2;
 font-weight:650;text-transform:uppercase;letter-spacing:.5px
}
.menu-button{
 width:100%;height:42px;display:flex;align-items:center;
 justify-content:flex-start;gap:9px;padding:0 11px;
 border-radius:11px;color:#25272d;font-size:14px;font-weight:650
}
.menu-button:active{background:rgba(0,0,0,.07)}
.menu-button.disabled{color:#b5b8bf;pointer-events:none}
.menu-icon{width:20px;text-align:center;font-size:16px}
.menu-divider{height:1px;background:rgba(0,0,0,.07);margin:5px 4px}
.bond{stroke:#202228;stroke-width:2.6;stroke-linecap:round;fill:none;pointer-events:none}
.atom-circle{fill:rgba(255,255,255,.96);stroke:#202228;stroke-width:2.4}
.atom-label{
 fill:#202228;font-size:17px;font-weight:700;text-anchor:middle;
 dominant-baseline:central;pointer-events:none
}
.atom.pending .atom-circle{
 fill:rgba(255,255,255,.72);stroke:#999da6;
 stroke-width:2;stroke-dasharray:5 5
}
.atom.pending .atom-label{fill:#999da6}
.rough-stroke{
 fill:none;stroke:#8e929b;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round;opacity:.8;pointer-events:none
}
#interactionHint{
 position:absolute;right:18px;bottom:25px;padding:8px 11px;
 border-radius:11px;background:rgba(255,255,255,.78);
 border:1px solid rgba(0,0,0,.06);color:#888c94;
 font-size:12px;font-weight:550;pointer-events:none
}
@media(max-width:650px){
 header{height:64px;padding:0 15px}
 .brand-name{font-size:20px}
 .status{display:none}
 #toolbar{bottom:14px}
 button{padding:0 12px}
 #interactionHint{display:none}
 #moleculeMenu{min-width:170px}
}
</style>
</head>

<body>
<header>
 <div class="brand">
  <div class="logo-dot"></div>
  <div class="brand-name">BONDraw</div>
  <div class="version">0.7.3</div>
 </div>
 <div class="status" id="status">Pencil creates · Finger moves</div>
</header>

<div id="workspace">
 <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
  <g id="bondLayer"></g>
  <g id="atomLayer"></g>
  <g id="strokeLayer"></g>
 </svg>

 <div id="emptyState">
  <div class="empty-title">Draw chemistry naturally.</div>
  <div class="empty-subtitle">
   Use Apple Pencil to create atoms and bonds.<br>
   Use your finger to move atoms.
  </div>
 </div>

 <div id="interactionHint">🖊️ Create &nbsp;·&nbsp; 👆 Move</div>

 <div id="moleculeMenu">
  <div class="menu-title">Molecule</div>
  <button type="button" class="menu-button" id="copyMoleculeBtn">
   <span class="menu-icon">📋</span><span>Copia molecola</span>
  </button>
  <button type="button" class="menu-button" id="pasteMoleculeBtn">
   <span class="menu-icon">📌</span><span>Incolla molecola</span>
  </button>
  <div class="menu-divider"></div>
  <button type="button" class="menu-button" id="closeMenuBtn">
   <span class="menu-icon">✕</span><span>Chiudi</span>
  </button>
 </div>

 <div id="toolbar">
  <button id="createBtn" class="active">Create</button>
  <button id="moveBtn">Move</button>
  <button id="eraseBtn">Erase</button>
  <div class="divider"></div>
  <button id="undoBtn">Undo</button>
  <button id="clearBtn" class="danger">Clear</button>
 </div>
</div>

<script>
/* ==========================================================
   BONDraw 0.7.3
   DISTACCO TERMINALE ALTAMENTE SELETTIVO

   - Nessuna soglia minima di distanza.
   - Velocità complessiva elevata.
   - Componente uscente elevata.
   - Direzione quasi allineata al legame.
========================================================== */

const $ = id => document.getElementById(id);
const canvas = $("canvas");
const atomLayer = $("atomLayer");
const bondLayer = $("bondLayer");
const strokeLayer = $("strokeLayer");
const emptyState = $("emptyState");
const status = $("status");
const moleculeMenu = $("moleculeMenu");

let atoms = [];
let bonds = [];
let nextAtomId = 1;
let nextBondId = 1;
let pendingAtom = null;

const ATOM_RADIUS = {C:27,H:23};
const VALENCE = {C:4,H:1};

/* SOGLIE DI DISTACCO */

const BOND_BREAK_SPEED = 1.45;
const BOND_BREAK_OUTWARD_SPEED = 1.30;
const BOND_BREAK_WINDOW_MS = 85;
const BOND_BREAK_MIN_ALIGNMENT = 0.90;

/*
 Tutte e tre le condizioni devono essere soddisfatte.

 1. Velocità totale >= 1.45 px/ms.
 2. Velocità uscente >= 1.30 px/ms.
 3. Allineamento >= 0.90.

 Nessun limite sulla distanza totale percorsa.
*/

let moleculeClipboard = null;
let moleculeMenuAnchor = null;
let moleculeMenuAtom = null;
let lastPasteTime = 0;

const activePenPointers = new Set();
const activeTouchPointers = new Set();

function registerPointer(e){
 if(e.pointerType==="pen")activePenPointers.add(e.pointerId);
 if(e.pointerType==="touch")activeTouchPointers.add(e.pointerId);
}
function unregisterPointer(e){
 if(e.pointerType==="pen")activePenPointers.delete(e.pointerId);
 if(e.pointerType==="touch")activeTouchPointers.delete(e.pointerId);
}
function shouldIgnoreTouch(e){
 return e.pointerType==="touch" &&
 (activePenPointers.size>0||activeTouchPointers.size>1);
}
function canPasteNow(){
 const now=performance.now();
 if(now-lastPasteTime<350)return false;
 lastPasteTime=now;
 return true;
}

/* HISTORY */

const history=[];

function saveHistory(){
 history.push({
  atoms:JSON.parse(JSON.stringify(atoms)),
  bonds:JSON.parse(JSON.stringify(bonds))
 });
 if(history.length>50)history.shift();
}

let manualMode="create";

function setManualMode(mode){
 manualMode=mode;
 $("createBtn").classList.toggle("active",mode==="create");
 $("moveBtn").classList.toggle("active",mode==="move");
 $("eraseBtn").classList.toggle("active",mode==="erase");
}

$("createBtn").onclick=()=>setManualMode("create");
$("moveBtn").onclick=()=>setManualMode("move");
$("eraseBtn").onclick=()=>setManualMode("erase");

$("undoBtn").onclick=()=>{
 closeMoleculeMenu();
 if(!history.length)return;
 const previous=history.pop();
 atoms=previous.atoms;
 bonds=previous.bonds;
 pendingAtom=atoms.find(a=>a.pending===true)||null;
 nextAtomId=Math.max(1,...atoms.map(a=>a.id+1));
 nextBondId=Math.max(1,...bonds.map(b=>b.id+1));
 render();
};

$("clearBtn").onclick=()=>{
 closeMoleculeMenu();
 if(!atoms.length&&!bonds.length)return;
 saveHistory();
 atoms=[];
 bonds=[];
 pendingAtom=null;
 render();
};

/* ATOM HELPERS */

function getAtom(id){return atoms.find(a=>a.id===id)}
function getRadius(a){return ATOM_RADIUS[a.element]||27}
function getBondsForAtom(a){
 return a?bonds.filter(b=>b.a===a.id||b.b===a.id):[];
}
function getValence(a){
 return getBondsForAtom(a).reduce((sum,b)=>sum+b.order,0);
}
function canAddBond(a,b,order){
 return !!a&&!!b&&
 getValence(a)+order<=(VALENCE[a.element]||4)&&
 getValence(b)+order<=(VALENCE[b.element]||4);
}

function findAtomAt(x,y){
 for(let i=atoms.length-1;i>=0;i--){
  const a=atoms[i];
  if(Math.hypot(a.x-x,a.y-y)<=getRadius(a)+8)return a;
 }
 return null;
}

function pointToSegmentDistance(px,py,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1;
 if(!dx&&!dy)return Math.hypot(px-x1,py-y1);
 const t=Math.max(0,Math.min(1,
  ((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
 return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}

function findBondAt(x,y){
 for(let i=bonds.length-1;i>=0;i--){
  const b=bonds[i],a=getAtom(b.a),c=getAtom(b.b);
  if(a&&c&&pointToSegmentDistance(x,y,a.x,a.y,c.x,c.y)<12)return b;
 }
 return null;
}

/* RENDER */

const atomElements=new Map();
const bondElements=new Map();
const NS="http://www.w3.org/2000/svg";

function svgElement(tag,cls){
 const el=document.createElementNS(NS,tag);
 if(cls)el.setAttribute("class",cls);
 return el;
}

function createAtomElement(a){
 const g=svgElement("g","atom");
 g.dataset.atomId=a.id;
 g.append(svgElement("circle","atom-circle"),svgElement("text","atom-label"));
 atomLayer.appendChild(g);
 atomElements.set(a.id,g);
 return g;
}

function updateAtomElement(a){
 let g=atomElements.get(a.id);
 if(!g)g=createAtomElement(a);
 g.setAttribute("transform",`translate(${a.x} ${a.y})`);
 g.querySelector(".atom-circle").setAttribute("r",getRadius(a));
 g.querySelector(".atom-label").textContent=a.element||"?";
 g.classList.toggle("pending",a.pending===true);
}

function createBondElement(b){
 const g=svgElement("g");
 g.dataset.bondId=b.id;
 bondLayer.appendChild(g);
 bondElements.set(b.id,g);
 return g;
}

function updateBondElement(b,g){
 const a=getAtom(b.a),c=getAtom(b.b);
 if(!a||!c)return;
 g.replaceChildren();

 const dx=c.x-a.x,dy=c.y-a.y;
 const length=Math.hypot(dx,dy);
 if(length===0)return;

 const ux=dx/length,uy=dy/length,nx=-uy,ny=ux;
 const x1=a.x+ux*getRadius(a),y1=a.y+uy*getRadius(a);
 const x2=c.x-ux*getRadius(c),y2=c.y-uy*getRadius(c);
 const spacing=6;
 const offsets=b.order===1?[0]:b.order===2?[-3,3]:[-spacing,0,spacing];

 offsets.forEach(offset=>{
  const line=svgElement("line","bond");
  line.setAttribute("x1",x1+nx*offset);
  line.setAttribute("y1",y1+ny*offset);
  line.setAttribute("x2",x2+nx*offset);
  line.setAttribute("y2",y2+ny*offset);
  g.appendChild(line);
 });
}

function render(){
 atomElements.forEach(el=>el.remove());
 bondElements.forEach(el=>el.remove());
 atomElements.clear();
 bondElements.clear();

 bonds.forEach(b=>updateBondElement(b,createBondElement(b)));
 atoms.forEach(a=>updateAtomElement(a));
 emptyState.classList.toggle("hidden",atoms.length>0);
}

function updateAtomAndItsBonds(a){
 updateAtomElement(a);
 getBondsForAtom(a).forEach(b=>{
  const g=bondElements.get(b.id);
  if(g)updateBondElement(b,g);
 });
}

/* BONDS */

function findBondBetween(a,b){
 return bonds.find(item=>
  (item.a===a.id&&item.b===b.id)||
  (item.a===b.id&&item.b===a.id));
}

function connectAtoms(a,b){
 if(!a||!b||a.id===b.id||a.pending||b.pending)return;
 const existing=findBondBetween(a,b);
 saveHistory();

 if(!existing){
  if(!canAddBond(a,b,1)){history.pop();return}
  bonds.push({id:nextBondId++,a:a.id,b:b.id,order:1});
 }else{
  const nextOrder=existing.order===3?1:existing.order+1;
  const va=getValence(a)-existing.order;
  const vb=getValence(b)-existing.order;
  if(va+nextOrder>(VALENCE[a.element]||4)||
     vb+nextOrder>(VALENCE[b.element]||4)){
   history.pop();return;
  }
  existing.order=nextOrder;
 }
 render();
}

function removeAtom(a){
 if(!a)return;
 saveHistory();
 if(pendingAtom&&pendingAtom.id===a.id)pendingAtom=null;
 bonds=bonds.filter(b=>b.a!==a.id&&b.b!==a.id);
 atoms=atoms.filter(item=>item.id!==a.id);
 render();
}
function removeBond(b){
 if(!b)return;
 saveHistory();
 bonds=bonds.filter(item=>item.id!==b.id);
 render();
}

/* STROKE HELPERS */

function strokeBounds(points){
 if(!points.length)return null;
 let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
 points.forEach(p=>{
  minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
  minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);
 });
 return {minX,maxX,minY,maxY,width:maxX-minX,height:maxY-minY};
}

function resampleStroke(points,count=32){
 if(points.length<2)return points.slice();
 const lengths=[0];let total=0;
 for(let i=1;i<points.length;i++){
  total+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);
  lengths.push(total);
 }
 if(total===0)return points.slice();
 const result=[];
 for(let i=0;i<count;i++){
  const target=total*i/(count-1);
  let index=1;
  while(index<lengths.length&&lengths[index]<target)index++;
  if(index>=lengths.length){result.push(points[points.length-1]);continue}
  const ratio=(target-lengths[index-1])/(lengths[index]-lengths[index-1]||1);
  const a=points[index-1],b=points[index];
  result.push({
   x:a.x+(b.x-a.x)*ratio,
   y:a.y+(b.y-a.y)*ratio
  });
 }
 return result;
}

function normalizeStroke(points){
 const sampled=resampleStroke(points,32);
 if(!sampled.length)return [];
 const box=strokeBounds(sampled);
 const size=Math.max(box.width,box.height,1);
 return sampled.map(p=>({
  x:(p.x-(box.minX+box.maxX)/2)/size,
  y:(p.y-(box.minY+box.maxY)/2)/size
 }));
}

/* CIRCLE RECOGNITION */

function isCircle(points){
 if(points.length<18)return false;
 const box=strokeBounds(points);
 if(!box||box.width<28||box.height<28)return false;
 if(Math.min(box.width,box.height)/Math.max(box.width,box.height)<.72)return false;

 const first=points[0],last=points[points.length-1];
 const diameter=Math.max(box.width,box.height);
 if(Math.hypot(first.x-last.x,first.y-last.y)>diameter*.28)return false;

 const cx=(box.minX+box.maxX)/2,cy=(box.minY+box.maxY)/2;
 const expectedRadius=(box.width+box.height)/4;
 let radialError=0,pathLength=0;

 points.forEach(p=>{
  radialError+=Math.abs(Math.hypot(p.x-cx,p.y-cy)-expectedRadius);
 });
 radialError/=points.length;
 if(radialError>expectedRadius*.24)return false;

 for(let i=1;i<points.length;i++){
  pathLength+=Math.hypot(
   points[i].x-points[i-1].x,
   points[i].y-points[i-1].y
  );
 }

 const ratio=pathLength/(Math.PI*diameter);
 return ratio>=.65&&ratio<=1.55;
}

/* C / H RECOGNITION */

function clamp01(v){return Math.max(0,Math.min(1,v))}
function rangeScore(v,min,max,tolerance){
 if(v>=min&&v<=max)return 1;
 return v<min?clamp01(1-(min-v)/tolerance):clamp01(1-(v-max)/tolerance);
}
function totalSafeRatio(v,total){return total>0?v/total:0}

function verticalLikeRatio(points){
 let total=0,vertical=0;
 for(let i=1;i<points.length;i++){
  const dx=points[i].x-points[i-1].x;
  const dy=points[i].y-points[i-1].y;
  const len=Math.hypot(dx,dy);
  if(len<.5)continue;
  total+=len;
  if(Math.abs(dy)>Math.abs(dx)*1.55)vertical+=len;
 }
 return totalSafeRatio(vertical,total);
}

function recognizeHScore(points){
 if(points.length<8)return 0;
 const box=strokeBounds(points);
 const width=box.width,height=box.height;
 if(width<10||height<14)return 0;

 const aspectScore=rangeScore(width/height,.25,1.20,.70);
 const cx=(box.minX+box.maxX)/2,cy=(box.minY+box.maxY)/2;
 let lc=0,rc=0,lmin=Infinity,lmax=-Infinity,rmin=Infinity,rmax=-Infinity;

 points.forEach(p=>{
  if(p.x<cx){
   lc++;lmin=Math.min(lmin,p.y);lmax=Math.max(lmax,p.y);
  }else{
   rc++;rmin=Math.min(rmin,p.y);rmax=Math.max(rmax,p.y);
  }
 });

 const balance=1-Math.min(1,Math.abs(lc/points.length-rc/points.length)*2.5);
 const lcoverage=clamp01(Math.max(0,lmax-lmin)/(height*.72));
 const rcoverage=clamp01(Math.max(0,rmax-rmin)/(height*.72));

 let total=0,vl=0,vr=0,ch=0,diag=0,horizontal=0,vertical=0;

 for(let i=1;i<points.length;i++){
  const a=points[i-1],b=points[i];
  const dx=Math.abs(b.x-a.x),dy=Math.abs(b.y-a.y);
  const len=Math.hypot(dx,dy);
  if(len<.5)continue;
  total+=len;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;

  if(dy>dx*1.55){
   vertical+=len;
   if(mx<cx-width*.18)vl+=len;
   if(mx>cx+width*.18)vr+=len;
  }
  if(dx>dy*1.70){
   horizontal+=len;
   if(Math.abs(my-cy)<height*.27)ch+=len;
  }
  if(dx>len*.30&&dy>len*.30)diag+=len;
 }
 if(!total)return 0;

 const structure=(clamp01((vl/total)/.20)+clamp01((vr/total)/.20))/2;
 const score=
  structure*.28+
  clamp01(ch/(width*.32))*.25+
  lcoverage*rcoverage*.15+
  balance*.08+
  aspectScore*.08+
  clamp01((vertical/total)/.38)*.07+
  clamp01(((vertical+horizontal)/total)/.72)*.05+
  clamp01(1-(diag/total)/.45)*.04;

 return clamp01(score);
}

function recognizeCScore(points){
 if(points.length<8)return 0;
 const box=strokeBounds(points);
 const width=box.width,height=box.height;
 if(width<8||height<10)return 0;

 const first=points[0],last=points[points.length-1];
 const endpointY=clamp01(Math.abs(first.y-last.y)/(height*.45));
 const endpointX=clamp01(1-Math.abs(first.x-last.x)/(width*.75));

 let pathLength=0,horizontal=0,diagonal=0;
 for(let i=1;i<points.length;i++){
  const dx=Math.abs(points[i].x-points[i-1].x);
  const dy=Math.abs(points[i].y-points[i-1].y);
  const len=Math.hypot(dx,dy);
  pathLength+=len;
  if(dx>dy*2.5)horizontal+=len;
  if(dx>len*.30&&dy>len*.30)diagonal+=len;
 }

 const direct=Math.hypot(last.x-first.x,last.y-first.y);
 const curvature=direct>0?clamp01((pathLength/direct-1.25)/1.10):0;
 const cx=(box.minX+box.maxX)/2,cy=(box.minY+box.maxY)/2;
 let left=0,upper=false,lower=false;

 points.forEach(p=>{
  if(p.x<cx)left++;
  if(p.y<cy-height*.12)upper=true;
  if(p.y>cy+height*.12)lower=true;
 });

 const leftRatio=left/points.length;
 const rightRatio=1-leftRatio;
 const hLike=verticalLikeRatio(points);
 const asymmetry=clamp01(1-Math.abs(leftRatio-rightRatio));

 const score=
  (endpointY*.65+endpointX*.35)*.19+
  curvature*.25+
  clamp01(leftRatio/.50)*.16+
  (upper&&lower?1:0)*.08+
  clamp01(1-totalSafeRatio(horizontal,pathLength)/.60)*.10+
  clamp01(1-totalSafeRatio(diagonal,pathLength)/.60)*.05+
  clamp01(curvature*(1-hLike))*.10+
  (1-asymmetry)*.07;

 return clamp01(score*(1-clamp01((hLike-.30)/.35)*.65));
}

function recognizeElement(points){
 if(points.length<8)return null;
 const h=recognizeHScore(points),c=recognizeCScore(points);
 if(h<.48&&c<.48)return null;
 if(h>=.52&&h>c+.08)return "H";
 if(c>=.52&&c>h+.08)return "C";
 if(h>=.70&&h>=c)return "H";
 if(c>=.70&&c>=h)return "C";
 return null;
}

/* PENDING ATOM */

function removePendingAtom(){
 if(!pendingAtom)return;
 const id=pendingAtom.id;
 bonds=bonds.filter(b=>b.a!==id&&b.b!==id);
 atoms=atoms.filter(a=>a.id!==id);
 pendingAtom=null;
}

function createPendingAtom(x,y){
 if(atoms.some(a=>!a.pending&&Math.hypot(a.x-x,a.y-y)<30))return null;
 saveHistory();
 if(pendingAtom)removePendingAtom();
 const a={id:nextAtomId++,x,y,element:"?",pending:true};
 atoms.push(a);
 pendingAtom=a;
 render();
 return a;
}

function finalizePendingAtom(a,element){
 if(!a)return;
 if(!element){
  a.element="?";a.pending=true;pendingAtom=a;
 }else{
  a.element=element;a.pending=false;pendingAtom=null;
 }
 render();
}

/* LIVE STROKE */

let currentStroke=[];

function drawLiveStroke(){
 strokeLayer.replaceChildren();
 if(currentStroke.length<2)return;
 const path=svgElement("path","rough-stroke");
 let d=`M ${currentStroke[0].x} ${currentStroke[0].y}`;
 for(let i=1;i<currentStroke.length;i++)
  d+=` L ${currentStroke[i].x} ${currentStroke[i].y}`;
 path.setAttribute("d",d);
 strokeLayer.appendChild(path);
}

function finalizeCreateStroke(){
 if(!currentStroke.length)return;
 const points=currentStroke.slice();
 currentStroke=[];
 strokeLayer.replaceChildren();

 if(isCircle(points)){
  const box=strokeBounds(points);
  createPendingAtom((box.minX+box.maxX)/2,(box.minY+box.maxY)/2);
  return;
 }

 if(pendingAtom){
  finalizePendingAtom(pendingAtom,recognizeElement(points));
  return;
 }

 const first=points[0],last=points[points.length-1];
 const a=findAtomAt(first.x,first.y);
 const b=findAtomAt(last.x,last.y);
 if(a&&b&&a.id!==b.id)connectAtoms(a,b);
}

/* CONNECTED MOLECULE */

function getConnectedMolecule(start){
 const connected=new Set();
 if(!start)return connected;
 const queue=[start.id];
 connected.add(start.id);

 while(queue.length){
  const id=queue.shift();
  bonds.forEach(b=>{
   const next=b.a===id?b.b:b.b===id?b.a:null;
   if(next!==null&&!connected.has(next)){
    connected.add(next);
    queue.push(next);
   }
  });
 }
 return connected;
}

let selectedMolecule=new Set();
let originalMoleculePositions=new Map();
let selectedAtom=null;

function prepareMoleculeDrag(){
 selectedMolecule=getConnectedMolecule(selectedAtom);
 originalMoleculePositions=new Map();
 selectedMolecule.forEach(id=>{
  const a=getAtom(id);
  if(a)originalMoleculePositions.set(id,{x:a.x,y:a.y});
 });
}

function updateMoleculeAndItsBonds(){
 selectedMolecule.forEach(id=>{
  const a=getAtom(id);
  if(a)updateAtomElement(a);
 });
 bonds.forEach(b=>{
  if(selectedMolecule.has(b.a)||selectedMolecule.has(b.b)){
   const g=bondElements.get(b.id);
   if(g)updateBondElement(b,g);
  }
 });
}

/* COPY / PASTE */

function copyMolecule(start){
 if(!start||start.pending)return false;
 const ids=getConnectedMolecule(start);
 const sourceAtoms=atoms.filter(a=>ids.has(a.id));
 const sourceBonds=bonds.filter(b=>ids.has(b.a)&&ids.has(b.b));
 if(!sourceAtoms.length)return false;

 const center=sourceAtoms.reduce(
  (p,a)=>({x:p.x+a.x,y:p.y+a.y}),
  {x:0,y:0}
 );
 center.x/=sourceAtoms.length;
 center.y/=sourceAtoms.length;

 moleculeClipboard={
  atoms:sourceAtoms.map(a=>({
   sourceId:a.id,x:a.x-center.x,y:a.y-center.y,element:a.element
  })),
  bonds:sourceBonds.map(b=>({a:b.a,b:b.b,order:b.order}))
 };
 status.textContent="Molecule copied";
 return true;
}

function hasMoleculeClipboard(){
 return !!(moleculeClipboard&&moleculeClipboard.atoms?.length);
}

function pasteMolecule(x,y){
 if(!hasMoleculeClipboard())return false;
 saveHistory();
 const ids=new Map();

 const newAtoms=moleculeClipboard.atoms.map(a=>{
  const id=nextAtomId++;
  ids.set(a.sourceId,id);
  return {id,x:x+a.x,y:y+a.y,element:a.element,pending:false};
 });

 const newBonds=moleculeClipboard.bonds.map(b=>({
  id:nextBondId++,a:ids.get(b.a),b:ids.get(b.b),order:b.order
 })).filter(b=>b.a!==undefined&&b.b!==undefined);

 atoms.push(...newAtoms);
 bonds.push(...newBonds);
 pendingAtom=null;
 render();
 status.textContent="Molecule pasted";
 return true;
}

/* MENU */

function positionMoleculeMenu(x,y){
 const rect=$("workspace").getBoundingClientRect();
 const width=180,height=150;
 const left=Math.max(10,Math.min(x,rect.width-width-10));
 const top=Math.max(10,y+height>rect.height-10?y-height:y);
 moleculeMenu.style.left=`${left}px`;
 moleculeMenu.style.top=`${top}px`;
}

function openMoleculeMenu(atom,x,y){
 selectedAtom=atom||null;
 moleculeMenuAtom=atom||null;
 selectedMolecule=atom?getConnectedMolecule(atom):new Set();
 moleculeMenuAnchor={x,y};
 positionMoleculeMenu(x,y);
 moleculeMenu.classList.add("visible");
 $("copyMoleculeBtn").classList.toggle("disabled",!atom||atom.pending);
 $("pasteMoleculeBtn").classList.remove("disabled");
 status.textContent="Molecule menu";
}

function closeMoleculeMenu(){
 moleculeMenu.classList.remove("visible");
 moleculeMenuAnchor=null;
 moleculeMenuAtom=null;
}

$("copyMoleculeBtn").onclick=()=>{
 if(moleculeMenuAtom&&!moleculeMenuAtom.pending)
  copyMolecule(moleculeMenuAtom);
 closeMoleculeMenu();
};

$("pasteMoleculeBtn").onclick=()=>{
 if(!hasMoleculeClipboard()){
  status.textContent="Nothing to paste";
  return;
 }
 if(!moleculeMenuAnchor||!canPasteNow())return;
 pasteMolecule(moleculeMenuAnchor.x+80,moleculeMenuAnchor.y+80);
 closeMoleculeMenu();
};

$("closeMenuBtn").onclick=closeMoleculeMenu;

document.addEventListener("pointerdown",e=>{
 if(moleculeMenu.classList.contains("visible")&&!moleculeMenu.contains(e.target))
  closeMoleculeMenu();
});

/* POINTER ENGINE */

let activePointer=null;
let dragStart=null;
let originalAtomPosition=null;
let longPressTimer=null;
let longPressTriggered=false;
let movementStarted=false;
let historySavedForDrag=false;
let pencilMenuTriggered=false;
let bondBreakTriggered=false;
let velocitySamples=[];

const LONG_PRESS_DURATION=550;
const LONG_PRESS_MOVE_THRESHOLD=10;

function getInteractionType(e){
 if(e.pointerType==="pen")return "create";
 if(e.pointerType==="touch")return "move";
 return manualMode;
}

function getCanvasPoint(e){
 const rect=canvas.getBoundingClientRect();
 return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

function cancelLongPress(){
 if(longPressTimer!==null){
  clearTimeout(longPressTimer);
  longPressTimer=null;
 }
}

function startLongPress(){
 cancelLongPress();
 longPressTimer=setTimeout(()=>{
  longPressTimer=null;
  if(movementStarted||!selectedAtom)return;
  longPressTriggered=true;
  prepareMoleculeDrag();
  status.textContent="Molecule selected · Drag to move";
 },LONG_PRESS_DURATION);
}

function startPencilMenuLongPress(point,atom){
 cancelLongPress();
 longPressTimer=setTimeout(()=>{
  longPressTimer=null;
  if(movementStarted)return;
  pencilMenuTriggered=true;
  currentStroke=[];
  strokeLayer.replaceChildren();
  openMoleculeMenu(atom||null,point.x,point.y);
 },LONG_PRESS_DURATION);
}

/* VELOCITY TRACKING */

function resetVelocity(point,time){
 velocitySamples=[{x:point.x,y:point.y,t:time}];
}

function addVelocitySample(point,time){
 const last=velocitySamples[velocitySamples.length-1];
 if(last&&time<=last.t)return;

 velocitySamples.push({x:point.x,y:point.y,t:time});

 while(
  velocitySamples.length>2 &&
  time-velocitySamples[1].t>BOND_BREAK_WINDOW_MS
 ){
  velocitySamples.shift();
 }

 if(velocitySamples.length>30)velocitySamples.shift();
}

function getFingerVelocity(){
 if(velocitySamples.length<2)return null;

 const first=velocitySamples[0];
 const last=velocitySamples[velocitySamples.length-1];
 const elapsed=last.t-first.t;

 if(elapsed<=0)return null;

 const vx=(last.x-first.x)/elapsed;
 const vy=(last.y-first.y)/elapsed;

 return {vx,vy,speed:Math.hypot(vx,vy)};
}

/* STRICT DIRECTIONAL BOND BREAK */

function tryBreakTerminalBond(atom){
 if(!atom||atom.pending||bondBreakTriggered||longPressTriggered)return false;

 const attached=getBondsForAtom(atom);

 // Si staccano solo atomi terminali, con un solo legame.
 if(attached.length!==1)return false;

 const bond=attached[0];
 const neighbor=getAtom(bond.a===atom.id?bond.b:bond.a);
 if(!neighbor)return false;

 const velocity=getFingerVelocity();
 if(!velocity)return false;

 // Vettore unitario dal vicino verso l'atomo trascinato.
 const dx=atom.x-neighbor.x;
 const dy=atom.y-neighbor.y;
 const length=Math.hypot(dx,dy);
 if(length<1)return false;

 const outwardX=dx/length;
 const outwardY=dy/length;

 // Proiezione della velocità sulla direzione uscente.
 const outwardSpeed=
  velocity.vx*outwardX+
  velocity.vy*outwardY;

 // Quanto il movimento è allineato al vettore uscente.
 const directionAlignment=
  velocity.speed>0
   ?outwardSpeed/velocity.speed
   :0;

 /*
  DISTACCO SOLTANTO SE TUTTE LE CONDIZIONI SONO VERE.

  Nessuna distanza minima totale.
  Un movimento laterale o verso il vicino non stacca il legame.
 */
 if(
  velocity.speed<BOND_BREAK_SPEED ||
  outwardSpeed<BOND_BREAK_OUTWARD_SPEED ||
  directionAlignment<BOND_BREAK_MIN_ALIGNMENT
 ){
  return false;
 }

 bonds=bonds.filter(b=>b.id!==bond.id);
 bondBreakTriggered=true;

 render();
 status.textContent="Bond broken · Atom detached";
 return true;
}

/* RESET POINTER STATE */

function resetPointerState(){
 cancelLongPress();
 activePointer=null;
 selectedAtom=null;
 selectedMolecule=new Set();
 dragStart=null;
 originalAtomPosition=null;
 originalMoleculePositions=new Map();
 longPressTriggered=false;
 movementStarted=false;
 historySavedForDrag=false;
 pencilMenuTriggered=false;
 bondBreakTriggered=false;
 velocitySamples=[];
}

/* POINTER DOWN */

canvas.addEventListener("pointerdown",e=>{
 registerPointer(e);
 if(shouldIgnoreTouch(e))return;

 e.preventDefault();
 if(activePointer&&activePointer.id!==e.pointerId)return;

 const point=getCanvasPoint(e);
 const interaction=getInteractionType(e);

 resetPointerState();

 activePointer={
  id:e.pointerId,
  type:interaction,
  pointerType:e.pointerType
 };

 try{canvas.setPointerCapture(e.pointerId)}catch(error){}

 if(manualMode==="erase"&&e.pointerType!=="pen"){
  const atom=findAtomAt(point.x,point.y);
  if(atom)removeAtom(atom);
  else{
   const bond=findBondAt(point.x,point.y);
   if(bond)removeBond(bond);
  }
  resetPointerState();
  unregisterPointer(e);
  return;
 }

 if(interaction==="move"){
  const atom=findAtomAt(point.x,point.y);

  if(!atom){
   if(hasMoleculeClipboard()&&canPasteNow())
    pasteMolecule(point.x,point.y);
   resetPointerState();
   unregisterPointer(e);
   return;
  }

  selectedAtom=atom;
  dragStart={...point};
  originalAtomPosition={x:atom.x,y:atom.y};
  resetVelocity(point,performance.now());
  prepareMoleculeDrag();
  startLongPress();
  return;
 }

 if(interaction==="create"){
  selectedAtom=findAtomAt(point.x,point.y);
  dragStart={...point};
  startPencilMenuLongPress(point,selectedAtom);
 }
},{passive:false});

/* POINTER MOVE */

canvas.addEventListener("pointermove",e=>{
 if(!activePointer||activePointer.id!==e.pointerId)return;
 e.preventDefault();

 const point=getCanvasPoint(e);

 /* FINGER */

 if(activePointer.type==="move"&&selectedAtom){
  const dx=point.x-dragStart.x;
  const dy=point.y-dragStart.y;
  const movementDistance=Math.hypot(dx,dy);

  if(!longPressTriggered&&movementDistance>LONG_PRESS_MOVE_THRESHOLD)
   cancelLongPress();

  if(!longPressTriggered){
   if(!historySavedForDrag&&movementDistance>0){
    saveHistory();
    historySavedForDrag=true;
   }

   selectedAtom.x=originalAtomPosition.x+dx;
   selectedAtom.y=originalAtomPosition.y+dy;

   addVelocitySample(point,performance.now());

   // Nessun controllo sulla distanza: conta solo il flick direzionale.
   tryBreakTerminalBond(selectedAtom);

   movementStarted=movementDistance>0;
   updateAtomAndItsBonds(selectedAtom);
   return;
  }

  /* LONG PRESS: MOVE WHOLE MOLECULE */

  if(!historySavedForDrag&&movementDistance>0){
   saveHistory();
   historySavedForDrag=true;
  }

  selectedMolecule.forEach(id=>{
   const atom=getAtom(id);
   const original=originalMoleculePositions.get(id);
   if(!atom||!original)return;
   atom.x=original.x+dx;
   atom.y=original.y+dy;
  });

  movementStarted=movementDistance>0;
  updateMoleculeAndItsBonds();
  return;
 }

 /* PENCIL */

 if(activePointer.type==="create"){
  if(!pencilMenuTriggered&&currentStroke.length===0&&dragStart){
   const dx=point.x-dragStart.x;
   const dy=point.y-dragStart.y;

   if(Math.hypot(dx,dy)>LONG_PRESS_MOVE_THRESHOLD){
    cancelLongPress();
    const startPoint={...dragStart};
    selectedAtom=null;
    moleculeClipboard=null;
    currentStroke=[startPoint,point];
    dragStart=null;
    movementStarted=true;
    drawLiveStroke();
   }
   return;
  }

  if(pencilMenuTriggered)return;
  currentStroke.push(point);
  drawLiveStroke();
 }
},{passive:false});

/* POINTER FINISH */

function finishPointer(e){
 if(!activePointer||activePointer.id!==e.pointerId){
  unregisterPointer(e);
  return;
 }

 e.preventDefault();
 cancelLongPress();

 if(activePointer.type==="create"){
  if(pencilMenuTriggered){
   currentStroke=[];
   strokeLayer.replaceChildren();
  }else if(currentStroke.length){
   finalizeCreateStroke();
  }
 }

 if(activePointer.type==="move")
  status.textContent="Pencil creates · Finger moves";

 try{
  if(canvas.hasPointerCapture(e.pointerId))
   canvas.releasePointerCapture(e.pointerId);
 }catch(error){}

 resetPointerState();
 unregisterPointer(e);
}

canvas.addEventListener("pointerup",finishPointer,{passive:false});
canvas.addEventListener("pointercancel",finishPointer,{passive:false});

/* SAFARI / iPadOS */

["touchstart","touchmove","touchend","touchcancel"].forEach(type=>{
 canvas.addEventListener(type,e=>e.preventDefault(),{passive:false});
});

/* INITIAL RENDER */

render();
status.textContent="Pencil creates · Finger moves";
</script>
</body>
</html>
